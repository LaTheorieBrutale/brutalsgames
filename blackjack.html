<!doctype html>
<html lang="fr" data-title="gn_bj">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b2a20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brutal's Games">
<title>Blackjack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titan+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Blackjack — « Le Casino Royal » : tapis vert, bois verni, jetons et lumières tamisées.
   Écrans : accueil, salon, table, fin. Le croupier est géré par l'hôte de la partie. */
:root{
  --bg1:#07150f;--bg2:#13261d;--ink:#0a0806;--panel:#2a1c14;--panel2:#1d130d;--line:#4a3424;--text:#f6ecd8;--muted:#c2ad8e;
  --felt:#11603f;--felt2:#0b4a30;--wood:#6a3c20;--wood2:#3e2210;--gold:#f2c14e;--gold2:#c8902a;--red:#e04848;--red2:#a82a2a;--green:#5cd65c;--blue:#4aa3ff;
  --card:#fbf5e8;--card2:#ece2cc;
  --f-title:"Titan One","Arial Black",system-ui,sans-serif;--f-ui:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;color:var(--text);font-family:var(--f-ui);font-weight:700;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(ellipse at 50% -10%,rgba(255,200,110,.18),transparent 55%),radial-gradient(ellipse at 50% 120%,rgba(17,96,63,.5),transparent 60%),
    repeating-linear-gradient(45deg,rgba(255,255,255,.015) 0 10px,transparent 10px 20px),linear-gradient(180deg,var(--bg1),var(--bg2)) fixed;background-color:var(--bg1)}
[hidden]{display:none!important}
#deco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#deco svg{position:absolute}
.frame{position:relative;background:linear-gradient(180deg,var(--panel),var(--panel2));border:4px solid var(--ink);border-radius:22px;box-shadow:0 7px 0 var(--ink)}
.btn{position:relative;font-family:var(--f-ui);font-weight:900;font-size:17px;color:var(--ink);cursor:pointer;line-height:1.1;text-decoration:none;
  background:linear-gradient(180deg,#f3e6cc 0,#d8c09a 55%,#b89c70 100%);border:4px solid var(--ink);border-radius:15px;padding:9px 14px 8px;
  box-shadow:0 5px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.4);transition:transform .07s,box-shadow .07s,filter .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.4)}
@media (hover:hover){.btn:hover{filter:brightness(1.07)}}
.btn:disabled{opacity:.42;cursor:default;transform:none}
.btn.gold{background:linear-gradient(180deg,#fff0b8 0,var(--gold) 55%,var(--gold2) 100%)}
.btn.red{background:linear-gradient(180deg,#ffb8b8 0,var(--red) 55%,var(--red2) 100%);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn.green{background:linear-gradient(180deg,#c8f5b8 0,#5cc24a 55%,#3a8a2c 100%);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn.blue{background:linear-gradient(180deg,#bfe0ff 0,var(--blue) 55%,#2a74c8 100%);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn.icon{padding:7px;border-radius:13px;flex:none}
.btn.icon svg{width:24px;height:24px}
.btn.wide{width:100%;padding:13px 14px 11px}
.btn.sm{font-size:14px;padding:7px 10px 6px}
.field{font-family:var(--f-ui);font-weight:800;font-size:18px;color:var(--text);background:var(--panel2);border:4px solid var(--ink);border-radius:14px;padding:9px 12px 8px;width:100%;min-width:0;outline:none;-webkit-user-select:text;user-select:text;box-shadow:inset 0 3px 0 rgba(0,0,0,.25)}
.field::placeholder{color:var(--muted)}
.field:focus{border-color:var(--gold)}
.field.code{text-transform:uppercase;letter-spacing:.3em;text-align:center}
label,.lbl{font-size:12.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:900}
.sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.sep::before,.sep::after{content:"";flex:1;height:3px;border-radius:2px;background:var(--line)}
.err{margin:0;color:#ff9a9a;font-size:14px;min-height:1em}
.nseg{display:flex;gap:6px;flex-wrap:wrap}
.nseg .btn{flex:1;padding:8px 4px 7px;font-size:14px;background:var(--panel2);color:var(--text);box-shadow:0 3px 0 var(--ink);min-width:0}
.nseg .btn[aria-pressed="true"]{background:linear-gradient(180deg,#fff0b8,var(--gold) 60%,var(--gold2));color:var(--ink)}
.nseg .btn:disabled{opacity:1}
.screen{position:fixed;inset:0;z-index:1;overflow-y:auto;display:flex;padding:16px;padding-block:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 70px);animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}}
.col{width:100%;max-width:470px;margin:auto;display:flex;flex-direction:column;gap:14px;align-items:stretch}
.topnav{display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel{padding:16px;display:flex;flex-direction:column;gap:11px}
.row{display:flex;gap:8px;align-items:center}
.logo{display:flex;flex-direction:column;align-items:center;animation:drop .7s cubic-bezier(.2,1.5,.4,1) both}
@keyframes drop{from{opacity:0;transform:translateY(-40px) scale(.85)}}
.logo svg{width:180px;height:116px;filter:drop-shadow(0 6px 0 var(--ink));animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotate(-2deg)}}
.logo-t{font-family:var(--f-title);font-size:clamp(46px,13vw,70px);line-height:.95;margin-top:-4px;letter-spacing:.02em;color:var(--gold);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
.logo-t span{color:#fff}
.tagline{font-size:15px;margin-top:8px;background:var(--panel);border:3px solid var(--ink);border-radius:999px;padding:3px 14px 2px;box-shadow:0 3px 0 var(--ink);transform:rotate(-1.5deg)}
.mode{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px 10px;border-radius:20px;text-align:left;justify-content:flex-start}
.mode svg{width:42px;height:42px;flex:none}
.mode span{display:flex;flex-direction:column;gap:2px;min-width:0}
.mode b{font-weight:900;font-size:20px}
.mode small{font-size:12.5px;font-weight:700;opacity:.85}
.bigcode{font-family:var(--f-title);font-size:54px;letter-spacing:.18em;color:var(--gold);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);text-align:center;padding-left:.18em;line-height:1}
.wait-txt{margin:0;font-size:14px;color:var(--muted);text-align:center;line-height:1.45}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.plist{display:flex;flex-wrap:wrap;gap:6px}
.pl{display:flex;align-items:center;gap:6px;font-size:14.5px;background:rgba(0,0,0,.25);border-radius:12px;padding:3px 9px 3px 3px;min-width:0}
.pl svg{width:30px;height:30px;flex:none}
.pl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setrow{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center}

/* ---------- Table en demi-cercle (vue du joueur, comme au casino) ---------- */
#game{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;gap:7px;padding:8px 8px;padding-block:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-bottom,0px) + 8px);max-width:980px;margin:0 auto}
.hud{display:flex;align-items:center;gap:7px;padding:6px 8px;flex:none}
.hud .mid{flex:1;min-width:0;text-align:center;line-height:1.1}
.hud .mid small{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.hud .mid b{display:block;font-family:var(--f-title);font-size:17px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bank{display:flex;align-items:center;gap:5px;font-family:var(--f-title);font-size:19px;color:var(--gold);background:rgba(0,0,0,.35);border:3px solid var(--ink);border-radius:12px;padding:2px 9px 0}
.bank i{display:inline-block;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle,#fff0b8 0 30%,var(--gold) 32% 60%,var(--gold2) 62%);border:2.5px solid var(--ink)}
.table{position:relative;flex:1;min-height:0}
.felt{position:absolute;inset:0;border:5px solid var(--ink);border-radius:22px 22px 50% 50%/22px 22px 64% 64%;overflow:hidden;
  background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.1),transparent 60%),repeating-radial-gradient(circle at 50% 30%,rgba(0,0,0,.03) 0 2px,transparent 2px 5px),linear-gradient(180deg,#1f4f9a,#163a78 60%,#112e62);
  box-shadow:inset 0 0 0 12px #5a3420,inset 0 0 0 15px var(--ink),inset 0 -6px 0 15px rgba(0,0,0,.25),inset 0 0 50px 22px rgba(0,0,0,.35),0 8px 0 var(--ink)}
.felt svg.deco{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.felt svg.deco text{font-family:var(--f-title);letter-spacing:.14em;fill:#f2a83e}
.felt svg.deco .t2{fill:rgba(255,255,255,.55);letter-spacing:.12em}
.felt svg.deco .band{fill:none;stroke:#f2a83e;stroke-width:2.5}
.tray{position:absolute;left:50%;top:9px;transform:translateX(-50%);display:flex;gap:2px;padding:4px 6px;background:#2a1a10;border:3px solid var(--ink);border-radius:8px;z-index:1}
.tray i{width:9px;height:24px;border-radius:3px;border:1.5px solid rgba(0,0,0,.6);background:repeating-linear-gradient(180deg,var(--c) 0 3px,rgba(255,255,255,.7) 3px 4px)}
.shoe{position:absolute;right:7%;top:16px;width:38px;height:30px;border:3px solid var(--ink);border-radius:6px;background:linear-gradient(180deg,#3a3a3a,#1a1a1a);transform:rotate(-8deg);z-index:1}
.shoe::after{content:"";position:absolute;left:4px;top:4px;width:22px;height:16px;border-radius:3px;background:repeating-linear-gradient(45deg,#8a2030 0 4px,#a82a3a 4px 8px);border:1.5px solid #f2c14e}
.dealer{position:absolute;left:50%;top:52px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px;z-index:2}
.dealer .cards{--cw:clamp(46px,11vw,72px)}
.zlabel{display:flex;align-items:center;gap:6px;font-size:12px;color:#e6eefc;text-transform:uppercase;letter-spacing:.07em}
.tot{font-family:var(--f-title);font-size:15px;letter-spacing:.02em;background:rgba(0,0,0,.55);border:2.5px solid var(--ink);border-radius:9px;padding:0 7px;color:#fff;text-transform:none;white-space:nowrap}
.tot.bust{background:var(--red)}.tot.bj{background:var(--gold);color:var(--ink)}.tot.t21{background:var(--green);color:var(--ink)}
.cards{display:flex;justify-content:center;min-height:calc(var(--cw) * 1.4);--cw:clamp(44px,12vw,62px)}
.cards .cd+.cd{margin-left:calc(var(--cw) * -0.45)}
.cd{position:relative;width:var(--cw);height:calc(var(--cw) * 1.4);border:2.5px solid var(--ink);border-radius:calc(var(--cw) * .14);background:linear-gradient(180deg,var(--card),var(--card2));box-shadow:0 3px 0 rgba(0,0,0,.45);flex:none;color:#1c1620;overflow:hidden}
.cd.r{color:#cf2f3a}
.cd .ix{position:absolute;left:8%;top:3%;display:flex;flex-direction:column;align-items:center;line-height:.9;font-family:var(--f-title);font-size:calc(var(--cw) * .34)}
.cd .ix small{font-size:.8em}
.cd .big{position:absolute;right:6%;bottom:3%;font-size:calc(var(--cw) * .56);line-height:1}
.cd.back{background:repeating-linear-gradient(45deg,#8a2030 0 6px,#a82a3a 6px 12px);box-shadow:inset 0 0 0 4px #f2c14e,inset 0 0 0 6px #6a1020,0 3px 0 rgba(0,0,0,.45)}
.cd.back::after{content:"♠";position:absolute;inset:0;display:grid;place-items:center;color:#f2c14e;font-size:calc(var(--cw) * .45);text-shadow:0 2px 0 #4a0a14}
.cd.new{animation:deal .38s cubic-bezier(.2,1.2,.4,1) both}
@keyframes deal{from{transform:translate(0,-160px) rotate(-25deg) scale(.6);opacity:0}}
/* places des joueurs, posées sur l'arc */
.spot{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:3px;z-index:2;--cw:clamp(34px,8.6vw,56px);transition:left .4s,top .4s}
.spot.me{--cw:clamp(50px,13vw,78px);z-index:3}
@media (max-aspect-ratio:3/4){.spot{--cw:clamp(28px,8vw,56px)}.spot .tag{font-size:11.5px;max-width:110px}.spot .tag{margin-top:2px}}
.spot .hands{display:flex;gap:8px;align-items:flex-end}
.spot .hand{display:flex;flex-direction:column;align-items:center;gap:3px;padding:3px;border-radius:12px;border:3px solid transparent}
.spot .hand.act{border-color:var(--gold);background:rgba(242,193,78,.12);box-shadow:0 0 18px rgba(242,193,78,.45)}
.spot .cards{--cw:inherit}
.spot .hinfo{display:flex;gap:4px;align-items:center;min-height:20px}
.circles{display:flex;align-items:center;gap:4px}
.bc{position:relative;display:grid;place-items:center;width:calc(var(--cw) * .95);height:calc(var(--cw) * .95);border-radius:50%;border:2.5px solid rgba(255,255,255,.75);background:rgba(0,0,0,.12)}
.bc.sm{width:calc(var(--cw) * .62);height:calc(var(--cw) * .62);border-color:rgba(242,168,62,.85)}
.bc .lb{position:absolute;top:100%;margin-top:1px;font-size:8.5px;line-height:1;letter-spacing:.04em;color:rgba(255,255,255,.8);white-space:nowrap;text-transform:uppercase;text-align:center;font-weight:900}
.circles{margin-bottom:16px}
.bc .chip{width:86%;height:86%;font-size:calc(var(--cw) * .2)}
.spot.turn .bc:not(.sm){border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,193,78,.4),0 0 16px rgba(242,193,78,.6)}
.tag{display:flex;align-items:center;gap:4px;margin-top:9px;font-size:12.5px;background:rgba(10,8,6,.72);border:2px solid var(--ink);border-radius:999px;padding:1px 8px 1px 2px;max-width:130px;white-space:nowrap}
.tag svg{width:20px;height:20px;flex:none}
.tag span{overflow:hidden;text-overflow:ellipsis}
.tag small{color:var(--gold);font-size:11px}
.spot.me .tag{border-color:var(--gold)}
.st{font-size:11.5px;min-height:14px;color:#e6eefc;text-shadow:0 1px 0 #000}
.sideb{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:160px}
.sideb span{font-size:10.5px;padding:1px 6px;border-radius:999px;border:2px solid var(--ink);background:rgba(0,0,0,.55)}
.sideb span.w{background:var(--gold);color:var(--ink);animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.chip{position:relative;width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--f-title);font-size:12px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.6);flex:none;
  background:radial-gradient(circle,var(--c) 0 42%,#fff 43% 48%,var(--c) 49%),conic-gradient(#fff 0 8%,var(--c) 8% 25%,#fff 25% 33%,var(--c) 33% 50%,#fff 50% 58%,var(--c) 58% 75%,#fff 75% 83%,var(--c) 83%);box-shadow:0 3px 0 var(--ink)}
.res{font-family:var(--f-title);font-size:16px;letter-spacing:.03em;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.spot.me .res{font-size:20px}
.res.win,.res.bj{color:var(--gold)}.res.lose,.res.bust{color:#ff8a8a}.res.push{color:#d8e6ff}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.action{flex:none;padding:8px 10px;display:flex;flex-direction:column;gap:7px}
.action .hint{margin:0;font-size:13.5px;color:var(--muted);text-align:center}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.acts .btn{padding:10px 4px 9px;font-size:15px;flex-direction:column;gap:1px}
.acts .btn small{font-size:10.5px;font-weight:800;opacity:.85}
.chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.chips button{background:none;border:0;padding:0;cursor:pointer;transition:transform .08s}
.chips button:active{transform:scale(.88)}
.chips button:disabled{opacity:.35;cursor:default}
.chips .chip{width:48px;height:48px;font-size:15px}
.tgts{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px}
.tgts button{font:inherit;font-weight:900;font-size:13px;color:var(--text);background:rgba(0,0,0,.3);border:3px solid var(--ink);border-radius:12px;padding:5px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.1}
.tgts button b{font-family:var(--f-title);font-weight:400;font-size:18px;color:var(--gold)}
.tgts button small{font-size:9.5px;color:var(--muted);font-weight:800}
.tgts button.on{border-color:var(--gold);background:rgba(242,193,78,.18);box-shadow:0 0 0 2px rgba(242,193,78,.35)}
.tbar{height:7px;border-radius:4px;background:rgba(0,0,0,.4);overflow:hidden;border:2px solid var(--ink)}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ff9a3c);transform-origin:left;transition:transform .25s linear}
.log{font-size:12.5px;color:var(--muted);text-align:center;margin:0;min-height:1em}
.paytab{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px}
.paytab div{background:rgba(0,0,0,.25);border-radius:10px;padding:6px 9px}
.paytab b{display:block;color:var(--gold);margin-bottom:3px}
.paytab span{display:flex;justify-content:space-between;gap:6px}

/* ---------- Bulle d'aide (survol à la souris, appui long au doigt) ---------- */
#tip{position:fixed;z-index:50;max-width:min(300px,calc(100vw - 20px));background:#1a120c;color:var(--text);border:3px solid var(--gold);border-radius:12px;padding:8px 11px;font-size:13.5px;line-height:1.4;box-shadow:0 5px 0 var(--ink),0 10px 24px rgba(0,0,0,.5);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
#tip.show{opacity:1;transform:none}
[data-tip]{cursor:help}
.tgts button[data-tip],.acts .btn[data-tip]{cursor:pointer}
/* ---------- Fin ---------- */
.banner{font-family:var(--f-title);font-size:clamp(30px,9vw,48px);text-align:center;line-height:1.05;color:var(--gold);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);transform:rotate(-2deg);animation:drop .6s cubic-bezier(.2,1.5,.4,1) both}
.ranks{display:flex;flex-direction:column;gap:5px}
.ranks .pl{justify-content:flex-start;font-size:16px}
.ranks .pl b{margin-left:auto;color:var(--gold);font-family:var(--f-title);font-weight:400}

/* ---------- Chat ---------- */
.rchat{position:fixed;z-index:22;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);transform:translateX(-50%);width:min(460px,calc(100% - 20px));height:min(62vh,460px);display:flex;flex-direction:column;gap:8px;padding:10px;animation:fadeIn .2s}
.rc-head{display:flex;align-items:center;justify-content:space-between;font-family:var(--f-title);font-size:24px}
.rc-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding:6px;border-radius:12px;background:rgba(0,0,0,.25);font-size:14.5px;line-height:1.35}
.rc-msg{display:flex;gap:6px;align-items:flex-start;overflow-wrap:anywhere}
.rc-msg svg{width:26px;height:26px;flex:none}
.rc-msg b{margin-right:4px}
.rc-msg.me{flex-direction:row-reverse;text-align:right}
.rc-msg .bub{background:var(--panel2);border:2px solid var(--ink);border-radius:12px;padding:3px 9px;max-width:80%}
.rc-msg.me .bub{background:rgba(242,193,78,.18)}
.rc-msg.sys{justify-content:center;color:var(--muted);font-size:12.5px}
.rc-empty{margin:auto;color:var(--muted);font-size:13px;text-align:center}
.rc-form{display:flex;gap:6px}
.rc-form .field{font-size:16px;padding:8px 10px}
.tr{cursor:help}.tr::after{content:" 🌐";font-size:10px;opacity:.65}
.chatbar{position:relative;display:flex;align-items:center;gap:8px;width:100%;padding:7px 12px;font:inherit;font-size:14px;color:var(--text);cursor:pointer;text-align:left;box-shadow:0 4px 0 var(--ink);border-radius:16px;flex:none}
.chatbar .cb-ico{font-size:19px;flex:none}

}

let localBet = null, betKey = '', tgt = 'a';
function renderAction(me, myTurn) {

    const canD = two && me.chips >= hd.bet, canS = two && me.hands.length === 1 && val(hd.cards[0]) === val(hd.cards[1]) && me.chips >= hd.bet;
    h = `<div class="acts"><button class="btn green" data-act="hit">${t('hit')}<small>${t('hitS')}</small></button><button class="btn red" data-act="stand">${t('stand')}<small>${t('standS')}</small></button>
      <button class="btn gold" data-act="double" ${canD ? '' : 'disabled'}>${t('double')}<small>${t('doubleS')}</small></button><button class="btn blue" data-act="split" ${canS ? '' : 'disabled'}>${t('split')}<small>${t('splitS')}</small></button></div><div class="tbar"><i id="tbar"></i></div>`;
  } else if (V.phase === 'play') h = `<p class="hint">${esc(t('turnOf', { name: (V.seats[V.turn] || {}).n || '' }))}</p><div class="tbar"><i id="tbar"></i></div>`;
  else if (V.phase === 'dealer') h = `<p class="hint dots">${t('dealerTurn')}</p>`;
  else if (V.phase === 'result') h = `<p class="hint">${t('results')}</p><div class="tbar"><i id="tbar"></i></div>`;
  else h = `<p class="hint">${me.broke ? t('brokeMe') : t('watching')}</p>`;
  if (A.dataset.k === k && V.phase !== 'bet') { localDeadline = Date.now() + (V.rem || 0); return; }
  A.dataset.k = k; A.innerHTML = h; localDeadline = Date.now() + (V.rem || 0); localDur = V.phase === 'bet' ? BET_MS : V.phase === 'result' ? RES_MS : V.phase === 'ins' ? INS_MS : TURN_MS;

let localDeadline = 0, localDur = 1;

const sendBet = ready => { const L = localBet; send(Object.assign({ t: 'bet', a: L.a, pp: L.pp, t3: L.t3 }, ready === undefined ? {} : { ready })); };
const reBet = me => { if (net.role !== 'host') renderAction(Object.assign({}, me, { bet: localBet.a, pp: localBet.pp, t3: localBet.t3 }), false); };
$('#action').addEventListener('click', e => {
  if (!V) return; const me = V.seats[net.me] || {};
  const tg = e.target.closest('[data-tgt]');
  if (tg && V.phase === 'bet' && !me.ready) { tgt = tg.dataset.tgt; P.sfx('click'); $('#action').dataset.k = ''; renderAction(Object.assign({}, me, { bet: localBet.a, pp: localBet.pp, t3: localBet.t3 }), false); return; }
  const ch = e.target.closest('[data-chip]');
  if (ch && !ch.disabled && V.phase === 'bet' && !me.ready) {
    const v = +ch.dataset.chip, L = localBet; if (L.a + L.pp + L.t3 + v > me.chips) return;
    L[tgt] += v; sChip(); sendBet(); reBet(me); return;
  }
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  if (b.id === 'aRebuy') { sChip(); send({ t: 'rebuy' }); return; }
  if (b.id === 'aClear') { localBet = { a: 0, pp: 0, t3: 0 }; tgt = 'a'; P.sfx('click'); sendBet(); reBet(me); }
  else if (b.id === 'aSkip') { localBet = { a: 0, pp: 0, t3: 0 }; P.sfx('click'); sendBet(true); }
  else if (b.id === 'aBet') { sChip(); sendBet(true); }

  else if (b.dataset.act) { P.sfx('click'); b.closest('.acts').querySelectorAll('.btn').forEach(x => { x.disabled = true; }); send({ t: 'act', a: b.dataset.act }); }
});
document.addEventListener('keydown', e => {

// bulle d'aide
{
  const tip = $('#tip'); let cur = null, hideT = 0;
  const place = el => { tip.style.left = '0px'; tip.style.top = '0px'; const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight; let x = r.left + r.width / 2 - tw / 2, y = r.top - th - 10; if (y < 8) y = r.bottom + 10; x = Math.max(10, Math.min(innerWidth - tw - 10, x)); tip.style.left = x + 'px'; tip.style.top = y + 'px'; };

/* ---------- Chat de la table ---------- */
const CHAT = { list: [], unread: 0 };

function chatIn(s, txt, l) {
  txt = String(txt || '').replace(/\s+/g, ' ').trim().slice(0, 160); if (!txt) return;
  const r = net.roster[s] || {};
  const m = { s, n: r.name || '?', txt, l: ['fr', 'en', 'cs'].includes(l) ? l : 'fr' };
  net.roster.forEach(o => { if (o.conn && o.conn.open && !o.gone) o.conn.send({ t: 'chat', m }); });
  chatAdd(m);
}
function chatSys(txt) { const m = { sys: true, txt }; net.roster.forEach(o => { if (o.conn && o.conn.open && !o.gone) o.conn.send({ t: 'chat', m }); }); chatAdd(m); }
function chatAdd(m) {
  if (!m || typeof m.txt !== 'string') return;
  CHAT.list.push({ s: m.s | 0, n: String(m.n || '?').slice(0, 14), txt: m.txt.slice(0, 160), l: m.l, sys: !!m.sys });
  if (CHAT.list.length > 80) CHAT.list.shift();
  if (!m.sys && m.s !== net.me) { if (!chatVisible()) { CHAT.unread++; toast(`💬 <b>${esc(String(m.n || '?'))}</b> : ${esc(String(m.txt).slice(0, 60))}`); } P.sfx('chat'); }
  renderChat();
}

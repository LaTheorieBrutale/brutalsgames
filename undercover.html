<!doctype html>
<html lang="fr" data-title="gn_uc">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#141a33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brutal's Games">
<title>Undercover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@600;700;800;900&display=swap">
<script>try{if(localStorage.getItem('uc-ui')==='day')document.documentElement.dataset.ui='day'}catch(e){}</script>
<style>
/* Undercover — ambiance « agents secrets » façon BD : ville de nuit (ou dossier kraft en journée),
   contours épais, tampons TOP SECRET. Écrans : accueil, en ligne, même téléphone, partie, fin. */
:root{
  --bg1:#141a33;--bg2:#2a2350;--bld:#0c1024;--win:#ffd25a;--ink:#0b0e1c;
  --panel:#222a48;--panel2:#1a2140;--line:#39436e;--text:#f1eee6;--muted:#a3a9c9;
  --kraft:#d9b77a;--red:#e5484d;--yellow:#ffcc4d;--teal:#3fc1b0;--violet:#9c7bff;
  --f-title:"Bangers","Impact",system-ui,sans-serif;--f-ui:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html[data-ui=day]{--bg1:#f7b778;--bg2:#f3d29a;--bld:#b9744a;--win:#fff0b8;--panel:#ecd6a6;--panel2:#e2c58c;--line:#b88f55;--text:#2a1d10;--muted:#7a5f3d;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;color:var(--text);font-family:var(--f-ui);font-weight:700;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  background:linear-gradient(180deg,var(--bg1),var(--bg2) 85%) fixed;background-color:var(--bg1)}
[hidden]{display:none!important}
#city{position:fixed;left:0;right:0;bottom:0;height:46vh;z-index:0;pointer-events:none}
#city svg{width:100%;height:100%;display:block}
#city .b{fill:var(--bld)}#city .w{fill:var(--win)}
#moon{position:fixed;top:7vh;right:9vw;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff7d6,#ffe08a 60%,#e8b94a);box-shadow:0 0 40px rgba(255,220,120,.35);z-index:0;pointer-events:none}
html[data-ui=day] #moon{background:radial-gradient(circle at 40% 40%,#fff3c0,#ffb347 65%,#f08a2a);box-shadow:0 0 60px rgba(255,170,60,.5)}

/* ---------- Composants ---------- */
.frame{position:relative;background:linear-gradient(180deg,var(--panel),var(--panel2));border:4px solid var(--ink);border-radius:22px;box-shadow:0 7px 0 var(--ink)}
.btn{position:relative;font-family:var(--f-ui);font-weight:900;font-size:17px;color:var(--ink);cursor:pointer;line-height:1.1;text-decoration:none;
  background:linear-gradient(180deg,#d6dcff 0,#9aa6f0 55%,#7b86d8 100%);border:4px solid var(--ink);border-radius:15px;padding:9px 14px 8px;
  box-shadow:0 5px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.45);transition:transform .07s,box-shadow .07s,filter .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.45)}
@media (hover:hover){.btn:hover{filter:brightness(1.07)}}
.btn:focus-visible{outline:4px solid var(--yellow);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:default}
.btn.yellow{background:linear-gradient(180deg,#fff0b0 0,var(--yellow) 55%,#f0a92a 100%)}
.btn.red{background:linear-gradient(180deg,#ffb3b3 0,var(--red) 55%,#c22f35 100%);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn.teal{background:linear-gradient(180deg,#b8f3ea 0,var(--teal) 55%,#2a9c8e 100%)}
.btn.icon{padding:7px;border-radius:13px;flex:none}
.btn.icon svg{width:24px;height:24px}
.btn.wide{width:100%;padding:13px 14px 11px}
.field{font-family:var(--f-ui);font-weight:800;font-size:18px;color:var(--text);background:var(--panel2);border:4px solid var(--ink);border-radius:14px;padding:9px 12px 8px;width:100%;min-width:0;outline:none;-webkit-user-select:text;user-select:text;box-shadow:inset 0 3px 0 rgba(0,0,0,.25)}
html[data-ui=day] .field{background:#f6e7c4}
.field::placeholder{color:var(--muted)}
.field:focus{border-color:var(--yellow)}
.field.code{text-transform:uppercase;letter-spacing:.3em;text-align:center}
.nseg{display:flex;gap:6px;flex-wrap:wrap}
.nseg .btn{flex:1;padding:8px 4px 7px;font-size:14px;background:var(--panel2);color:var(--text);box-shadow:0 3px 0 var(--ink);min-width:0}
html[data-ui=day] .nseg .btn{background:#f6e7c4}
.nseg .btn[aria-pressed="true"]{background:linear-gradient(180deg,#fff0b0,var(--yellow) 60%,#f0a92a);color:var(--ink)}
label,.lbl{font-size:12.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:900}
.sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.sep::before,.sep::after{content:"";flex:1;height:3px;border-radius:2px;background:var(--line)}
.err{margin:0;color:#ff8a8a;font-size:14px;min-height:1em}
html[data-ui=day] .err{color:#c22f35}
.screen{position:fixed;inset:0;z-index:1;overflow-y:auto;display:flex;padding:16px;padding-block:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 18px);animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}}
.col{width:100%;max-width:460px;margin:auto;display:flex;flex-direction:column;gap:14px;align-items:stretch}
.topnav{display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel{padding:16px;display:flex;flex-direction:column;gap:11px}
.row{display:flex;gap:8px;align-items:center}

/* ---------- Logo ---------- */
.logo{display:flex;flex-direction:column;align-items:center;position:relative;animation:drop .7s cubic-bezier(.2,1.5,.4,1) both}
@keyframes drop{from{opacity:0;transform:translateY(-40px) scale(.85)}}
.logo .spy{width:120px;height:120px;filter:drop-shadow(0 6px 0 var(--ink));animation:peek 4s ease-in-out infinite}
@keyframes peek{0%,100%{transform:translateY(0) rotate(0)}45%{transform:translateY(-4px) rotate(-4deg)}55%{transform:translateY(-4px) rotate(4deg)}}
.logo-t{font-family:var(--f-title);font-size:clamp(52px,15vw,78px);line-height:.9;margin-top:-10px;color:var(--yellow);letter-spacing:.03em;
  -webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
.stamp{position:absolute;right:-6px;top:14px;font-family:var(--f-title);font-size:20px;letter-spacing:.06em;color:var(--red);border:3px solid var(--red);border-radius:8px;padding:2px 8px 0;transform:rotate(12deg);background:rgba(229,72,77,.08);opacity:.92}
.tagline{font-size:15px;margin-top:8px;background:var(--panel);border:3px solid var(--ink);border-radius:999px;padding:3px 14px 2px;box-shadow:0 3px 0 var(--ink);transform:rotate(-1.5deg)}
.mode{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px 10px;border-radius:20px;text-align:left;justify-content:flex-start}
.mode svg{width:42px;height:42px;flex:none}
.mode span{display:flex;flex-direction:column;gap:2px;min-width:0}
.mode b{font-weight:900;font-size:20px}
.mode small{font-size:12.5px;font-weight:700;opacity:.8}
.minirow{display:flex;gap:8px}
.minirow .btn{flex:1}

/* ---------- Salon ---------- */
.bigcode{font-family:var(--f-title);font-size:56px;letter-spacing:.18em;color:var(--yellow);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);text-align:center;padding-left:.18em;line-height:1}
.roster{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.roster div{display:flex;align-items:center;gap:6px;background:var(--panel2);border:3px solid var(--ink);border-radius:14px;padding:3px 8px 3px 3px;font-size:15px;min-width:0}
.roster div span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.roster svg{width:34px;height:34px;flex:none}
.roster .x{margin-left:auto;background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer;padding:0 4px;font-family:inherit}
.wait-txt{margin:0;font-size:14px;color:var(--muted);text-align:center;line-height:1.45}
.opts{display:flex;flex-direction:column;gap:7px}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

/* ---------- Partie ---------- */
#game{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;gap:10px;padding:10px 12px;padding-block:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-bottom,0px) + 10px);max-width:620px;margin:0 auto}
.hud{display:flex;align-items:center;gap:8px;padding:6px 8px}
.hud .mid{flex:1;min-width:0;text-align:center}
.hud .rnd{font-family:var(--f-title);font-size:22px;letter-spacing:.05em;line-height:1;white-space:nowrap}
@media (max-width:420px){.peek span{display:none}.peek{padding:7px 9px}}
.hud .ph{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.tbar{height:8px;border-radius:4px;background:rgba(0,0,0,.3);border:2px solid var(--ink);overflow:hidden;margin:-4px 2px 0}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--red),var(--yellow));transform-origin:left;transition:transform .25s linear}
.say{padding:10px 14px;text-align:center;font-size:17px;line-height:1.3}
.say b{color:var(--yellow)}
html[data-ui=day] .say b{color:#b5521b}
.plist{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:2px 2px 6px}
.prow{display:flex;align-items:center;gap:8px;background:var(--panel);border:3px solid var(--ink);border-radius:16px;padding:4px 10px 4px 4px;box-shadow:0 3px 0 var(--ink);min-height:50px;text-align:left;width:100%;font:inherit;color:inherit}
.prow svg.av{width:42px;height:42px;flex:none}
.prow .nm{font-size:16px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:9.5ch;flex:none}
.prow .cl{flex:1;display:flex;flex-wrap:wrap;gap:4px;min-width:0;justify-content:flex-end}
.prow .cl > span{font-size:13.5px;background:var(--panel2);border:2px solid var(--ink);border-radius:9px;padding:1px 7px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .cl > span.now{background:var(--yellow);color:var(--ink)}
html[data-ui=day] .prow .cl > span:not(.now){background:#f6e7c4}
.prow.turn{border-color:var(--yellow);box-shadow:0 0 0 3px var(--yellow),0 3px 0 var(--ink)}
.prow.dead{opacity:.55;filter:grayscale(.7)}
.prow .role{font-family:var(--f-title);font-size:15px;letter-spacing:.05em;border:2.5px solid currentColor;border-radius:7px;padding:1px 6px 0;transform:rotate(-6deg);flex:none}
.role.civ{color:var(--teal)}.role.uc{color:var(--red)}.role.mw{color:#f0f0f0}
html[data-ui=day] .role.mw{color:#3a2a1a}
.prow .vt{font-size:12px;background:var(--teal);color:var(--ink);border:2px solid var(--ink);border-radius:8px;padding:0 6px;flex:none}
.prow.pick{cursor:pointer;border-style:dashed;border-color:var(--red)}
.prow.pick::after{content:"🎯";font-size:18px;flex:none;margin-left:4px}
.prow.sel::after{content:"✔";color:var(--red)}
.prow.pick:active{transform:translateY(2px)}
.prow.sel{background:linear-gradient(90deg,rgba(229,72,77,.45),var(--panel) 70%);border-color:var(--red)}
.prow .me{font-size:11px;color:var(--muted);flex:none}
.action{padding:12px;display:flex;flex-direction:column;gap:9px}
.action .hint{margin:0;font-size:13px;color:var(--muted);text-align:center}
.peek{gap:6px}
.peek svg{width:22px;height:22px}

/* ---------- Carte secrète ---------- */
.overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(5,7,16,.72);animation:fadeIn .2s}
.card{width:min(340px,100%);padding:20px 18px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;
  background:repeating-linear-gradient(0deg,transparent 0 26px,rgba(0,0,0,.06) 26px 27px),linear-gradient(180deg,#f1d9a2,#e3bf78);color:#2a1d10;animation:flip .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes flip{from{transform:perspective(600px) rotateY(80deg) scale(.9);opacity:0}}
.card .lbl{color:#7a5a30}
.card .word{font-family:var(--f-title);font-size:clamp(40px,12vw,58px);letter-spacing:.04em;line-height:1;color:#2a1d10;word-break:break-word}
.card .stampc{font-family:var(--f-title);font-size:22px;color:var(--red);border:3px solid var(--red);border-radius:8px;padding:2px 10px 0;transform:rotate(-8deg)}
.card p{margin:0;font-size:14.5px;line-height:1.4;color:#4a3820}
.card .btn{margin-top:4px}
.pass{font-size:20px;line-height:1.35}
.pass b{font-family:var(--f-title);font-size:40px;letter-spacing:.04em;color:var(--yellow);display:block;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}

/* ---------- Fin ---------- */
.banner{font-family:var(--f-title);font-size:clamp(34px,10vw,50px);letter-spacing:.04em;text-align:center;line-height:1;color:var(--yellow);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);transform:rotate(-2deg);animation:drop .6s cubic-bezier(.2,1.5,.4,1) both}
.banner.red{color:var(--red)}.banner.white{color:#fff}
.words{display:flex;gap:8px}
.words div{flex:1;text-align:center;padding:8px;border:3px solid var(--ink);border-radius:14px;background:var(--panel2)}
.words small{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.words b{font-family:var(--f-title);font-size:26px;letter-spacing:.04em}
.endlist{display:flex;flex-direction:column;gap:5px}
.endlist .prow{min-height:44px}
.endlist .prow.win{border-color:var(--yellow)}
.endlist .crown{font-size:18px;flex:none}

/* ---------- Chat de la partie ---------- */
.rchat{position:fixed;z-index:22;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);transform:translateX(-50%);width:min(460px,calc(100% - 20px));height:min(62vh,460px);display:flex;flex-direction:column;gap:8px;padding:10px;animation:fadeIn .2s}
.rc-head{display:flex;align-items:center;justify-content:space-between;font-family:var(--f-title);font-size:24px;letter-spacing:.04em}
.rc-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding:6px;border-radius:12px;background:rgba(0,0,0,.22);font-size:14.5px;line-height:1.35}
html[data-ui=day] .rc-list{background:rgba(90,60,20,.12)}
.rc-msg{display:flex;gap:6px;align-items:flex-start;overflow-wrap:anywhere}
.rc-msg svg{width:26px;height:26px;flex:none}
.rc-msg b{margin-right:4px}
.rc-msg.me{flex-direction:row-reverse;text-align:right}
.rc-msg .bub{background:var(--panel2);border:2px solid var(--ink);border-radius:12px;padding:3px 9px;max-width:80%}
html[data-ui=day] .rc-msg .bub{background:#f6e7c4}
.rc-msg.me .bub{background:rgba(255,204,77,.25)}
.rc-empty{margin:auto;color:var(--muted);font-size:13px;text-align:center}
.rc-form{display:flex;gap:6px}
.rc-form .field{font-size:16px;padding:8px 10px}
.tr{cursor:help}.tr::after{content:" 🌐";font-size:10px;opacity:.65}
.chatbtn{position:relative}
.chatbar{position:relative;display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;font:inherit;font-size:14.5px;color:var(--text);cursor:pointer;text-align:left;box-shadow:0 4px 0 var(--ink);border-radius:16px}
.chatbar .cb-ico{font-size:20px;flex:none}
.chatbar .cb-txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatbar .cb-txt b{margin-right:4px}
.chatbar .cb-txt i{font-style:normal;color:var(--muted)}
.chatbar .badge{position:static;min-width:22px;height:22px;border-radius:11px;background:var(--red);color:#fff;font-size:12px;display:grid;place-items:center;border:2.5px solid var(--ink);padding:0 5px;flex:none}
.chatbar .badge:empty{display:none}
.chatbtn .badge{position:absolute;top:-8px;right:-8px;min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;display:grid;place-items:center;border:2.5px solid var(--ink);padding:0 4px}
.chatbtn .badge:empty{display:none}
@media (min-width:1100px){
  body.netlive #rc{display:flex!important;left:auto;right:18px;top:18px;bottom:18px;height:auto;width:330px;transform:none}
  body.netlive .chatbtn,body.netlive .chatbar,body.netlive #rcClose{display:none}
}
#gchatHome{height:240px}
/* ---------- Divers ---------- */
.sheet{position:fixed;z-index:25;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,calc(100% - 28px));max-height:calc(100% - 40px);overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;animation:fadeIn .2s}
.sheet-head{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-title);font-size:28px;letter-spacing:.04em}
.rules{font-size:14.5px;line-height:1.5;font-weight:700}
.rules p{margin:0 0 8px}
.rules b{color:var(--yellow)}
html[data-ui=day] .rules b{color:#b5521b}
#toast{position:fixed;z-index:40;left:50%;top:18%;transform:translate(-50%,-50%) scale(.8);background:var(--panel);color:var(--text);border:4px solid var(--ink);border-radius:16px;padding:9px 16px 8px;font-size:16px;box-shadow:0 5px 0 var(--ink);opacity:0;pointer-events:none;transition:opacity .2s,transform .25s cubic-bezier(.2,1.6,.4,1);max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast.red{background:var(--red);color:#fff}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:35}
/* place pour le bouton du volume (toujours en bas à gauche) */
body.ingame .action{padding-left:58px}
</style>
</head>
<body>
<div id="moon"></div>
<div id="city" aria-hidden="true"></div>

<!-- ======== ACCUEIL ======== -->
<section class="screen" id="home">
  <div class="col">
    <div class="topnav">
      <a class="btn" href="index.html"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span data-i18n="games">Jeux</span></a>
      <button class="btn icon" id="bSet" data-i18n-aria="settings"><svg viewBox="0 0 24 24"><path d="M12 2.5l2 2.6 3.2-.6.8 3.1 3 1.4-1.1 3 1.1 3-3 1.4-.8 3.1-3.2-.6-2 2.6-2-2.6-3.2.6-.8-3.1-3-1.4 1.1-3-1.1-3 3-1.4.8-3.1 3.2.6z" fill="currentColor" stroke="#0b0e1c" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="3.4" fill="#fff" stroke="#0b0e1c" stroke-width="1.6"/></svg></button>
    </div>
    <div class="logo">
      <div id="logoSpy"></div>
      <div class="logo-t">Undercover</div>
      <div class="stamp">TOP SECRET</div>
      <div class="tagline" data-i18n="tagline">Démasque l'intrus… ou deviens-le.</div>
    </div>
    <div class="frame panel">
      <label for="inName" data-i18n="nick">Ton pseudo</label>
      <input class="field" id="inName" maxlength="14" autocomplete="off" data-i18n-ph="namePh">
      <button class="btn mode yellow" id="mOnline">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#3fc1b0" stroke="#0b0e1c" stroke-width="2"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" fill="none" stroke="#0b0e1c" stroke-width="1.8"/></svg>
        <span><b data-i18n="online">Jouer en ligne</b><small data-i18n="onlineSub">3 à 10 agents, chacun sur son téléphone</small></span>
      </button>

function lev(a, b) { const m = a.length, n = b.length; if (Math.abs(m - n) > 2) return 9; const d = Array.from({ length: m + 1 }, (_, i) => [i]); for (let j = 1; j <= n; j++) d[0][j] = j; for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); return d[m][n]; }

/* ---------- Décor : ville de nuit (fenêtres allumées au hasard) ---------- */
(function city() {
  let s = '<svg viewBox="0 0 1200 400" preserveAspectRatio="xMidYMax slice">', x = 0, seed = 7;
  const r = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  while (x < 1200) {
    const w = 60 + r() * 90, h = 120 + r() * 240, y = 400 - h;
    s += `<rect class="b" x="${x}" y="${y}" width="${w}" height="${h}"/>`;
    if (r() < 0.3) s += `<rect class="b" x="${x + w / 2 - 3}" y="${y - 30}" width="6" height="30"/>`;
    for (let wy = y + 14; wy < 390; wy += 22) for (let wx = x + 10; wx < x + w - 14; wx += 18) if (r() < 0.32) s += `<rect class="w" x="${wx}" y="${wy}" width="8" height="11" rx="1.5" opacity="${(0.55 + r() * 0.45).toFixed(2)}"/>`;
    x += w + 4 + r() * 10;
  }
  $('#city').innerHTML = s + '</svg>';
})();

/* ---------- Musique : jazz d'espion (contrebasse qui marche, balais, vibraphone), générée en direct ---------- */
const MU = { on: P.get('uc-music', '1') !== '0', ctx: null, bus: null, timer: 0, step: 0, nextT: 0, vol: 1 };
const BPM = 100, ST = 60 / BPM / 2; // croches
const mf = m => 440 * Math.pow(2, (m - 69) / 12);
// Grille mineure façon film noir : Dm7 | Dm6 | Gm7 | A7(b9)
const CH = [[50, 53, 57, 60], [50, 53, 57, 59], [43, 46, 50, 53], [45, 49, 52, 55]];
const MEL = [[74, 0], [77, 3], [76, 4], [74, 6], [72, 8], [74, 11], [69, 12], [70, 16], [72, 19], [74, 20], [77, 24], [76, 26], [73, 28]];
function muInit() {
  const ctx = P.audio(); if (!ctx || MU.ctx) return !!MU.ctx;
  MU.ctx = ctx; MU.bus = ctx.createGain(); MU.bus.gain.value = MU.on ? 1.07 * MU.vol * P.musicVol() : 0;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5200; MU.bus.connect(lp); lp.connect(ctx.destination);
  const len = ctx.sampleRate * 0.4, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  MU.noise = buf; return true;
}
// gain à 0 dès la création : pas de clic si la note démarre entre deux échantillons
function env(t, vol, a, dec) { const g = MU.ctx.createGain(); g.gain.value = 0; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + dec); g.connect(MU.bus); return g; }
function osc(type, f, t, dur, g) { const o = MU.ctx.createOscillator(); o.type = type; o.frequency.value = f; o.connect(g); o.start(t); o.stop(t + dur + 0.05); }
function bass(m, t) { osc('sine', mf(m), t, 0.42, env(t, 0.36, 0.012, 0.42)); osc('triangle', mf(m) * 2, t, 0.12, env(t, 0.05, 0.008, 0.12)); }
function vib(m, t, v, d) { const f = mf(m); osc('sine', f, t, d, env(t, v, 0.008, d)); osc('sine', f * 4.02, t, 0.25, env(t, v * 0.18, 0.004, 0.25)); }
function brush(t, v, d) { const s = MU.ctx.createBufferSource(); s.buffer = MU.noise; const bp = MU.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 3800; bp.Q.value = 0.6; s.connect(bp); bp.connect(env(t, v, 0.02, d)); s.start(t); s.stop(t + d + 0.05); }
function ride(t, v) { const s = MU.ctx.createBufferSource(); s.buffer = MU.noise; const hp = MU.ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7500; s.connect(hp); hp.connect(env(t, v, 0.004, 0.22)); s.start(t); s.stop(t + 0.27); osc('sine', 5200, t, 0.15, env(t, v * 0.12, 0.003, 0.15)); }
function muStep(st, t) {
  const bar = (st >> 3) % 4, s = st % 8, ch = CH[bar], sw = s % 2 ? ST * 0.32 : 0, tt = t + sw, part = (st >> 5) % 4;
  // contrebasse qui marche : une note par temps
  if (s % 2 === 0) { const walk = [ch[0] - 12, ch[1] - 12, ch[2] - 12, (CH[(bar + 1) % 4][0] - 12) + (s === 6 ? -1 : 0)]; bass(walk[s / 2], t); }
  // batterie aux balais + ride swing
  if (s === 2 || s === 6) brush(t, 0.05, 0.18);
  if (s % 2 === 0 || s === 5 || s === 1) ride(tt, s % 2 ? 0.02 : 0.035);
  // vibraphone : accords en contretemps
  if (s === 3 || (s === 6 && bar % 2)) ch.forEach((m, i) => vib(m + 12, tt + i * 0.01, 0.035, 0.6));
  // thème mystérieux une grille sur deux
  if (part === 1 || part === 3) { const pos = ((st >> 3) % 4) * 8 + s; for (const [m, p] of MEL) if (p === pos) vib(m, tt, 0.09, 0.9); }
}
function muTick() {

  P.pushMatch({ id: `uc${net.code}${net.sess}${net.gameNo}`, t: Date.now(), p: S.players.map(p => p.name), w: w[0], wa: w, b: S.players.map(() => false), g: 'uc' });
}

/* ---------- Même téléphone ---------- */
const LO = { names: [] };
try { const a = JSON.parse(P.get('uc-local', '[]')); if (Array.isArray(a)) LO.names = a.filter(n => typeof n === 'string').slice(0, MAXP); } catch (e) {}
$('#mLocal').onclick = () => {
  P.unlockAudio(); if (!nameOk()) return; P.sfx('click');
  const me = P.name(); if (!LO.names.some(n => n.toLowerCase() === me.toLowerCase())) LO.names.unshift(me);
  LO.names = LO.names.slice(0, MAXP); renderLocal(); renderOpts(); show('local');
};
$('#loBack').onclick = () => { P.sfx('click'); show('home'); };
function renderLocal() {
  $('#loRoster').innerHTML = LO.names.map((n, i) => `<div>${avatar(i, 'av', n)}<span>${esc(n)}</span><button class="x" data-rm="${i}" aria-label="×">✕</button></div>`).join('');
  $('#loN').textContent = `(${LO.names.length}/${MAXP})`; $('#loStart').disabled = LO.names.length < MINP;
  P.set('uc-local', JSON.stringify(LO.names));
}
document.addEventListener('click', e => { const b = e.target.closest('[data-rm]'); if (!b) return; LO.names.splice(+b.dataset.rm, 1); P.sfx('click'); renderLocal(); });
function addLocal() {
  const v = $('#loName').value.trim().slice(0, 14); $('#loErr').textContent = '';
  if (!v) return;
  if (LO.names.length >= MAXP) { $('#loErr').textContent = t('tooMany'); return; }
  if (LO.names.some(n => n.toLowerCase() === v.toLowerCase())) { $('#loErr').textContent = t('dupName'); return; }
  LO.names.push(v); $('#loName').value = ''; P.sfx('click'); renderLocal(); $('#loName').focus();
}
$('#loAdd').onclick = addLocal;
$('#loName').addEventListener('keydown', e => { if (e.key === 'Enter') addLocal(); });
$('#loStart').onclick = () => {
  if (LO.names.length < MINP) { $('#loErr').textContent = t('needMore'); return; }
  P.sfx('click'); leaveNet(); newGame(LO.names.slice(), { ...OPTS, clue: 'voice' }, 'local');
  LO.reveal = 0; sync(); openPass();
};
// Distribution des mots : chacun son tour, à l'abri des regards
function openPass() {
  const s = LO.reveal, p = S.players[s];
  showOv(`${avatar(s, 'spy', p.name)}<div class="pass">${t('passTo')}<b>${esc(p.name)}</b></div><button class="btn wide yellow" id="ovGo">${t('itsMe')}</button>`, false);
  $('#ovGo').onclick = () => { P.sfx('click'); myCard = cardOf(s); openCard(false, () => { LO.reveal++; if (LO.reveal < S.players.length) openPass(); else { closeOv(); startRound(); } }); };
}

/* ---------- Carte secrète ---------- */
function showOv(html, plain) { ovDismiss = false; const c = $('#ovCard'); c.innerHTML = html; c.classList.toggle('card', !plain); $('#ov').hidden = false; }
function closeOv() { $('#ov').hidden = true; }
function cardHtml() {
  if (!myCard) return '';
  if (myCard.mw) return `<span class="stampc">TOP SECRET</span><div class="word">Mr White</div><p>${t('mwTxt')}</p>`;
  return `<span class="stampc">TOP SECRET</span><span class="lbl">${t('yourWord')}</span><div class="word">${esc(wordOf(myCard.pair, myCard.side))}</div><p>${t('wordTxt')}</p>`;
}
function openCard(online, after) {
  show('game'); render();
  showOv(cardHtml() + `<button class="btn wide yellow" id="ovOk">${online ? t('ready') : t('hide')}</button>`, false);
  P.sfx('hint');
  $('#ovOk').onclick = () => { P.sfx('click'); closeOv(); if (online) send({ t: 'ready' }); else if (after) after(); };
}
let ovDismiss = false;
$('#bPeek').onclick = () => { if (!myCard) return; P.sfx('click'); showOv(cardHtml() + `<button class="btn wide" id="ovOk">${t('gotIt')}</button>`, false); ovDismiss = true; $('#ovOk').onclick = () => { P.sfx('click'); closeOv(); }; };
$('#ov').addEventListener('click', e => { if (e.target === $('#ov') && ovDismiss) closeOv(); });

/* ---------- Affichage de la partie ---------- */
let localPick = -1, myVoteFor = -1, lastPhaseKey = '', lastSfxKey = '';
const meSeat = () => V && V.mode === 'local' ? -1 : net.me;
function render() {
  if (!V) return;
  if (V.phase === 'end') { renderEnd(); return; }
  if ($('#game').hidden && $('#ov').hidden) show('game');
  if (!$('#end').hidden) show('game');
  const local = V.mode === 'local', me = meSeat(), cur = V.order[V.turn], meP = V.players[me];
  const phaseKey = V.phase + V.round + (V.tieOnly ? 't' : '') + (V.phase === 'clue' ? V.turn : '');
  if (phaseKey !== lastPhaseKey) { if (V.phase !== 'vote') myVoteFor = -1; if (V.phase === 'vote' && !lastPhaseKey.startsWith('vote')) myVoteFor = -1; localPick = -1; lastPhaseKey = phaseKey; }
  $('#hRound').textContent = V.round ? t('round', { n: V.round }) : t('mission');
  $('#hPhase').textContent = t({ reveal: 'phReveal', clue: 'phClue', vote: 'phVote', elim: 'phElim', guess: 'phGuess' }[V.phase] || 'phClue');
  $('#bPeek').hidden = local || !myCard; $('#bChat').hidden = local; $('#chatBar').hidden = local;
  $('#tbar').style.visibility = local || !V.left ? 'hidden' : 'visible';
  music.level(V.phase === 'vote' ? 0.6 : 0.85);
  // annonce
  let say = '';
  if (V.phase === 'reveal') say = local ? t('phReveal') + '…' : t('readyWait', { n: V.ready.length, t: V.players.filter(p => !p.l).length });
  else if (V.phase === 'clue') say = local ? t('localTurn', { name: esc(V.players[cur].n) }) : cur === me ? (V.voice ? t('turnVoice') : t('yourTurn')) : t(V.voice ? 'turnVoiceOf' : 'turnOf', { name: esc(V.players[cur].n) });
  else if (V.phase === 'vote') say = (V.tieOnly ? t('tieTxt') + '<br>' : '') + (local ? t('localVote') : V.allIn ? t('allVoted') : t('voteTxt'));
  else if (V.phase === 'elim' && V.elim) say = `${t('elimTxt', { name: esc(V.players[V.elim.s].n) })} <span class="role ${V.elim.role}" style="display:inline-block;font-family:var(--f-title);border:2.5px solid currentColor;border-radius:7px;padding:0 6px">${t(V.elim.role)}</span>`;
  else if (V.phase === 'guess' && V.elim) say = t('guessTxt', { name: esc(V.players[V.elim.s].n) });
  $('#say').innerHTML = say;
  // sons de phase
  const sk = V.phase + V.round + (V.phase === 'clue' && cur === me ? 'me' : '') + (V.tieOnly ? 't' : '');
  if (sk !== lastSfxKey) { lastSfxKey = sk; if (V.phase === 'clue' && cur === me) { P.sfx('chat'); try { navigator.vibrate && navigator.vibrate(30); } catch (e) {} } else if (V.phase === 'vote') P.sfx('hint'); else if (V.phase === 'elim' || V.phase === 'guess') P.sfx(V.elim && V.elim.role === 'civ' ? 'bad' : 'good'); }
  // liste des agents
  const canVote = V.phase === 'vote' && (local || (meP && meP.a));
  $('#plist').innerHTML = V.players.map((p, i) => {
    const pickable = canVote && p.a && i !== me && (!V.tieOnly || V.tieOnly.includes(i));
    const cls = ['prow', p.a ? '' : 'dead', V.phase === 'clue' && i === cur ? 'turn' : '', pickable ? 'pick' : '', (local ? localPick : myVoteFor) === i ? 'sel' : ''].join(' ');
    const clues = p.c.map((c, r) => c ? `<span class="${r === V.round - 1 ? 'now' : ''}">${trHtml(c, (p.cl || [])[r], i === me)}</span>` : '').join('');
    const tags = (p.r ? `<span class="role ${p.r}">${t(p.r)}</span>` : '') + (V.phase === 'vote' && !local && V.voted.includes(i) ? '<span class="vt">✓</span>' : '') + (V.phase === 'reveal' && V.ready.includes(i) ? '<span class="vt">✓</span>' : '');
    return `<${pickable ? 'button' : 'div'} class="${cls}" ${pickable ? `data-pick="${i}"` : ''}>${avatar(i, 'av', p.n)}<span class="nm">${esc(p.n)}</span>${i === me ? `<span class="me">(${t('you')})</span>` : ''}<span class="cl">${clues}</span>${tags}</${pickable ? 'button' : 'div'}>`;
  }).join('');
  renderAction();
}
function renderAction() {
  const local = V.mode === 'local', me = meSeat(), cur = V.order[V.turn], meP = V.players[me];
  const A = $('#action'); let h = '';
  if (V.phase === 'reveal') h = local ? '' : (V.ready.includes(me) ? `<p class="hint">${t('readyWait', { n: V.ready.length, t: V.players.filter(p => !p.l).length })}</p>` : `<button class="btn wide yellow" id="aReady">${t('ready')}</button>`);
  else if (V.phase === 'clue') {
    if (local) h = `<button class="btn wide yellow" id="aNext">${V.turn >= V.order.length - 1 ? t('toVote') : t('next')}</button>`;
    else if (cur === me && meP && meP.a) h = V.voice ? `<button class="btn wide yellow" id="aDone">🗣 ${t('done')}</button>` : `<div class="row"><input class="field" id="aClue" maxlength="24" autocomplete="off" enterkeyhint="send" placeholder="${esc(t('cluePh'))}"><button class="btn yellow" id="aSend">${t('send')}</button></div>`;
    else h = `<p class="hint">${t(V.voice ? 'turnVoiceOf' : 'turnOf', { name: esc(V.players[cur].n) }).replace(/<\/?b>/g, '')}</p>`;
  } else if (V.phase === 'vote') {
    const sel = local ? localPick : -1;
    if (local) h = sel >= 0 ? `<button class="btn wide red" id="aElim">${t('voteBtn', { name: esc(V.players[sel].n) })}</button>` : `<p class="hint">${t('pickOne')}</p>`;
    else if (meP && meP.a) h = myVoteFor >= 0 || V.voted.includes(me) ? `<p class="hint">${V.allIn ? '' : t('voted', { n: V.voted.length, t: V.players.filter(p => p.a).length }) + '<br>'}${t('changeVote')}</p>` : `<p class="hint">${t('pickOne')}</p>`;
    else h = `<p class="hint">${t('voted', { n: V.voted.length, t: V.players.filter(p => p.a).length })}</p>`;
  } else if (V.phase === 'elim') h = local || net.role === 'host' ? `<button class="btn wide yellow" id="aCont">${t('cont')}</button>` : '';
  else if (V.phase === 'guess') {
    const mine = local || (V.elim && V.elim.s === me);
    h = mine ? `<p class="hint">${local ? '' : t('guessYou')}</p><div class="row"><input class="field" id="aGuess" maxlength="30" autocomplete="off" enterkeyhint="go" placeholder="${esc(t('guessPh'))}"><button class="btn yellow" id="aGuessB">${t('guessBtn')}</button></div>` : `<p class="hint">${t('guessWait')}</p>`;
  }
  const keepFocus = document.activeElement && (document.activeElement.id === 'aClue' || document.activeElement.id === 'aGuess') && A.dataset.key === V.phase + V.round + V.turn;
  if (keepFocus) return; // ne pas effacer ce que le joueur est en train d'écrire
  A.dataset.key = V.phase + V.round + V.turn; A.innerHTML = h; A.hidden = !h;
  const on = (id, f) => { const el = document.getElementById(id); if (el) el.onclick = f; };
  on('aReady', () => { P.sfx('click'); send({ t: 'ready' }); });
  on('aNext', () => { P.sfx('click'); submitClue(V.order[V.turn], ''); });
  on('aDone', () => { P.sfx('click'); send({ t: 'clue', txt: '' }); });
  const sendClue = () => {
    const v = $('#aClue').value.trim(); if (!v) return;
    if (myCard && !myCard.mw && PAIRS[myCard.pair][myCard.side].some(w => norm(w) === norm(v))) { toast(t('clueIsWord'), 'red'); P.sfx('bad'); return; }
    P.sfx('click'); A.dataset.key = ''; send({ t: 'clue', txt: v });
  };
  on('aSend', sendClue);
  const ci = $('#aClue'); if (ci) { ci.addEventListener('keydown', e => { if (e.key === 'Enter') sendClue(); }); setTimeout(() => ci.focus(), 50); }
  on('aElim', () => { if (localPick < 0) return; P.sfx('click'); eliminate(localPick, null); });
  on('aCont', () => { P.sfx('click'); afterElim(); });
  const sendGuess = () => { const v = $('#aGuess').value.trim(); if (!v) return; P.sfx('click'); A.dataset.key = ''; if (V.mode === 'local') mwGuess(V.elim.s, v); else send({ t: 'guess', txt: v }); };
  on('aGuessB', sendGuess);
  const gi = $('#aGuess'); if (gi) { gi.addEventListener('keydown', e => { if (e.key === 'Enter') sendGuess(); }); setTimeout(() => gi.focus(), 50); }
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-pick]'); if (!b || !V || V.phase !== 'vote') return;
  const s = +b.dataset.pick; P.sfx('click');
  if (V.mode === 'local') { localPick = s; render(); return; }
  if (myVoteFor === s) return;
  myVoteFor = s; send({ t: 'vote', s }); render();
});
// Barre de temps (en ligne)
(function timeLoop() {
  if (V && V.left && !$('#game').hidden) {
    const total = { reveal: T_READY, clue: V.voice ? T_VOICE : T_CLUE, vote: V.allIn ? T_ALLIN : T_VOTE, elim: T_ELIM, guess: T_GUESS }[V.phase] || 1;
    const rest = Math.max(0, V.left - (performance.now() - V.recv));
    $('#tfill').style.transform = `scaleX(${Math.min(1, rest / total)})`;
  }
  requestAnimationFrame(timeLoop);
})();
$('#bQuit').onclick = () => {
  P.sfx('click');
  P.quitMenu($('#bQuit'), () => { leaveNet(); S = null; V = null; myCard = null; closeOv(); show('home'); });
};

/* ---------- Fin de mission ---------- */
function renderEnd() {
  closeOv(); show('end'); music.level(1);
  const w = winnersOf({ players: V.players.map(p => ({ role: p.r })), winner: V.winner }), me = meSeat(), won = V.mode === 'local' || w.includes(me);
  const tt = $('#endTitle'); tt.textContent = t(V.winner === 'civ' ? 'winCiv' : V.winner === 'mw' ? 'winMw' : 'winImp');
  tt.className = 'banner ' + (V.winner === 'civ' ? '' : V.winner === 'mw' ? 'white' : 'red');
  const wd = V.words || { pair: 0, civ: 0 };
  $('#endWords').innerHTML = `<div><small>${t('civWord')}</small><b>${esc(wordOf(wd.pair, wd.civ))}</b></div><div><small>${t('ucWord')}</small><b>${esc(wordOf(wd.pair, 1 - wd.civ))}</b></div>`;
  $('#endList').innerHTML = V.players.map((p, i) => `<div class="prow ${w.includes(i) ? 'win' : 'dead'}" style="${w.includes(i) ? '' : 'filter:none;opacity:.75'}">${avatar(i, 'av', p.n)}<span class="nm">${esc(p.n)}</span>${i === me ? `<span class="me">(${t('you')})</span>` : ''}<span class="cl">${p.c.map((c, r) => c ? `<span>${trHtml(c, (p.cl || [])[r], i === me)}</span>` : '').join('')}</span><span class="role ${p.r}">${t(p.r)}</span>${w.includes(i) ? '<span class="crown">👑</span>' : ''}</div>`).join('');
  const guest = V.mode === 'online' && net.role !== 'host';
  $('#bAgain').hidden = guest; $('#endWait').textContent = guest ? t('hostAgain') : ''; $('#bMenu').hidden = !net.relay;
  if (lastSfxKey !== 'end' + V.round) { lastSfxKey = 'end' + V.round; P.sfx(won ? 'win' : 'lose'); if (won) P.confetti($('#confetti')); }
}
$('#bAgain').onclick = () => {
  P.sfx('click'); P.stopConfetti();
  if (V && V.mode === 'local') { $('#loStart').click(); return; }
  if (net.role === 'host') hostStart();
};
$('#bHome').onclick = () => { P.sfx('click'); P.stopConfetti(); clearTimeout(window.__endT); leaveNet(); S = null; V = null; myCard = null; closeOv(); show('home'); };
$('#bMenu').onclick = () => {
  P.sfx('click'); P.stopConfetti();
  const host = net.role === 'host';
  if (V && V.mode === 'online' && net.relay) { if (host) net.roster = net.roster.filter(r => !r.gone); S = null; V = null; show('online'); $('#onForm').hidden = true; $('#onWait').hidden = false; renderOpts(); renderRoster(); if (host) broadcastLobby(); return; }
  S = null; V = null; show('home');
};

/* ---------- Traduction automatique des indices et du chat ---------- */
// Chaque texte est affiché dans la langue choisie par le joueur ; l'original reste visible en touchant le texte
const trRedraw = () => { if (V) render(); renderChat(); };
function trHtml(text, src, mine) {
  const tl = P.lang();
  if (mine || !src || src === tl || !window.BGT) return esc(text);
  const v = BGT.peek(text, tl, src);
  if (v === undefined) { BGT.want(text, tl, src, trRedraw); return esc(text); }
  return v ? `<span class="tr" data-orig="${esc(text)}" title="${esc(t('translated'))}">${esc(v)}</span>` : esc(text);
}
document.addEventListener('click', e => { const el = e.target.closest('.tr'); if (el && !el.closest('[data-pick]')) { e.stopPropagation(); toast('🌐 ' + esc(el.dataset.orig)); } }, true);

/* ---------- Chat de la partie (salon + partie, en ligne) ---------- */
const CHAT = { list: [], unread: 0 };
const wideChat = () => matchMedia('(min-width:1100px)').matches && document.body.classList.contains('netlive');
const chatVisible = () => !$('#rc').hidden || wideChat();
function chatIn(s, txt, l) { // chez l'hôte : reçoit un message et le renvoie à tout le monde
  txt = String(txt || '').replace(/\s+/g, ' ').trim().slice(0, 160); if (!txt) return;
  const m = { s, n: (net.roster[s] || {}).name || '?', txt, l: ['fr', 'en', 'cs'].includes(l) ? l : 'fr', id: Date.now() + '' + Math.random() };
  net.roster.forEach(r => { if (r.conn && r.conn.open) r.conn.send({ t: 'chat', m }); });
  chatAdd(m);
}
function chatAdd(m) {
  if (!m || typeof m.txt !== 'string') return;
  CHAT.list.push({ s: m.s | 0, n: String(m.n || '?').slice(0, 14), txt: m.txt.slice(0, 160), l: m.l, id: m.id });
  if (CHAT.list.length > 80) CHAT.list.shift();
  if (m.s !== net.me) { if (!chatVisible()) { CHAT.unread = (CHAT.unread || 0) + 1; toast(`💬 <b>${esc(String(m.n || '?'))}</b> : ${esc(String(m.txt).slice(0, 60))}`); } P.sfx('chat'); }
  renderChat();
}
function renderChat() {
  const L = $('#rcList');
  L.innerHTML = CHAT.list.length ? CHAT.list.map(m => `<div class="rc-msg${m.s === net.me ? ' me' : ''}">${avatar(m.s, 'av', m.n)}<div class="bub"><b style="color:${COLORS[m.s % 10]}">${esc(m.n)}</b>${trHtml(m.txt, m.l, m.s === net.me)}</div></div>`).join('') : `<p class="rc-empty">${t('chatEmpty')}</p>`;
  L.scrollTop = L.scrollHeight;
  if (chatVisible()) CHAT.unread = 0;
  document.querySelectorAll('.chatbtn .badge, .chatbar .badge').forEach(b => { b.textContent = CHAT.unread ? CHAT.unread : ''; });
  const last = CHAT.list[CHAT.list.length - 1];
  const bar = last ? `<b style="color:${COLORS[last.s % 10]}">${esc(last.n)}</b>${trHtml(last.txt, last.l, last.s === net.me)}` : `<i>${t('chatInvite')}</i>`;
  document.querySelectorAll('.chatbar .cb-txt').forEach(el => { el.innerHTML = bar; });
}
function toggleChat(open) { $('#rc').hidden = !open; if (open) { CHAT.unread = 0; renderChat(); setTimeout(() => $('#rcIn').focus(), 50); } }
$('#bChat').onclick = () => { P.sfx('click'); toggleChat($('#rc').hidden); };
$('#chatBar').onclick = () => { P.sfx('click'); toggleChat(true); };
$('#bChatL').onclick = () => { P.sfx('click'); toggleChat($('#rc').hidden); };
$('#rcClose').onclick = () => { P.sfx('click'); toggleChat(false); };
$('#rcForm').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('#rcIn').value.replace(/\s+/g, ' ').trim().slice(0, 160); if (!v) return;
  $('#rcIn').value = '';
  if (net.role === 'host') chatIn(0, v, P.lang()); else if (net.conn && net.conn.open) net.conn.send({ t: 'chat', txt: v, l: P.lang() });
});
window.addEventListener('resize', renderChat);

/* ---------- Chat général (même chat que l'accueil) ---------- */
const gcHome = window.GChat ? GChat.mount($('#gchatHome'), { db: P.DB_URL, lang: P.lang, name: () => P.hasName() ? P.name() : '', needName: () => P.needName($('#inName')) }) : null;

/* ---------- Démarrage ---------- */
P.onLang(() => {
  if (net.role === 'guest' && net.conn && net.conn.open) net.conn.send({ t: 'lang', l: P.lang() });
  if (net.role === 'host' && S && S.players[0]) S.players[0].lang = P.lang();
  renderChat(); if (gcHome) gcHome.refresh();
});
P.onLang(() => { renderUi(); renderSnd(); renderMus(); renderOpts(); if (!$('#online').hidden && !$('#onWait').hidden) renderRoster(); if (!$('#local').hidden) renderLocal(); if (V) render(); });
P.applyStatic(); renderUi(); renderSnd(); renderMus(); renderOpts(); renderChat();
{ const jc = window.Party && Party.takeJoin(); if (jc) joinFromParty(jc); }
window.__uc = { newGame, get S() { return S; }, get V() { return V; }, net, PAIRS, guessOk, roleCounts, get card() { return myCard; } };
// Skins : chargés au démarrage, puis mis à jour en direct
P.skinLive(() => { try { if (V && !$('#game').hidden) render(); renderRoster(); renderLocal(); renderChat(); } catch (e) {} });
})();
</script>

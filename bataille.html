<!doctype html>
<html lang="fr" data-title="gn_bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#071219">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brutal's Games">
<title>Bataille navale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Bataille navale — « La Guerre des Pirates » : bataille nocturne en pleine mer, rendu 3D low-poly (Three.js).
   Interface bois sombre et or, portraits de capitaines, mise en page portrait (grille ennemie en grand, sa flotte en petit). */
:root{
  --bg:#071219;--ink:#0d0805;--wood1:#4a2f1a;--wood2:#2e1c0f;--wood3:#1d120a;--gold:#e0b04e;--gold2:#a8741f;--bone:#f1e2c2;--muted:#b9a27d;
  --blood:#b3261e;--ghost:#6dff9a;--sea:#123c48;--mine:#ffd27a;
  --f-title:"Pirata One","Georgia",serif;--f-ui:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;color:var(--bone);font-family:var(--f-ui);font-weight:700;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(ellipse at 70% 0%,rgba(120,160,190,.22),transparent 55%),radial-gradient(ellipse at 50% 120%,rgba(20,90,100,.45),transparent 60%),linear-gradient(180deg,#0c1a24 0,#071219 45%,#04090d 100%) fixed;background-color:var(--bg)}
[hidden]{display:none!important}
#deco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#deco svg{position:absolute}
#deco .bolt{opacity:0;animation:bolt 11s infinite}
@keyframes bolt{0%,92%,96%,100%{opacity:0}93%,95%{opacity:.9}94%{opacity:.25}}
body.ingame #deco{display:none}
/* bois et or */
.frame{position:relative;border:3px solid var(--ink);border-radius:16px;
  background:repeating-linear-gradient(92deg,rgba(0,0,0,.0) 0 18px,rgba(0,0,0,.12) 18px 19px,rgba(255,255,255,.03) 19px 37px),linear-gradient(180deg,var(--wood1),var(--wood2));
  box-shadow:inset 0 0 0 2px rgba(224,176,78,.55),inset 0 0 0 5px rgba(0,0,0,.35),0 6px 0 rgba(0,0,0,.6),0 10px 24px rgba(0,0,0,.45)}
.btn{position:relative;font-family:var(--f-ui);font-weight:900;font-size:16px;color:var(--bone);cursor:pointer;line-height:1.1;text-decoration:none;letter-spacing:.02em;
  background:linear-gradient(180deg,#5a3a20 0,#3b2513 60%,#2a190c 100%);border:3px solid var(--ink);border-radius:12px;padding:9px 14px 8px;
  box-shadow:inset 0 0 0 1.5px rgba(224,176,78,.6),0 4px 0 #000,inset 0 2px 0 rgba(255,255,255,.12);transition:transform .07s,box-shadow .07s,filter .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(3px);box-shadow:inset 0 0 0 1.5px rgba(224,176,78,.6),0 1px 0 #000}
@media (hover:hover){.btn:hover{filter:brightness(1.12)}}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.gold{color:#2a1606;text-shadow:0 1px 0 rgba(255,240,200,.5);background:linear-gradient(180deg,#ffe7a6 0,#e9b955 45%,#b8802a 100%);box-shadow:inset 0 0 0 1.5px #fff1c4,0 4px 0 #3a2208,0 0 18px rgba(224,176,78,.25)}
.btn.blood{color:#fff;background:linear-gradient(180deg,#e0574c 0,#a3241b 60%,#6e140e 100%)}
.btn.icon{padding:7px;border-radius:11px;flex:none}
.btn.icon svg{width:22px;height:22px}
.btn.wide{width:100%;padding:13px 14px 11px}
.btn.sm{font-size:13.5px;padding:7px 10px 6px}
.field{font-family:var(--f-ui);font-weight:800;font-size:18px;color:var(--bone);background:#1a0f07;border:3px solid var(--ink);border-radius:12px;padding:9px 12px 8px;width:100%;min-width:0;outline:none;-webkit-user-select:text;user-select:text;box-shadow:inset 0 3px 0 rgba(0,0,0,.4),inset 0 0 0 1px rgba(224,176,78,.35)}
.field::placeholder{color:#8c7556}
.field:focus{box-shadow:inset 0 0 0 2px var(--gold)}
.field.code{text-transform:uppercase;letter-spacing:.3em;text-align:center}
label,.lbl{font-size:12px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-weight:900}
.sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.sep::before,.sep::after{content:"";flex:1;height:2px;border-radius:2px;background:rgba(224,176,78,.35)}
.err{margin:0;color:#ff9a8a;font-size:14px;min-height:1em}
.nseg{display:flex;gap:6px;flex-wrap:wrap}
.nseg .btn{flex:1;padding:8px 4px 7px;font-size:14px;min-width:0}
.nseg .btn[aria-pressed="true"]{color:#2a1606;background:linear-gradient(180deg,#ffe7a6,#e9b955 55%,#b8802a)}
.screen{position:fixed;inset:0;z-index:1;overflow-y:auto;display:flex;padding:16px;padding-block:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 70px);animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}}
.col{width:100%;max-width:470px;margin:auto;display:flex;flex-direction:column;gap:14px;align-items:stretch}
.topnav{display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel{padding:16px;display:flex;flex-direction:column;gap:11px}
.row{display:flex;gap:8px;align-items:center}
.logo{display:flex;flex-direction:column;align-items:center;animation:drop .8s cubic-bezier(.2,1.4,.4,1) both}
@keyframes drop{from{opacity:0;transform:translateY(-30px) scale(.9)}}
.logo .emb{width:118px;height:118px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.7))}
.logo-t{font-family:var(--f-title);font-weight:400;font-size:clamp(50px,14vw,76px);line-height:.9;color:#f6d78a;text-align:center;
  background:linear-gradient(180deg,#fff2c4 0,#f0c867 45%,#b07a26 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 3px 0 #2a1606) drop-shadow(0 6px 10px rgba(0,0,0,.8))}
.logo-s{margin-top:6px;font-family:var(--f-title);font-size:22px;letter-spacing:.06em;color:var(--blood);text-shadow:0 2px 0 #000,0 0 14px rgba(179,38,30,.5)}
.mode{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px 9px;border-radius:14px;text-align:left;justify-content:flex-start}
.mode .pic{width:46px;height:46px;flex:none;border-radius:50%;overflow:hidden;border:2px solid var(--ink);box-shadow:0 0 0 1.5px rgba(224,176,78,.7)}
.mode .pic svg{width:100%;height:100%;display:block}
.mode span{display:flex;flex-direction:column;gap:2px;min-width:0}
.mode b{font-weight:900;font-size:19px}
.mode small{font-size:12.5px;font-weight:700;opacity:.85}
.bigcode{font-family:var(--f-title);font-size:56px;letter-spacing:.16em;color:var(--gold);text-shadow:0 3px 0 #000;text-align:center;padding-left:.16em;line-height:1}
.wait-txt{margin:0;font-size:14px;color:var(--muted);text-align:center;line-height:1.45}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.plist{display:flex;flex-wrap:wrap;gap:6px}
.pl{display:flex;align-items:center;gap:7px;font-size:14.5px;background:rgba(0,0,0,.35);border-radius:12px;padding:3px 10px 3px 3px;min-width:0;box-shadow:inset 0 0 0 1px rgba(224,176,78,.25)}
.pl svg{width:30px;height:30px;flex:none;border-radius:50%}
.pl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- Partie ---------- */
#game{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;gap:6px;padding:8px 10px;padding-block:calc(env(safe-area-inset-top,0px) + 6px) calc(env(safe-area-inset-bottom,0px) + 8px);max-width:580px;margin:0 auto}
#game>*{flex-shrink:0}
.hud{display:flex;align-items:center;gap:7px;padding:4px 7px}
.hud .mid{flex:1;min-width:0;text-align:center;line-height:1.05}
.hud .mid small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.hud .mid b{display:block;font-family:var(--f-title);font-weight:400;font-size:21px;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 0 #000}
/* capitaines */
.caps{display:flex;align-items:stretch;justify-content:center;gap:6px}
.cap{position:relative;display:flex;align-items:center;gap:7px;min-width:0;flex:1;padding:4px 8px 4px 4px;border-radius:14px}
.cap.r{flex-direction:row-reverse;padding:4px 4px 4px 8px;text-align:right}
.cap .pt{position:relative;width:54px;height:54px;flex:none;border-radius:50%;overflow:hidden;border:3px solid var(--ink);box-shadow:0 0 0 2px var(--gold2),0 3px 6px rgba(0,0,0,.6);background:#10212a}
.cap .pt svg{width:100%;height:100%;display:block}
.cap.turn .pt{box-shadow:0 0 0 2.5px var(--gold),0 0 16px rgba(224,176,78,.8)}
.cap .pt.angry{animation:jolt .45s}
@keyframes jolt{20%{transform:translateX(-4px) rotate(-4deg)}40%{transform:translateX(4px) rotate(4deg)}60%{transform:translateX(-2px)}}
.cap .nfo{min-width:0;display:flex;flex-direction:column;gap:4px}
.cap.r .nfo{align-items:flex-end}
.cap .nm{font-family:var(--f-title);font-size:22px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px;text-shadow:0 2px 0 #000}
.cap.me .nm{color:var(--mine)}
.cap .badge2{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10.5px;font-weight:900;letter-spacing:.08em;padding:2px 8px 1px;border-radius:999px;color:#2a1606;background:linear-gradient(180deg,#ffe7a6,#e0b04e);border:2px solid var(--ink);box-shadow:0 0 10px rgba(224,176,78,.6);animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{box-shadow:0 0 18px rgba(224,176,78,.95)}}
.fleeticons{display:flex;flex-wrap:wrap;gap:2px 4px;align-items:flex-end;max-width:132px}
.cap.r .fleeticons{justify-content:flex-end}
.fleeticons svg{height:15px;width:auto;flex:none}
.fleeticons svg.dead{opacity:.22;filter:grayscale(1)}
.vs{align-self:center;font-family:var(--f-title);font-size:24px;color:var(--blood);text-shadow:0 2px 0 #000}
/* scène 3D */
.stage{position:relative;flex:1 1 auto!important;min-height:240px;border-radius:16px;overflow:hidden;border:3px solid var(--ink);box-shadow:inset 0 0 0 2px rgba(224,176,78,.45),0 6px 0 rgba(0,0,0,.6);background:#0b1a24;touch-action:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.miniframe{position:absolute;pointer-events:none;border:3px solid var(--ink);border-radius:12px;box-shadow:inset 0 0 0 2px rgba(224,176,78,.55),0 0 0 2px rgba(0,0,0,.4)}
.miniframe span{position:absolute;top:-1px;left:50%;transform:translate(-50%,-50%);font-family:var(--f-title);font-size:15px;color:var(--gold);background:var(--wood3);border:2px solid var(--ink);border-radius:8px;padding:0 8px;white-space:nowrap;box-shadow:inset 0 0 0 1px rgba(224,176,78,.4)}
.sinfo{position:absolute;display:flex;flex-direction:column;gap:6px;justify-content:center;font-size:13px;color:var(--muted);padding:6px}
.sinfo b{color:var(--bone);font-size:16px}
.sinfo .row2{display:flex;gap:5px;align-items:baseline;flex-wrap:wrap}
.status{position:absolute;left:0;right:0;top:6px;text-align:center;font-family:var(--f-title);font-size:23px;color:var(--bone);text-shadow:0 2px 0 #000,0 0 10px rgba(0,0,0,.9);pointer-events:none;padding:0 8px}
.status.good{color:var(--gold)}.status.bad{color:#ff8a7a}
.banner3{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);pointer-events:none;text-align:center;white-space:nowrap;
  font-family:var(--f-title);font-size:clamp(30px,9vw,46px);color:#ffe7a6;padding:8px 26px 4px;border:3px solid var(--ink);border-radius:12px;
  background:linear-gradient(180deg,#8a1a14,#4d0d09);box-shadow:inset 0 0 0 2px rgba(224,176,78,.7),0 8px 20px rgba(0,0,0,.7);text-shadow:0 3px 0 #000;opacity:0}
.banner3.show{animation:banner 2.2s cubic-bezier(.2,1.4,.4,1) both}
.banner3.mine{background:linear-gradient(180deg,#26414a,#0f2026)}
@keyframes banner{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-6deg)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.08) rotate(-2deg)}20%{transform:translate(-50%,-50%) scale(1) rotate(-2deg)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1) rotate(-2deg)}}
.flash{position:absolute;inset:0;pointer-events:none;background:#cfe4ff;opacity:0;mix-blend-mode:screen}
.flash.on{animation:flashA .5s}
@keyframes flashA{0%,30%{opacity:.35}15%{opacity:.08}100%{opacity:0}}
.no3d{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;color:var(--muted)}
/* bas d'écran */
.bottom{display:flex;flex-direction:column;gap:7px;align-items:center}
.dock{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:100%}
.dock .ds{flex:1 1 0;min-width:56px;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 4px 4px;border-radius:12px;cursor:grab;touch-action:none;color:var(--bone);font:inherit;font-size:10.5px;font-weight:900}
.dock .ds svg{height:26px;width:100%;pointer-events:none}
.dock .ds .pips{display:flex;gap:2px}.dock .ds .pips i{width:7px;height:7px;border-radius:2px;background:var(--gold);box-shadow:0 0 0 1px var(--ink)}
.dock .ds.sel{box-shadow:inset 0 0 0 2px var(--gold),0 0 14px rgba(224,176,78,.6),0 4px 0 #000}
.dock .ds.done{opacity:.28}
.pctrl,.fctrl{display:flex;gap:7px;width:100%}
.pctrl .btn{flex:1;min-width:0;font-size:14px;padding:9px 6px 8px}
.fctrl{align-items:center}
.fctrl .hint{flex:1;font-size:13.5px;color:var(--muted);line-height:1.3;text-align:center;min-height:18px}
.fctrl .btn{font-family:var(--f-title);font-weight:400;font-size:26px;padding:6px 22px 3px;letter-spacing:.04em}
.fctrl .btn svg{width:24px;height:24px}
.phint{margin:0;text-align:center;font-size:12.5px;color:var(--muted)}
.tbar{height:7px;border-radius:4px;background:rgba(0,0,0,.5);overflow:hidden;border:2px solid var(--ink);width:100%;box-shadow:inset 0 0 0 1px rgba(224,176,78,.25)}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,#e0b04e,#b3261e);transform-origin:left;transition:transform .25s linear}

/* ---------- Fin ---------- */
.banner{font-family:var(--f-title);font-size:clamp(46px,14vw,72px);text-align:center;line-height:1;color:#f6d78a;text-shadow:0 4px 0 #000,0 0 22px rgba(224,176,78,.4);animation:drop .7s cubic-bezier(.2,1.4,.4,1) both}
.banner.lose{color:#ff8a7a;text-shadow:0 4px 0 #000,0 0 22px rgba(179,38,30,.5)}
.ranks{display:flex;flex-direction:column;gap:7px}
.ranks .pl{justify-content:flex-start;font-size:16px;padding:5px 10px 5px 5px}
.ranks .pl svg{width:40px;height:40px}
.ranks .pl small{margin-left:auto;color:var(--muted);font-size:12.5px;text-align:right}

/* ---------- Chat ---------- */
.rchat{position:fixed;z-index:22;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);transform:translateX(-50%);width:min(460px,calc(100% - 20px));height:min(62vh,460px);display:flex;flex-direction:column;gap:8px;padding:10px;animation:fadeIn .2s}
.rc-head{display:flex;align-items:center;justify-content:space-between;font-family:var(--f-title);font-size:26px;color:var(--gold)}
.rc-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding:6px;border-radius:12px;background:rgba(0,0,0,.35);font-size:14.5px;line-height:1.35}
.rc-msg{display:flex;gap:6px;align-items:flex-start;overflow-wrap:anywhere}
.rc-msg svg{width:26px;height:26px;flex:none;border-radius:50%}
.rc-msg b{margin-right:4px}
.rc-msg.me{flex-direction:row-reverse;text-align:right}
.rc-msg .bub{background:#1a0f07;border:2px solid var(--ink);border-radius:12px;padding:3px 9px;max-width:80%;box-shadow:inset 0 0 0 1px rgba(224,176,78,.2)}
.rc-msg.me .bub{background:rgba(224,176,78,.16)}
.rc-msg.sys{justify-content:center;color:var(--muted);font-size:12.5px}
.rc-empty{margin:auto;color:var(--muted);font-size:13px;text-align:center}
.rc-form{display:flex;gap:6px}
.rc-form .field{font-size:16px;padding:8px 10px}
.tr{cursor:help}.tr::after{content:" 🌐";font-size:10px;opacity:.65}
.chatbar{position:relative;display:flex;align-items:center;gap:8px;width:100%;padding:6px 12px;font:inherit;font-size:14px;color:var(--bone);cursor:pointer;text-align:left;border-radius:14px}
.chatbar .cb-ico{font-size:18px;flex:none}
.chatbar .cb-txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatbar .cb-txt b{margin-right:4px}
.chatbar .cb-txt i{font-style:normal;color:var(--muted)}
.badge{min-width:22px;height:22px;border-radius:11px;background:var(--blood);color:#fff;font-size:12px;display:grid;place-items:center;border:2px solid var(--ink);padding:0 5px;flex:none}
.badge:empty{display:none}
.chatbtn{position:relative}.chatbtn .badge{position:absolute;top:-8px;right:-8px}
@media (min-width:1150px){
  body.netlive #rc{display:flex!important;left:auto;right:18px;top:18px;bottom:18px;height:auto;width:330px;transform:none}
  body.netlive .chatbtn,body.netlive .chatbar,body.netlive #rcClose{display:none}
  body.netlive #game{margin:0;left:max(10px,calc((100% - 366px - 580px) / 2));right:auto;width:580px}
}
#gchatHome{height:230px}
.sheet{position:fixed;z-index:25;left:50%;top:50%;transform:translate(-50%,-50%);width:min(400px,calc(100% - 28px));max-height:calc(100% - 40px);overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;animation:fadeIn .2s}
.sheet-head{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-title);font-size:30px;color:var(--gold)}
.rules{font-size:14.5px;line-height:1.5}
.rules p{margin:0 0 8px}.rules b{color:var(--gold)}
#toast{position:fixed;z-index:40;left:50%;top:40%;transform:translate(-50%,-50%) scale(.8);color:var(--bone);border:3px solid var(--ink);border-radius:14px;padding:9px 16px 8px;font-size:17px;opacity:0;pointer-events:none;transition:opacity .2s,transform .25s cubic-bezier(.2,1.6,.4,1);max-width:88vw;text-align:center;
  background:linear-gradient(180deg,var(--wood1),var(--wood2));box-shadow:inset 0 0 0 2px rgba(224,176,78,.55),0 6px 16px rgba(0,0,0,.6)}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast.bad{background:linear-gradient(180deg,#8a1a14,#4d0d09);color:#fff}
#toast.good{background:linear-gradient(180deg,#ffe7a6,#c8902a);color:#2a1606}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:35}
/* place pour le bouton du volume (toujours en bas à gauche) */
#bottom{padding-left:52px}
#chatBar{margin-left:52px;width:calc(100% - 52px)}
</style>
</head>
<body>
<div id="deco" aria-hidden="true">
  <svg class="bolt" style="right:12vw;top:0;width:90px;height:260px" viewBox="0 0 90 260"><path d="M52 0 30 96h22L22 190h18L6 260l66-118H50L80 52H58z" fill="#cfe4ff"/></svg>
  <svg style="left:-40px;bottom:6vh;width:340px;height:220px;opacity:.55" viewBox="0 0 340 220"><path d="M40 170h250l-30 34H70z" fill="#02070a"/><path d="M110 170V30M190 170V18M250 170V60" stroke="#02070a" stroke-width="6"/><path d="M70 40q40 10 40 40H70zM120 26q60 10 64 60h-64zM196 22q56 8 52 56h-52zM200 92q50 6 46 50h-46zM118 100q60 6 64 56h-64zM254 66q34 4 30 40h-30z" fill="#03090d"/><path d="M290 150l40-40" stroke="#02070a" stroke-width="5"/></svg>
  <svg style="left:0;right:0;bottom:0;width:100%;height:120px" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0 60Q60 30 120 60T240 60T360 60T480 60T600 60T720 60T840 60T960 60T1080 60T1200 60V120H0z" fill="#06141a"/><path d="M0 84Q75 62 150 84T300 84T450 84T600 84T750 84T900 84T1050 84T1200 84V120H0z" fill="#030b0f"/></svg>
</div>

<!-- ======== ACCUEIL ======== -->
<section class="screen" id="home">

/* --- rendu général --- */

function setStatus(txt, cls) { const s = $('#status'); s.textContent = txt; s.className = 'status' + (cls ? ' ' + cls : ''); }

}

}

function showBanner(txt, mine) { const b = $('#banner'); b.textContent = txt; b.className = 'banner3' + (mine ? ' mine' : ''); void b.offsetWidth; b.classList.add('show'); }

/* ---------- Chat de la partie ---------- */

{ const jc = window.Party && Party.takeJoin(); if (jc) joinFromParty(jc); }

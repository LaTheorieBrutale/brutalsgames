<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d2a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brutal's Games">
<title>Bataille navale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Bataille navale — « Grand large » : ciel bleu, mer cartoon, navires dessinés à gros contours.
   Écrans : accueil, salon, partie (placement puis bataille), fin. 1 contre 1, en ligne ou contre l'ordinateur. */
:root{
  --bg1:#0d2a4a;--ink:#0a1426;--panel:#1e4675;--panel2:#143257;--line:#2f5f92;--text:#f2f8ff;--muted:#a9c6e6;
  --sea1:#3ab4e6;--sea2:#1872b8;--gold:#ffcf3f;--gold2:#e8a21c;--red:#ff5a4a;--green:#5cd65c;--mine:#5fe8d8;
  --f-title:"Lilita One","Arial Black",system-ui,sans-serif;--f-ui:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;color:var(--text);font-family:var(--f-ui);font-weight:700;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(circle at 86% 9%,#fff7c8 0 3.4vmin,rgba(255,247,200,.35) 3.6vmin,transparent 10vmin),
    linear-gradient(180deg,#4fb6ea 0,#a8e2ff 27%,#e8f8ff 29.5%,#2d93d4 29.8%,#1a6db0 55%,#0f467c 80%,#0b3460 100%) fixed;background-color:var(--bg1)}
[hidden]{display:none!important}
#deco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#deco svg{position:absolute}
#deco .wv{position:absolute;left:-10%;width:120%;height:40px;opacity:.5;animation:wave 7s ease-in-out infinite alternate}
@keyframes wave{to{transform:translateX(6%)}}
.frame{position:relative;background:linear-gradient(180deg,var(--panel),var(--panel2));border:4px solid var(--ink);border-radius:22px;box-shadow:0 7px 0 var(--ink)}
.btn{position:relative;font-family:var(--f-ui);font-weight:900;font-size:17px;color:var(--ink);cursor:pointer;line-height:1.1;text-decoration:none;
  background:linear-gradient(180deg,#ffffff 0,#d4ecff 55%,#9dccf0 100%);border:4px solid var(--ink);border-radius:15px;padding:9px 14px 8px;
  box-shadow:0 5px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.5);transition:transform .07s,box-shadow .07s,filter .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.5)}
@media (hover:hover){.btn:hover{filter:brightness(1.07)}}
.btn:disabled{opacity:.42;cursor:default;transform:none}
.btn.gold{background:linear-gradient(180deg,#fff3b8 0,var(--gold) 55%,var(--gold2) 100%)}
.btn.red{background:linear-gradient(180deg,#ffbcb4 0,var(--red) 55%,#b8322a 100%);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn.icon{padding:7px;border-radius:13px;flex:none}
.btn.icon svg{width:24px;height:24px}
.btn.wide{width:100%;padding:13px 14px 11px}
.btn.sm{font-size:14px;padding:7px 10px 6px}
.field{font-family:var(--f-ui);font-weight:800;font-size:18px;color:var(--text);background:var(--panel2);border:4px solid var(--ink);border-radius:14px;padding:9px 12px 8px;width:100%;min-width:0;outline:none;-webkit-user-select:text;user-select:text;box-shadow:inset 0 3px 0 rgba(0,0,0,.25)}
.field::placeholder{color:var(--muted)}
.field:focus{border-color:var(--gold)}
.field.code{text-transform:uppercase;letter-spacing:.3em;text-align:center}
label,.lbl{font-size:12.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:900}
.sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.sep::before,.sep::after{content:"";flex:1;height:3px;border-radius:2px;background:var(--line)}
.err{margin:0;color:#ff9a9a;font-size:14px;min-height:1em}
.nseg{display:flex;gap:6px;flex-wrap:wrap}
.nseg .btn{flex:1;padding:8px 4px 7px;font-size:14px;background:var(--panel2);color:var(--text);box-shadow:0 3px 0 var(--ink);min-width:0}
.nseg .btn[aria-pressed="true"]{background:linear-gradient(180deg,#fff3b8,var(--gold) 60%,var(--gold2));color:var(--ink)}
.screen{position:fixed;inset:0;z-index:1;overflow-y:auto;display:flex;padding:16px;padding-block:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 70px);animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}}
.col{width:100%;max-width:470px;margin:auto;display:flex;flex-direction:column;gap:14px;align-items:stretch}
.topnav{display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel{padding:16px;display:flex;flex-direction:column;gap:11px}
.row{display:flex;gap:8px;align-items:center}
.logo{display:flex;flex-direction:column;align-items:center;animation:drop .7s cubic-bezier(.2,1.5,.4,1) both}
@keyframes drop{from{opacity:0;transform:translateY(-40px) scale(.85)}}
.logo .boat{width:200px;height:90px;filter:drop-shadow(0 6px 0 var(--ink));animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{translate:0 -6px;rotate:-2deg}}
.logo-t{font-family:var(--f-title);font-size:clamp(44px,12.5vw,68px);line-height:.92;margin-top:2px;letter-spacing:.01em;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);text-align:center}
.logo-t span{color:var(--gold)}
.tagline{font-size:15px;margin-top:8px;background:var(--panel);border:3px solid var(--ink);border-radius:999px;padding:3px 14px 2px;box-shadow:0 3px 0 var(--ink);transform:rotate(-1.5deg)}
.mode{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px 10px;border-radius:20px;text-align:left;justify-content:flex-start}
.mode svg{width:42px;height:42px;flex:none}
.mode span{display:flex;flex-direction:column;gap:2px;min-width:0}
.mode b{font-weight:900;font-size:20px}
.mode small{font-size:12.5px;font-weight:700;opacity:.85}
.bigcode{font-family:var(--f-title);font-size:54px;letter-spacing:.18em;color:var(--gold);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);text-align:center;padding-left:.18em;line-height:1}
.wait-txt{margin:0;font-size:14px;color:var(--muted);text-align:center;line-height:1.45}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.plist{display:flex;flex-wrap:wrap;gap:6px}
.pl{display:flex;align-items:center;gap:6px;font-size:14.5px;background:rgba(0,0,0,.25);border-radius:12px;padding:3px 9px 3px 3px;min-width:0}
.pl svg{width:28px;height:28px;flex:none}
.pl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- Partie ---------- */
#game{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;gap:7px;padding:8px 10px;padding-block:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-bottom,0px) + 8px);max-width:1100px;margin:0 auto;overflow-y:auto}
#game>*{flex-shrink:0}
.hud{display:flex;align-items:center;gap:7px;padding:5px 8px}
.hud .mid{flex:1;min-width:0;text-align:center;line-height:1.1}
.hud .mid small{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.hud .mid b{display:block;font-family:var(--f-title);font-size:17px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* barre des deux amiraux */
.pbar{display:flex;align-items:center;justify-content:center;gap:8px}
.pc{display:flex;align-items:center;gap:7px;min-width:0;flex:1;max-width:330px;background:rgba(10,20,38,.55);border:3px solid var(--ink);border-radius:16px;padding:4px 8px 4px 4px}
.pc.r{flex-direction:row-reverse;padding:4px 4px 4px 8px;text-align:right}
.pc.turn{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,207,63,.35)}
.pc .av{width:38px;height:38px;flex:none}
.pc .nfo{min-width:0;display:flex;flex-direction:column;gap:3px}
.pc.r .nfo{align-items:flex-end}
.pc .nm{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.pc.me .nm{color:var(--mine)}
.fleeticons{display:flex;flex-wrap:wrap;gap:2px 3px;align-items:center;max-width:110px}
.pc.r .fleeticons{justify-content:flex-end}
.fleeticons svg{height:8px;width:auto;flex:none}
.fleeticons svg.dead{opacity:.28}
.vs{font-family:var(--f-title);font-size:20px;color:#fff;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill}
.status{text-align:center;font-family:var(--f-title);font-size:19px;min-height:24px;color:#fff;-webkit-text-stroke:1.2px var(--ink);paint-order:stroke fill;text-shadow:0 2px 0 var(--ink)}
.status.good{color:var(--gold)}.status.bad{color:#ff8a7a}
/* plateaux */
.arena{display:flex;flex-direction:column;align-items:center;gap:10px}
.bwrap{display:grid;grid-template-columns:16px 1fr;grid-template-rows:16px auto;gap:2px;width:100%}
.bwrap .lx{grid-column:2;display:grid;grid-template-columns:repeat(10,1fr)}
.bwrap .ly{grid-row:2;display:grid;grid-template-rows:repeat(10,1fr)}
.bwrap .lx i,.bwrap .ly i{font-style:normal;font-family:var(--f-title);font-size:11px;display:grid;place-items:center;color:#fff;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill}
.bwrap.big{width:min(100%,max(250px,calc(100dvh - 425px)),560px)}
.bcap{font-family:var(--f-title);font-size:14px;letter-spacing:.03em;text-align:center;color:#fff;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill;margin-bottom:2px}
.board{position:relative;width:100%;aspect-ratio:1;border:4px solid var(--ink);border-radius:12px;box-shadow:0 6px 0 var(--ink);touch-action:none;overflow:hidden;
  background:
    linear-gradient(rgba(255,255,255,.2) 1.5px,transparent 1.5px) 0 0/10% 10%,
    linear-gradient(90deg,rgba(255,255,255,.2) 1.5px,transparent 1.5px) 0 0/10% 10%,
    radial-gradient(ellipse 40% 22% at 50% 120%,transparent 60%,rgba(255,255,255,.16) 63% 72%,transparent 75%) 0 0/20% 10%,
    linear-gradient(160deg,var(--sea1),var(--sea2))}
.board.enemy{background:
    linear-gradient(rgba(255,255,255,.18) 1.5px,transparent 1.5px) 0 0/10% 10%,
    linear-gradient(90deg,rgba(255,255,255,.18) 1.5px,transparent 1.5px) 0 0/10% 10%,
    radial-gradient(ellipse 40% 22% at 50% 120%,transparent 60%,rgba(255,255,255,.13) 63% 72%,transparent 75%) 0 0/20% 10%,
    linear-gradient(160deg,#2a8fc4,#0f4f8c)}
.board .ships,.board .fx{position:absolute;inset:0;pointer-events:none}
.board .ships svg{position:absolute;overflow:visible;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.board.edit .ships svg{pointer-events:auto;cursor:grab}
.board .ships svg.wreck{filter:grayscale(.7) brightness(.62) drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.board .ships svg.hidden2{opacity:.55;filter:drop-shadow(0 0 0 transparent)}
.board .ships svg.lift{opacity:.25}
.board .marks{position:absolute;inset:0;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr)}
.board .marks b{position:relative;display:grid;place-items:center;font-weight:400}
.board .marks b svg{width:80%;height:80%;overflow:visible}
.board .marks b.tg{cursor:crosshair}
@media (hover:hover){.board .marks b.tg:hover::after{content:"";position:absolute;inset:10%;border:3px solid var(--gold);border-radius:50%;box-shadow:0 0 0 2px var(--ink),inset 0 0 0 2px var(--ink)}
  .board .marks b.tg:hover::before{content:"";position:absolute;inset:-1px;background:linear-gradient(var(--gold),var(--gold)) 50% 0/3px 100% no-repeat,linear-gradient(var(--gold),var(--gold)) 0 50%/100% 3px no-repeat;opacity:.5}}
.board .marks b.aim::after{content:"";position:absolute;inset:6%;border:3px solid var(--gold);border-radius:50%;box-shadow:0 0 0 2px var(--ink);animation:aim .5s ease-in-out infinite alternate}
@keyframes aim{to{transform:scale(.75)}}
.board .marks b.fresh svg{animation:pop .38s .34s both}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.35)}100%{transform:none}}
.flm{transform-origin:50% 92%;animation:flick .55s ease-in-out infinite alternate}
@keyframes flick{to{transform:scaleY(.86) scaleX(1.06) rotate(-3deg)}}
.board.shake{animation:shake .42s}
@keyframes shake{20%{transform:translate(-5px,2px) rotate(-.6deg)}40%{transform:translate(5px,-2px) rotate(.6deg)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,-1px)}}
.fx .shell{position:absolute;display:grid;place-items:center;animation:fall .34s cubic-bezier(.55,0,1,.6) both}
.fx .shell svg{width:60%;height:60%}
@keyframes fall{from{transform:scale(2.6) translateY(-30%);opacity:0}25%{opacity:1}to{transform:scale(.6);opacity:1}}
.fx .burst{position:absolute;animation:burst .55s .32s ease-out both;border-radius:50%;
  background:radial-gradient(circle,#fff6b0 0 18%,#ffcf3f 22% 38%,#ff7a2a 42% 58%,rgba(255,90,40,.0) 62%)}
@keyframes burst{0%{transform:scale(.2);opacity:1}60%{opacity:1}100%{transform:scale(2.4);opacity:0}}
.fx .ring{position:absolute;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px rgba(10,20,38,.5);animation:ring .6s .32s ease-out both}
@keyframes ring{0%{transform:scale(.2);opacity:1}100%{transform:scale(2.2);opacity:0}}
.fx .drop{position:absolute;width:12%;height:12%;border-radius:50%;background:#e8f8ff;border:2px solid var(--ink);animation:splash .55s .32s ease-out both}
@keyframes splash{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.9);opacity:0}}
.fx .ghost{position:absolute;filter:drop-shadow(0 0 0 3px #5cd65c) drop-shadow(0 4px 0 rgba(0,0,0,.4));opacity:.9}
.fx .ghost.bad{filter:sepia(1) saturate(5) hue-rotate(-40deg) brightness(.9);opacity:.75}
/* côté : mini-plateau ou placement */
.side{display:flex;gap:12px;align-items:center;justify-content:center;width:100%}
.arena.placing .side{flex-direction:column;gap:9px}
body.ingame #deco svg:not(.wv){display:none}
.side .small{width:min(44vw,210px)}
.side .small .board{border-width:3px;box-shadow:0 4px 0 var(--ink);border-radius:9px}
.side .sinfo{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);max-width:170px}
.side .sinfo b{color:#fff;font-size:15px}
.dock{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%;max-width:560px}
.dock .ds{display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(10,20,38,.5);border:3px solid var(--ink);border-radius:14px;padding:6px 8px 4px;cursor:grab;touch-action:none;color:var(--text);font:inherit;font-size:11px;font-weight:900}
.dock .ds svg{height:24px;width:auto;pointer-events:none}
.dock .ds.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,207,63,.35);background:rgba(255,207,63,.15)}
.dock .ds.done{opacity:.3}
.pctrl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%;max-width:560px}
.pctrl .btn{flex:1;min-width:0;font-size:15px;padding:9px 8px 8px}
.phint{margin:0;text-align:center;font-size:13px;color:#e6f4ff;max-width:560px}
.tbar{height:7px;border-radius:4px;background:rgba(0,0,0,.4);overflow:hidden;border:2px solid var(--ink);width:100%;max-width:560px;margin:0 auto}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ff8a3c);transform-origin:left;transition:transform .25s linear}
@media (min-width:900px) and (min-aspect-ratio:1/1){
  .arena{flex-direction:row;justify-content:center;align-items:center;gap:26px;flex:1}
  .bwrap.big{width:min(calc(100dvh - 230px),560px)}
  .side{flex-direction:column;width:auto;max-width:300px}
  .side .small{width:260px}
  .side .sinfo{max-width:260px;text-align:center}
  .arena.placing .side{max-width:360px}
}

/* ---------- Fin ---------- */
.banner{font-family:var(--f-title);font-size:clamp(34px,10vw,54px);text-align:center;line-height:1.05;color:var(--gold);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);transform:rotate(-2deg);animation:drop .6s cubic-bezier(.2,1.5,.4,1) both}
.banner.lose{color:#ff8a7a}
.ranks{display:flex;flex-direction:column;gap:6px}
.ranks .pl{justify-content:flex-start;font-size:16px;padding:5px 10px 5px 5px}
.ranks .pl small{margin-left:auto;color:var(--muted);font-size:12.5px;text-align:right}

/* ---------- Chat ---------- */
.rchat{position:fixed;z-index:22;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);transform:translateX(-50%);width:min(460px,calc(100% - 20px));height:min(62vh,460px);display:flex;flex-direction:column;gap:8px;padding:10px;animation:fadeIn .2s}
.rc-head{display:flex;align-items:center;justify-content:space-between;font-family:var(--f-title);font-size:24px}
.rc-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding:6px;border-radius:12px;background:rgba(0,0,0,.25);font-size:14.5px;line-height:1.35}
.rc-msg{display:flex;gap:6px;align-items:flex-start;overflow-wrap:anywhere}
.rc-msg svg{width:26px;height:26px;flex:none}
.rc-msg b{margin-right:4px}
.rc-msg.me{flex-direction:row-reverse;text-align:right}
.rc-msg .bub{background:var(--panel2);border:2px solid var(--ink);border-radius:12px;padding:3px 9px;max-width:80%}
.rc-msg.me .bub{background:rgba(255,207,63,.18)}
.rc-msg.sys{justify-content:center;color:var(--muted);font-size:12.5px}
.rc-empty{margin:auto;color:var(--muted);font-size:13px;text-align:center}
.rc-form{display:flex;gap:6px}
.rc-form .field{font-size:16px;padding:8px 10px}
.tr{cursor:help}.tr::after{content:" 🌐";font-size:10px;opacity:.65}
.chatbar{position:relative;display:flex;align-items:center;gap:8px;width:100%;max-width:560px;margin:0 auto;padding:7px 12px;font:inherit;font-size:14px;color:var(--text);cursor:pointer;text-align:left;box-shadow:0 4px 0 var(--ink);border-radius:16px}
.chatbar .cb-ico{font-size:19px;flex:none}
.chatbar .cb-txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatbar .cb-txt b{margin-right:4px}
.chatbar .cb-txt i{font-style:normal;color:var(--muted)}
.badge{min-width:22px;height:22px;border-radius:11px;background:var(--red);color:#fff;font-size:12px;display:grid;place-items:center;border:2.5px solid var(--ink);padding:0 5px;flex:none}
.badge:empty{display:none}
.chatbtn{position:relative}.chatbtn .badge{position:absolute;top:-8px;right:-8px}
@media (min-width:1150px){
  body.netlive #rc{display:flex!important;left:auto;right:18px;top:18px;bottom:18px;height:auto;width:330px;transform:none}
  body.netlive .chatbtn,body.netlive .chatbar,body.netlive #rcClose{display:none}
  body.netlive #game{margin:0;left:max(10px,calc((100% - 366px - 1100px) / 2));right:366px}
}
#gchatHome{height:230px}
.sheet{position:fixed;z-index:25;left:50%;top:50%;transform:translate(-50%,-50%);width:min(400px,calc(100% - 28px));max-height:calc(100% - 40px);overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;animation:fadeIn .2s}
.sheet-head{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-title);font-size:28px}
.rules{font-size:14.5px;line-height:1.5}
.rules p{margin:0 0 8px}.rules b{color:var(--gold)}
#toast{position:fixed;z-index:40;left:50%;top:38%;transform:translate(-50%,-50%) scale(.8);background:var(--panel);color:var(--text);border:4px solid var(--ink);border-radius:16px;padding:9px 16px 8px;font-size:17px;box-shadow:0 5px 0 var(--ink);opacity:0;pointer-events:none;transition:opacity .2s,transform .25s cubic-bezier(.2,1.6,.4,1);max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast.bad{background:var(--red);color:#fff}
#toast.good{background:var(--gold);color:var(--ink)}
#toast.big{font-family:var(--f-title);font-size:40px;background:var(--gold);color:var(--ink);padding:12px 24px 8px}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:35}
@media (prefers-reduced-motion:reduce){#deco .wv,.logo .boat{animation:none}}

/* =====================================================================
   RÈGLES ET MOTEUR (chez l'hôte)
   ===================================================================== */
const shipCells = (x, y, len, vert) => { const c = []; for (let k = 0; k < len; k++) c.push(vert ? (y + k) * N + x : y * N + x + k); return c; };
const fits = (x, y, len, vert) => x >= 0 && y >= 0 && (vert ? y + len <= N && x < N : x + len <= N && y < N);
function lineOk(cells, len) {
  if (!Array.isArray(cells) || cells.length !== len || !cells.every(c => Number.isInteger(c) && c >= 0 && c < NN)) return false;
  const s = cells.slice().sort((a, b) => a - b), r = Math.floor(s[0] / N);
  const horiz = s.every((c, i) => c === s[0] + i && Math.floor(c / N) === r), vert = s.every((c, i) => c === s[0] + i * N);
  return horiz || vert;
}
function fleetOk(ships) {
  if (!Array.isArray(ships) || ships.length !== 5) return false;
  const used = new Set();
  for (let i = 0; i < 5; i++) { const s = ships[i]; if (!s || !lineOk(s.cells, LENS[i])) return false; for (const c of s.cells) { if (used.has(c)) return false; used.add(c); } }
  return true;
}
function randomFleet() {
  for (let tries = 0; tries < 400; tries++) {
    const occ = new Set(), near = new Set(), out = []; let ok = true;
    for (let i = 0; i < 5 && ok; i++) {
      const len = LENS[i]; let placed = false;
      for (let k = 0; k < 200 && !placed; k++) {
        const vert = rnd() < 0.5, x = Math.floor(rnd() * N), y = Math.floor(rnd() * N);
        if (!fits(x, y, len, vert)) continue;
        const cells = shipCells(x, y, len, vert);
        if (cells.some(c => occ.has(c) || (tries < 300 && near.has(c)))) continue;
        cells.forEach(c => { occ.add(c); const cx = c % N, cy = Math.floor(c / N); for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { const nx = cx + dx, ny = cy + dy; if (nx >= 0 && ny >= 0 && nx < N && ny < N) near.add(ny * N + nx); } });
        out.push({ cells }); placed = true;
      }
      if (!placed) ok = false;
    }
    if (ok) return out;
  }
  return [0, 1, 2, 3, 4].map(i => ({ cells: shipCells(0, i * 2, LENS[i], false) }));
}
const isSunk = (seat, ship) => ship.cells.every(c => seat.recv[c] === 2);

let S = null, V = null, botTimer = 0;
const net = { relay: null, role: '', code: '', roster: [], conn: null, sess: '', gameNo: 0, me: 0, lobby: [], solo: false };
function newGame() {
  clearTimeout(botTimer);
  S = { phase: 'place', turn: 0, deadline: Date.now() + PLACE_MS, last: null, winner: -1, quit: false, id: (S ? S.id : 0) + 1, auto: [false, false],
    seats: net.roster.map(r => ({ name: r.name, bot: !!r.bot, ships: null, ready: false, recv: new Array(NN).fill(0), shots: 0, hits: 0, gone: !!r.gone })) };
  S.seats.forEach(s => { if (s.bot) { s.ships = randomFleet().map((x, i) => ({ kind: KINDS[i], len: LENS[i], cells: x.cells })); s.ready = true; } });
  sync();
}
function hostFleet(seat, ships) {
  if (!S || S.phase !== 'place') return;
  const p = S.seats[seat]; if (!p || p.ready) return;
  if (!fleetOk(ships)) return;
  p.ships = ships.map((x, i) => ({ kind: KINDS[i], len: LENS[i], cells: x.cells.slice().sort((a, b) => a - b) })); p.ready = true;
  if (S.seats.every(s => s.ready)) startPlay(); else sync();
}
function startPlay() { S.phase = 'play'; S.turn = rnd() < 0.5 ? 0 : 1; S.deadline = Date.now() + TURN_MS; sync(); }
function hostShoot(seat, idx) {
  if (!S || S.phase !== 'play' || seat !== S.turn || !(idx >= 0 && idx < NN)) return;
  const me = S.seats[seat], op = S.seats[1 - seat]; if (!op || op.recv[idx]) return;
  const ship = op.ships.find(s => s.cells.includes(idx)); me.shots++;
  let res = 'm', kind = null;
  if (ship) { op.recv[idx] = 2; me.hits++; res = 'h'; if (isSunk(op, ship)) { res = 's'; kind = ship.kind; } }
  else { op.recv[idx] = 1; S.turn = 1 - seat; }
  S.last = { by: seat, i: idx, r: res, k: kind, id: (S.last ? S.last.id : 0) + 1 };
  S.deadline = Date.now() + TURN_MS;
  if (op.ships.every(s => isSunk(op, s))) return endGame(seat, false);
  sync();
}
function endGame(winner, quit) {
  clearTimeout(botTimer);
  S.phase = 'end'; S.winner = winner; S.quit = !!quit; S.deadline = 0; sync();
  if (quit) return;
  const names = S.seats.map(s => s.name), b = S.seats.map(s => !!s.bot);
  P.pushMatch({ id: `bn${net.code}${net.sess}${net.gameNo}`, t: Date.now(), p: names, w: winner, wa: [winner], b, g: 'bn' });
}
function playerLeft(i) {
  const r = net.roster[i]; if (r) r.gone = true;
  if (!S || S.phase === 'end') return;
  const s = S.seats[i]; if (s) s.gone = true;
  chatSys(t('left', { name: s ? s.name : '?' }));

  const me = V.me, op = 1 - me, P0 = V.pl[me], P1 = V.pl[op] || { n: '?', left: KINDS };
  $('#pbar').innerHTML = pcHtml(P0, me, true, turnOn && V.turn === me) + '<span class="vs">VS</span>' + pcHtml(P1, op, false, turnOn && V.turn === op);
}
function renderPlacing() {
  const me = V.me, op = V.pl[1 - me] || { n: '?' }, ready = V.pl[me].r || PL.sent;
  $('#arena').classList.add('placing');
  $('#hPhase').textContent = t('phPlace');
  renderBar(false);
  const big = $('#bBig'); big.classList.remove('enemy'); big.classList.toggle('edit', !ready);
  $('#smallWrap').hidden = true; $('#sinfo').hidden = true;
  $('#dock').hidden = ready; $('#pctrl').hidden = ready; $('#phint').hidden = ready;
  if (ready) {
    PL.sent = true;
    drawShips(big, V.mine || PL.ships.filter(s => s.cells).map(s => ({ k: s.k, c: s.cells })));
    big.querySelector('.marks').innerHTML = '';
    $('#hInfo').textContent = t('waitOpp', { name: op.n });
    setStatus(V.pl[1 - me] && V.pl[1 - me].r ? '' : t('oppPlacing', { name: op.n }), '');
  } else {
    $('#hInfo').textContent = t('youPlacing');
    setStatus('', '');
    renderPlace(big);
  }
  tbarSet();
}
function setStatus(txt, cls) { const s = $('#status'); s.textContent = txt; s.className = 'status' + (cls ? ' ' + cls : ''); }
function renderBattle() {
  $('#arena').classList.remove('placing');
  const me = V.me, op = 1 - me, my = V.turn === me && V.ph === 'play', opName = (V.pl[op] || {}).n || '?';
  $('#hPhase').textContent = t('phBattle');
  renderBar(V.ph === 'play');
  $('#dock').hidden = true; $('#pctrl').hidden = true; $('#phint').hidden = true;
  $('#smallWrap').hidden = false; $('#sinfo').hidden = false;
  const big = $('#bBig'), small = $('#bSmall');
  big.classList.add('enemy'); big.classList.remove('edit');
  // eaux ennemies : épaves coulées (et toute la flotte à la fin)
  const sunkSet = new Set(); V.opSunk.forEach(s => s.c.forEach(c => sunkSet.add(c)));
  const enemyShips = V.opAll ? V.opAll.map(s => ({ k: s.k, c: s.c, cls: s.s ? 'wreck' : 'hidden2' })) : V.opSunk.map(s => ({ k: s.k, c: s.c, cls: 'wreck' }));
  drawShips(big, enemyShips);
  big.querySelector('.marks').innerHTML = marksHtml(V.opR, sunkSet, my && !pending, false);
  drawShips(small, (V.mine || []).map(s => ({ k: s.k, c: s.c, cls: s.s ? 'wreck' : '' })));
  small.querySelector('.marks').innerHTML = marksHtml(V.myR, new Set(), false, true);
  const P0 = V.pl[me], P1 = V.pl[op] || { sh: 0, h: 0, left: [] };
  $('#sinfo').innerHTML = `<span>${t('shipsLeft', { n: `<b>${P0.left.length}</b>` })}</span><span>${t('shots')} : <b>${P0.sh}</b> · ${t('accuracy')} : <b>${P0.sh ? Math.round(100 * P0.h / P0.sh) : 0} %</b></span>`;
  // nouveau tir : animation et annonce
  const L = V.last, fresh = L && L.id !== lastShotId;
  if (fresh) {
    lastShotId = L.id; pending = false;
    const board = L.by === me ? big : small, cell = board.querySelector(`.marks [data-c="${L.i}"]`);
    if (cell) cell.classList.add('fresh');
    shotFx(board, L.i, L.r !== 'm', L.r === 's');
    const byMe = L.by === me, who = esc((V.pl[L.by] || {}).n || '');
    if (L.r === 's') { const ship = t('s_' + L.k); setTimeout(() => { toast('💥 ' + (byMe ? esc(t('sunkYou', { ship })) : esc(t('sunkMe', { name: (V.pl[L.by] || {}).n || '', ship }))), byMe ? 'good' : true, 2200); P.sfx(byMe ? 'good' : 'bad'); }, 420); }
  }
  // texte d'état
  if (V.ph === 'end') {
    const iWon = V.win === me;
    $('#hInfo').textContent = iWon ? t('win') : t('lose');
    setStatus(V.quit ? t('oppQuit', { name: opName }) : (iWon ? t('win') : t('lose')), iWon ? 'good' : 'bad');
  } else if (my) {
    $('#hInfo').textContent = t('yourTurn');
    setStatus(L && L.by === me && L.r !== 'm' ? t('hitAgain') : L && L.by === op && L.r === 'm' ? t('oppMiss', { name: opName }) : V.auto && !L ? t('autoPlaced') : t('yourTurn'), L && L.by === me && L.r !== 'm' ? 'good' : '');
  } else {
    $('#hInfo').textContent = t('oppTurn', { name: opName });
    setStatus(L && L.by === op && L.r !== 'm' ? t('gotHit', { name: opName }) : L && L.by === me && L.r === 'm' ? t('miss') : t('oppTurn', { name: opName }), L && L.by === op && L.r !== 'm' ? 'bad' : '');
  }
  if (fresh && L.by !== me && V.turn === me) { P.sfx('hint'); try { navigator.vibrate && navigator.vibrate(30); } catch (e) {} }
  tbarSet();
}
function shotFx(board, idx, hit, sunk) {
  const fx = board.querySelector('.fx'), x = idx % N, y = Math.floor(idx / N), st = `left:${pct(x)};top:${pct(y)};width:10%;height:10%`;
  const add = (cls, extra, inner) => { const el = document.createElement('div'); el.className = cls; el.setAttribute('style', st + (extra || '')); if (inner) el.innerHTML = inner; fx.appendChild(el); setTimeout(() => el.remove(), 1200); return el; };
  add('shell', '', SHELL); sShot();
  if (hit) {
    add('burst', ''); if (sunk) add('burst', ';animation-delay:.45s');
    sBoom(sunk); setTimeout(() => { board.classList.remove('shake'); void board.offsetWidth; board.classList.add('shake'); }, 330);
  } else {
    add('ring', ''); [[-1, -1], [1, -1], [-1.2, .4], [1.2, .4], [0, -1.4]].forEach(([dx, dy]) => add('drop', `;width:4%;height:4%;margin:3% 0 0 3%;--dx:${dx * 140}%;--dy:${dy * 140}%`));
    sSplash();
  }
}
let tbarDl = 0, tbarDur = 1;
function tbarSet() { tbarDl = Date.now() + (V.rem || 0); tbarDur = V.dur || TURN_MS; }
setInterval(() => { const b = $('#tbar'); if (b && V && V.ph !== 'end') b.style.transform = `scaleX(${Math.max(0, Math.min(1, (tbarDl - Date.now()) / tbarDur))})`; }, 250);
$('#bBig').addEventListener('click', e => {
  if (!V || V.ph !== 'play' || V.turn !== V.me || pending) return;
  const c = e.target.closest('[data-c]'); if (!c) return;
  const i = +c.dataset.c; if (V.opR[i]) return;
  pending = true; c.classList.add('aim'); $('#bBig').querySelectorAll('.tg').forEach(x => x.classList.remove('tg'));
  P.unlockAudio(); send({ t: 'shoot', i });
  setTimeout(() => { if (pending) { pending = false; if (V) render(); } }, 4000);
});
$('#bQuit').onclick = () => {
  P.sfx('click');
  if (Date.now() - (window.__q || 0) > 2500) { window.__q = Date.now(); toast(t('quitQ') + ' ✕'); return; }
  clearTimeout(endTimer); leaveNet(); S = null; V = null; show('home');
};

/* ---------- Fin ---------- */
let endKey = '';
function renderEnd() {
  if (!V || V.ph !== 'end') return;
  show('end');
  const me = V.me, iWon = V.win === me, b = $('#endTitle');
  b.textContent = iWon ? '🏆 ' + t('win') : t('lose'); b.classList.toggle('lose', !iWon);
  $('#ranks').innerHTML = V.pl.map((p, i) => ({ p, i })).sort((a, b2) => (b2.i === V.win) - (a.i === V.win)).map(({ p, i }) =>
    `<div class="pl">${i === V.win ? '🥇' : '🥈'} ${avatar(i, p.b)}<span>${esc(p.n)}</span><small>${esc(t('statLine', { s: p.sh, p: p.sh ? Math.round(100 * p.h / p.sh) : 0 }))}</small></div>`).join('')
    + (V.quit ? `<p class="wait-txt">${esc(t('oppQuit', { name: (V.pl[1 - me] || {}).n || '?' }))}</p>` : '');
  const guest = net.role !== 'host';
  $('#bAgain').hidden = guest; $('#endWait').textContent = guest ? t('hostAgain') : ''; $('#bMenu').hidden = net.solo;
  const k = net.gameNo + ':' + net.sess + ':' + V.gid;
  if (endKey !== k) { endKey = k; P.sfx(iWon ? 'win' : 'lose'); if (iWon) P.confetti($('#confetti')); }
}
$('#bAgain').onclick = () => { P.sfx('click'); P.stopConfetti(); if (net.solo) { net.gameNo++; resetPlace(); show('game'); newGame(); } else if (net.role === 'host') { if (net.roster.filter(r => !r.gone).length < 2) { $('#bMenu').click(); return; } $('#bStart').click(); } };
$('#bMenu').onclick = () => {
  P.sfx('click'); P.stopConfetti();
  if (net.relay) { S = null; V = null; show('online'); $('#onForm').hidden = true; $('#onWait').hidden = false; if (net.role === 'host') { net.roster = net.roster.filter(r => !r.gone); broadcastLobby(); } else renderLobby(); return; }
  show('home');
};

/* ---------- Chat de la partie ---------- */
const CHAT = { list: [], unread: 0 };
const wideChat = () => matchMedia('(min-width:1150px)').matches && document.body.classList.contains('netlive');
const chatVisible = () => !$('#rc').hidden || wideChat();
function chatIn(s, txt, l) {
  txt = String(txt || '').replace(/\s+/g, ' ').trim().slice(0, 160); if (!txt) return;
  const r = net.roster[s] || {};
  const m = { s, n: r.name || '?', txt, l: ['fr', 'en', 'cs'].includes(l) ? l : 'fr' };
  net.roster.forEach(o => { if (o.conn && o.conn.open && !o.gone) o.conn.send({ t: 'chat', m }); });
  chatAdd(m);
}
function chatSys(txt) { const m = { sys: true, txt }; net.roster.forEach(o => { if (o.conn && o.conn.open && !o.gone) o.conn.send({ t: 'chat', m }); }); chatAdd(m); }
function chatAdd(m) {
  if (!m || typeof m.txt !== 'string') return;
  CHAT.list.push({ s: m.s | 0, n: String(m.n || '?').slice(0, 14), txt: m.txt.slice(0, 160), l: m.l, sys: !!m.sys });
  if (CHAT.list.length > 80) CHAT.list.shift();
  if (!m.sys && m.s !== net.me) { if (!chatVisible()) { CHAT.unread++; toast(`💬 <b>${esc(String(m.n || '?'))}</b> : ${esc(String(m.txt).slice(0, 60))}`); } P.sfx('chat'); }
  renderChat();
}
function renderChat() {
  const L = $('#rcList');
  L.innerHTML = CHAT.list.length ? CHAT.list.map(m => m.sys ? `<div class="rc-msg sys">${esc(m.txt)}</div>` : `<div class="rc-msg${m.s === net.me ? ' me' : ''}">${avatar(m.s)}<div class="bub"><b style="color:${COLORS[m.s % 10]}">${esc(m.n)}</b>${trHtml(m.txt, m.l, m.s === net.me)}</div></div>`).join('') : `<p class="rc-empty">${t('chatEmpty')}</p>`;
  L.scrollTop = L.scrollHeight;
  if (chatVisible()) CHAT.unread = 0;
  document.querySelectorAll('.badge').forEach(b => { b.textContent = CHAT.unread ? CHAT.unread : ''; });
  const last = [...CHAT.list].reverse().find(m => !m.sys);
  const bar = last ? `<b style="color:${COLORS[last.s % 10]}">${esc(last.n)}</b>${trHtml(last.txt, last.l, last.s === net.me)}` : `<i>${t('chatInvite')}</i>`;
  document.querySelectorAll('.chatbar .cb-txt').forEach(el => { el.innerHTML = bar; });
  document.querySelectorAll('#chatBar, #bChat').forEach(el => { el.style.display = net.solo ? 'none' : ''; });
}
function toggleChat(open) { $('#rc').hidden = !open; if (open) { CHAT.unread = 0; renderChat(); setTimeout(() => $('#rcIn').focus(), 50); } }
$('#bChat').onclick = () => { P.sfx('click'); toggleChat($('#rc').hidden); };
$('#chatBar').onclick = () => { P.sfx('click'); toggleChat(true); };
$('#bChatL').onclick = () => { P.sfx('click'); toggleChat(true); };
$('#rcClose').onclick = () => { P.sfx('click'); toggleChat(false); };
$('#rcForm').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('#rcIn').value.replace(/\s+/g, ' ').trim().slice(0, 160); if (!v) return;
  $('#rcIn').value = '';
  if (net.role === 'host') chatIn(0, v, P.lang()); else if (net.conn && net.conn.open) net.conn.send({ t: 'chat', txt: v, l: P.lang() });
});
window.addEventListener('resize', renderChat);
const gcHome = window.GChat ? GChat.mount($('#gchatHome'), { db: P.DB_URL, lang: P.lang, name: () => P.hasName() ? P.name() : '', needName: () => P.needName($('#inName')) }) : null;

/* ---------- Groupe d'amis ---------- */
function joinFromParty(c) { P.stopConfetti(); S = null; V = null; pendingJoin = c; if (!P.hasName()) { show('home'); nameOk(); return; } $('#mOnline').click(); }
if (window.Party) { Party.busy = () => !$('#game').hidden && !!V && V.ph !== 'end' && !net.solo; Party.onJoinHere = (g, c) => { joinFromParty(c); return true; }; }

/* ---------- Démarrage ---------- */
P.onLang(() => {
  if (net.role === 'guest' && net.conn && net.conn.open) net.conn.send({ t: 'lang', l: P.lang() });
  renderSnd(); renderMus(); renderChat(); if (gcHome) gcHome.refresh();
  if (!$('#onWait').hidden) renderLobby(); if (V) render();
});
P.applyStatic(); renderSnd(); renderMus(); renderChat();
{ const jc = window.Party && Party.takeJoin(); if (jc) joinFromParty(jc); }
window.__bn = { get S() { return S; }, get V() { return V; }, net, PL, randomFleet, fleetOk, botPick: s => botPick(s), hostShoot: (s, i) => hostShoot(s, i) };
})();

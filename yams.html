<!doctype html>
<html lang="fr" data-title="gn_ym">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1424">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brutal's Games">
<title>Yam's</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titan+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Yam's — « Lagon Tiki » : plage tropicale au crépuscule, palmiers, torches tiki, piste de dés turquoise et bambou.
   Écrans : accueil, salon, partie, fin. Chaque joueur choisit ses dés (skins). */
:root{--mine:#5fe8d8;
  --bg1:#0b1424;--bg2:#1b2f4e;--ink:#06101a;--panel:#1d4058;--panel2:#132d40;--line:#2f5a72;--text:#eefaf6;--muted:#9cc4c8;
  --felt:#13838a;--felt2:#0b5a62;--wood:#d6a24c;--gold:#f2c14e;--gold2:#c8902a;--red:#e04848;--green:#5cc24a;--blue:#4aa3ff;
  --f-title:"Titan One","Arial Black",system-ui,sans-serif;--f-ui:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;color:var(--text);font-family:var(--f-ui);font-weight:700;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(circle at 82% 12%,#fff3c4 0 3.2vmin,rgba(255,243,196,.25) 3.4vmin,transparent 9vmin),radial-gradient(ellipse at 50% 108%,rgba(255,120,90,.35),transparent 55%),
    linear-gradient(180deg,var(--bg1) 0,#22325a 55%,#3a3a6a 78%,#1a5a6a 78.4%,#0e3c4a 100%) fixed;background-color:var(--bg1)}
[hidden]{display:none!important}
#deco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#deco svg{position:absolute}
.frame{position:relative;background:linear-gradient(180deg,var(--panel),var(--panel2));border:4px solid var(--ink);border-radius:22px;box-shadow:0 7px 0 var(--ink)}
.btn{position:relative;font-family:var(--f-ui);font-weight:900;font-size:17px;color:var(--ink);cursor:pointer;line-height:1.1;text-decoration:none;
  background:linear-gradient(180deg,#d8fbf4 0,#8ee3d6 55%,#55bfb2 100%);border:4px solid var(--ink);border-radius:15px;padding:9px 14px 8px;
  box-shadow:0 5px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.4);transition:transform .07s,box-shadow .07s,filter .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.4)}
@media (hover:hover){.btn:hover{filter:brightness(1.07)}}
.btn:disabled{opacity:.42;cursor:default;transform:none}
.btn.gold{background:linear-gradient(180deg,#fff0b8 0,#ffc23e 55%,#f08a2a 100%)}
.btn.red{background:linear-gradient(180deg,#ffb8b8 0,var(--red) 55%,#a82a2a 100%);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn.icon{padding:7px;border-radius:13px;flex:none}
.btn.icon svg{width:24px;height:24px}
.btn.wide{width:100%;padding:13px 14px 11px}
.btn.sm{font-size:14px;padding:7px 10px 6px}
.field{font-family:var(--f-ui);font-weight:800;font-size:18px;color:var(--text);background:var(--panel2);border:4px solid var(--ink);border-radius:14px;padding:9px 12px 8px;width:100%;min-width:0;outline:none;-webkit-user-select:text;user-select:text;box-shadow:inset 0 3px 0 rgba(0,0,0,.25)}
.field::placeholder{color:var(--muted)}
.field:focus{border-color:var(--gold)}
.field.code{text-transform:uppercase;letter-spacing:.3em;text-align:center}
label,.lbl{font-size:12.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:900}
.sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.sep::before,.sep::after{content:"";flex:1;height:3px;border-radius:2px;background:var(--line)}
.err{margin:0;color:#ff9a9a;font-size:14px;min-height:1em}
.nseg{display:flex;gap:6px;flex-wrap:wrap}
.nseg .btn{flex:1;padding:8px 4px 7px;font-size:14px;background:var(--panel2);color:var(--text);box-shadow:0 3px 0 var(--ink);min-width:0}
.nseg .btn[aria-pressed="true"]{background:linear-gradient(180deg,#fff0b8,var(--gold) 60%,var(--gold2));color:var(--ink)}
.screen{position:fixed;inset:0;z-index:1;overflow-y:auto;display:flex;padding:16px;padding-block:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 70px);animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}}
.col{width:100%;max-width:470px;margin:auto;display:flex;flex-direction:column;gap:14px;align-items:stretch}
.topnav{display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel{padding:16px;display:flex;flex-direction:column;gap:11px}
.row{display:flex;gap:8px;align-items:center}
.logo{display:flex;flex-direction:column;align-items:center;animation:drop .7s cubic-bezier(.2,1.5,.4,1) both}
@keyframes drop{from{opacity:0;transform:translateY(-40px) scale(.85)}}
.logo .dice{display:flex;gap:6px;filter:drop-shadow(0 6px 0 var(--ink))}
.logo .dice svg{width:56px;height:56px;animation:bob 3s ease-in-out infinite}
.logo .dice svg:nth-child(2){animation-delay:-.6s;transform:rotate(8deg)}.logo .dice svg:nth-child(3){animation-delay:-1.2s}
@keyframes bob{50%{translate:0 -7px;rotate:-6deg}}
.logo-t{font-family:var(--f-title);font-size:clamp(54px,15vw,80px);line-height:.95;margin-top:4px;letter-spacing:.02em;color:var(--gold);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
.tagline{font-size:15px;margin-top:8px;background:var(--panel);border:3px solid var(--ink);border-radius:999px;padding:3px 14px 2px;box-shadow:0 3px 0 var(--ink);transform:rotate(-1.5deg)}
.mode{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px 10px;border-radius:20px;text-align:left;justify-content:flex-start}
.mode svg{width:42px;height:42px;flex:none}
.mode span{display:flex;flex-direction:column;gap:2px;min-width:0}
.mode b{font-weight:900;font-size:20px}
.mode small{font-size:12.5px;font-weight:700;opacity:.85}
.bigcode{font-family:var(--f-title);font-size:54px;letter-spacing:.18em;color:var(--gold);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);text-align:center;padding-left:.18em;line-height:1}
.wait-txt{margin:0;font-size:14px;color:var(--muted);text-align:center;line-height:1.45}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.plist{display:flex;flex-wrap:wrap;gap:6px}
.pl{display:flex;align-items:center;gap:6px;font-size:14.5px;background:rgba(0,0,0,.25);border-radius:12px;padding:3px 9px 3px 3px;min-width:0}
.pl svg{width:28px;height:28px;flex:none}
.pl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* sélecteur de dés */
.skins{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.skins button{background:rgba(0,0,0,.25);border:3px solid var(--ink);border-radius:14px;padding:6px 2px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text);font:inherit;font-size:10.5px;font-weight:900}
.skins button svg{width:38px;height:38px}
.skins button.on{border-color:var(--gold);background:rgba(242,193,78,.18);box-shadow:0 0 0 2px rgba(242,193,78,.35)}

/* ---------- Partie : disposition « feuille en 2 colonnes » ---------- */
#game{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;gap:6px;padding:8px 10px;padding-block:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-bottom,0px) + 8px);max-width:640px;margin:0 auto;overflow-y:auto;overscroll-behavior:contain}
#game>*{flex-shrink:0}
.hud{display:flex;align-items:center;gap:7px;padding:5px 8px;flex:none}
.hud .mid{flex:1;min-width:0;text-align:center;line-height:1.1}
.hud .mid small{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.hud .mid b{display:block;font-family:var(--f-title);font-size:16px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* tableau des joueurs */
.versus{flex:none;display:flex;align-items:center;justify-content:center;gap:10px;padding:2px 4px}
.versus .vs{font-family:var(--f-title);font-size:20px;color:var(--muted)}
.vp{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;cursor:pointer;background:none;border:0;padding:0;color:var(--text);font:inherit}
.vp .av{position:relative;width:52px;height:52px;border-radius:50%;border:3px solid var(--ink);background:var(--panel);display:grid;place-items:center;box-shadow:0 3px 0 var(--ink)}
.vp .av svg{width:38px;height:38px}
.vp.turn .av{border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,193,78,.45),0 3px 0 var(--ink)}
.vp.turn .av::before{content:"";position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:28px;height:5px;border-radius:3px;background:var(--gold)}
.vp .info{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.vp .nm{font-size:13px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vp.me .nm::before{content:"● ";color:var(--green)}
.vp .sc{font-family:var(--f-title);font-size:28px;line-height:1}
.vp.cmp .sc{color:var(--gold)}.vp.me .sc{color:var(--mine)}
.versus.many{gap:6px;overflow-x:auto;justify-content:flex-start;scrollbar-width:none}
.versus.many::-webkit-scrollbar{display:none}
.versus.many .vp .av{width:42px;height:42px}.versus.many .vp .av svg{width:30px;height:30px}.versus.many .vp .sc{font-size:20px}
.versus.duo .vp{flex-direction:row;gap:8px}
.versus.duo .vp .info{display:flex;flex-direction:column;align-items:center}
.status{flex:none;text-align:center;font-size:15px;min-height:20px}
.status b{color:var(--gold)}
/* grille */
.grid{flex:1 0 auto;min-height:0;display:grid;grid-template-columns:1fr 1fr;border:4px solid var(--ink);border-radius:18px;overflow:hidden;background:#0f2434;box-shadow:0 6px 0 var(--ink)}
.gcol{display:flex;flex-direction:column;min-width:0}
.gcol+.gcol{border-left:3px solid var(--ink)}
.ghead{display:grid;grid-template-columns:1fr 46px 50px;align-items:center;padding:3px 6px;font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;background:#0c1d2b}
.ghead span{text-align:center;overflow:hidden;font-size:10.5px;font-weight:900;line-height:1.05;word-break:break-all;text-transform:none;letter-spacing:0;max-height:2.2em}
.grow{flex:1;min-height:34px;display:grid;grid-template-columns:1fr 46px 50px;align-items:center;gap:0;padding:2px 6px;border-top:2px solid rgba(0,0,0,.45);background:linear-gradient(180deg,#1f4a62,#183c52)}
.grow .ic{display:flex;align-items:center;gap:6px;min-width:0}
.grow .ic svg{width:clamp(28px,8vw,40px);height:clamp(28px,8vw,40px);flex:none;filter:drop-shadow(0 2px 0 rgba(0,0,0,.5))}
.badge2{position:relative;display:grid;place-items:center;box-sizing:border-box;width:calc(clamp(28px,8vw,40px) * .92);height:calc(clamp(28px,8vw,40px) * .92);margin:calc(clamp(28px,8vw,40px) * .04);flex:none;padding:0;border-radius:22%;
  background:linear-gradient(135deg,#ffffff,#e4ded2);border:2px solid var(--ink);color:#1c1620;font-family:var(--f-title);font-size:clamp(11px,3.4vw,16px);letter-spacing:-.03em;line-height:1;box-shadow:0 2px 0 rgba(0,0,0,.5);overflow:hidden}
.badge2::before{content:"";position:absolute;left:6%;right:6%;top:5%;height:24%;border-radius:999px;background:rgba(255,255,255,.22)}
.grow .v{text-align:center;font-family:var(--f-title);font-size:clamp(17px,5vw,24px);color:var(--gold)}
.grow .v.empty{color:rgba(255,255,255,.18)}
.grow .me{margin:0 0 0 4px;height:calc(100% - 4px);min-height:28px;display:grid;place-items:center;border-radius:9px;background:#0c1d2b;font-family:var(--f-title);font-size:clamp(17px,5vw,24px);color:var(--mine)}
.grow .me.empty{color:rgba(255,255,255,.12)}
.grow .me.pick{cursor:pointer;background:rgba(92,194,74,.22);color:#b8ff9a;outline:2px dashed rgba(142,224,106,.7);outline-offset:-3px}
.grow .me.pick.zero{background:rgba(224,72,72,.14);color:#ff9a9a;outline-color:rgba(255,120,120,.5)}
@media (hover:hover){.grow .me.pick:hover{background:rgba(92,194,74,.45)}}
.grow .me.just,.grow .v.just{animation:flash 1.2s}
@keyframes flash{0%,40%{background:var(--gold);color:var(--ink)}}
.grow.bon{background:linear-gradient(180deg,#173a50,#122e42)}
.grow.bon .lbl2{font-family:var(--f-title);font-size:16px;line-height:1}
.grow.bon .lbl2{min-width:0;overflow:hidden}.grow.bon .lbl2 small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-ui);font-size:10px;color:var(--muted);font-weight:800}
.ytag{font-size:10px;color:#ffcf6a;display:block;line-height:1}
.gtot{display:grid;grid-template-columns:1fr 46px 50px;align-items:center;padding:6px;background:#0c1d2b;border-top:3px solid var(--ink);font-family:var(--f-title);font-size:15px}
.gtot span{text-align:center;color:var(--gold)}.gtot span:first-child{text-align:left;color:var(--text);font-size:13px}.gtot span:last-child{color:var(--mine)}
/* dés */
.tray{flex:none;position:relative;padding:10px 8px 8px;border-radius:22px;border:4px solid var(--ink);
  background:radial-gradient(ellipse at 50% 30%,rgba(255,255,255,.1),transparent 65%),repeating-radial-gradient(circle at 40% 40%,rgba(0,0,0,.05) 0 2px,transparent 2px 5px),linear-gradient(180deg,var(--felt),var(--felt2));
  box-shadow:inset 0 0 0 7px var(--wood),inset 0 0 0 10px var(--ink),inset 0 0 22px 10px rgba(0,0,0,.4),0 6px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px}
.dicerow{display:flex;gap:clamp(5px,2vw,14px);justify-content:center;padding:4px 0 6px}
.die{position:relative;width:clamp(50px,15vw,78px);height:clamp(50px,15vw,78px);background:none;border:0;padding:0;cursor:pointer;transition:transform .15s}
.die svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 0 rgba(0,0,0,.55))}
.die.held{transform:translateY(-7px)}
.die.held::after{content:"";position:absolute;left:12%;right:12%;bottom:-11px;height:5px;border-radius:3px;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.die:disabled{cursor:default}
.die .dbody{display:block;width:100%;height:100%;position:relative;z-index:1;isolation:isolate;transform-origin:50% 80%;will-change:transform}
.die .dsh{position:absolute;left:10%;right:10%;bottom:-6px;height:9px;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(2px);opacity:0;pointer-events:none}
.die.anim .dsh{opacity:1}
.die.anim svg{filter:drop-shadow(0 2px 0 rgba(0,0,0,.5))}
.dicerow.busy .die{pointer-events:none}
.tray{overflow:hidden}
.die .ghost{position:absolute;inset:0;z-index:2;pointer-events:none}.die .ghost svg{filter:none}
.die .glow{position:absolute;inset:-14%;z-index:-1;border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(circle,rgba(255,230,120,.0) 48%,rgba(255,214,80,.55) 58%,rgba(255,240,170,.95) 63%,rgba(255,200,60,.35) 68%,transparent 74%);filter:drop-shadow(0 0 8px rgba(255,210,80,.9))}
.tray .spark{position:absolute;z-index:3;pointer-events:none;background:#fff3b0;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);filter:drop-shadow(0 0 3px #ffd34a)}
#bRoll.shake{animation:shake .32s}
@keyframes shake{20%{transform:rotate(-5deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}
.die.blank svg{opacity:.3}
.rollbar{display:flex;align-items:center;gap:10px;width:100%;justify-content:center}
.rollbar .btn{min-width:150px;font-size:18px;padding:8px 14px 7px}
.pipsleft{display:flex;gap:4px}
.pipsleft i{width:12px;height:12px;border-radius:50%;border:2.5px solid var(--ink);background:var(--gold)}
.pipsleft i.off{background:rgba(0,0,0,.35)}
.hint{margin:0;font-size:12.5px;color:#d8fbf4;text-align:center;min-height:1.2em}
.tbar{width:100%;height:6px;border-radius:4px;background:rgba(0,0,0,.4);overflow:hidden;border:2px solid var(--ink)}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ff9a3c);transform-origin:left;transition:transform .25s linear}
@media (max-height:800px){
  .versus .vp{flex-direction:row;gap:7px}.versus .vp .info{display:flex;flex-direction:column;align-items:flex-start}
  .vp .av{width:40px;height:40px;border-width:2.5px}.vp .av svg{width:30px;height:30px}.vp.turn .av::before{top:-8px;width:22px;height:4px}
  .vp .sc{font-size:22px}.status{font-size:13.5px;min-height:18px}#game{gap:5px}
  .tray{padding:7px 8px 6px;gap:4px}.dicerow{padding:2px 0 4px}.die{width:clamp(44px,13.5vw,66px);height:clamp(44px,13.5vw,66px)}
  .rollbar .btn{font-size:16px;padding:6px 12px 5px}.hint{font-size:11.5px}
}
@media (max-height:690px){#chatBar{display:none!important}.die{width:clamp(40px,12vw,58px);height:clamp(40px,12vw,58px)}.hud{padding:3px 6px}.hud .btn.icon{padding:5px}}

/* ---------- Fin ---------- */
.banner{font-family:var(--f-title);font-size:clamp(30px,9vw,48px);text-align:center;line-height:1.05;color:var(--gold);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);transform:rotate(-2deg);animation:drop .6s cubic-bezier(.2,1.5,.4,1) both}
.ranks{display:flex;flex-direction:column;gap:5px}
.ranks .pl{justify-content:flex-start;font-size:16px}
.ranks .pl b{margin-left:auto;color:var(--gold);font-family:var(--f-title);font-weight:400}

/* ---------- Chat ---------- */
.rchat{position:fixed;z-index:22;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);transform:translateX(-50%);width:min(460px,calc(100% - 20px));height:min(62vh,460px);display:flex;flex-direction:column;gap:8px;padding:10px;animation:fadeIn .2s}
.rc-head{display:flex;align-items:center;justify-content:space-between;font-family:var(--f-title);font-size:24px}
.rc-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding:6px;border-radius:12px;background:rgba(0,0,0,.25);font-size:14.5px;line-height:1.35}
.rc-msg{display:flex;gap:6px;align-items:flex-start;overflow-wrap:anywhere}
.rc-msg svg{width:26px;height:26px;flex:none}
.rc-msg b{margin-right:4px}
.rc-msg.me{flex-direction:row-reverse;text-align:right}
.rc-msg .bub{background:var(--panel2);border:2px solid var(--ink);border-radius:12px;padding:3px 9px;max-width:80%}
.rc-msg.me .bub{background:rgba(242,193,78,.18)}
.rc-msg.sys{justify-content:center;color:var(--muted);font-size:12.5px}
.rc-empty{margin:auto;color:var(--muted);font-size:13px;text-align:center}
.rc-form{display:flex;gap:6px}
.rc-form .field{font-size:16px;padding:8px 10px}
.tr{cursor:help}.tr::after{content:" 🌐";font-size:10px;opacity:.65}
.chatbar{position:relative;display:flex;align-items:center;gap:8px;width:100%;padding:7px 12px;font:inherit;font-size:14px;color:var(--text);cursor:pointer;text-align:left;box-shadow:0 4px 0 var(--ink);border-radius:16px;flex:none}
.chatbar .cb-ico{font-size:19px;flex:none}
.chatbar .cb-txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatbar .cb-txt b{margin-right:4px}
.chatbar .cb-txt i{font-style:normal;color:var(--muted)}
.badge{min-width:22px;height:22px;border-radius:11px;background:var(--red);color:#fff;font-size:12px;display:grid;place-items:center;border:2.5px solid var(--ink);padding:0 5px;flex:none}
.badge:empty{display:none}
.chatbtn{position:relative}.chatbtn .badge{position:absolute;top:-8px;right:-8px}
@media (min-width:1150px){
  body.netlive #rc{display:flex!important;left:auto;right:18px;top:18px;bottom:18px;height:auto;width:330px;transform:none}

const MU = { on: P.get('ym-music', '1') !== '0', ctx: null, bus: null, timer: 0, step: 0, nextT: 0, vol: 1, noise: null };

/* ---------- Bruit des dés : vrais enregistrements (dé sur table en bois, dé contre dé) ----------
   Pour chaque dé on enchaîne quelques chocs calés sur l'animation : il roule, rebondit et se pose. */
const DS = { hits: [], clicks: [], loading: null };
function dsLoad(c) {
  if (DS.loading || !c) return DS.loading;
  const L = (name, list) => fetch('sounds/dice/' + name + '.mp3').then(r => r.arrayBuffer())
    .then(a => new Promise((res, rej) => c.decodeAudioData(a, res, rej))).then(b => { list.push(b); }).catch(() => {});
  const jobs = [];
  for (let i = 1; i <= 7; i++) jobs.push(L('wood' + i, DS.hits));
  for (let i = 1; i <= 15; i++) jobs.push(L('hit' + i, DS.clicks));
  return DS.loading = Promise.all(jobs);
}

  const set = click && DS.clicks.length ? DS.clicks : DS.hits; if (!set.length) return;
  const s = c.createBufferSource(), t = Math.max(when, c.currentTime);
  s.buffer = set[Math.floor(Math.random() * set.length)]; s.playbackRate.value = 0.94 + Math.random() * 0.14;
  const g = c.createGain(); g.gain.value = vol;
  let out = g;
  if (c.createStereoPanner) { const pn = c.createStereoPanner(); pn.pan.value = Math.max(-1, Math.min(1, pan)); g.connect(pn); out = pn; }
  s.connect(g); out.connect(dest); s.start(t);

// un dé qui arrive en roulant : chocs de plus en plus rapprochés et doux, puis il se pose (et cogne parfois son voisin)
function dsDie(c, dest, t0, dur, pan, vol) {
  [[0.03, 1], [0.24, 0.8], [0.45, 0.75], [0.62, 0.55], [0.76, 0.45], [0.87, 0.35], [0.95, 0.18]].forEach(([f, a], i) => {
    if (i > 1 && i < 6 && Math.random() < 0.2) return;
    dsHit(c, dest, t0 + dur * (f + (Math.random() - 0.5) * 0.03), vol * a * (0.8 + Math.random() * 0.35), pan * (1 - f * 0.6), false);
  });
  if (Math.random() < 0.7) dsHit(c, dest, t0 + dur * (0.86 + Math.random() * 0.08), vol * 0.6, pan * 0.4, true);
  if (Math.random() < 0.35) dsHit(c, dest, t0 + dur * (0.5 + Math.random() * 0.2), vol * 0.4, pan * 0.7, true);

  const c = P.audio(); if (!c || !P.soundOn()) return; dsLoad(c);
  const dest = c.createGain(); dest.gain.value = 0.55 * P.sfxVol(); dest.connect(c.destination);
  const now = c.currentTime;
  plan.forEach(p => dsDie(c, dest, now + p.delay / 1000, p.dur / 1000, p.pan, 1));

const ROLL_MS = 1050;

  const row = $('#dice'), all = [...row.querySelectorAll('.die')], dice = all.filter(b => b.classList.contains('rolling'));
  if (!dice.length || !Element.prototype.animate) return 0;
  row.classList.add('busy');
  const rw = row.getBoundingClientRect(), tray = row.closest('.tray'), tr = tray.getBoundingClientRect();
  const OUT = 170, GAP = 125, FLY = 640;

    if (prev && prev[k]) {
      const g = document.createElement('span'); g.className = 'ghost'; g.innerHTML = prev[k]; b.appendChild(g);
      g.animate([{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(.22)', opacity: 1, offset: .7 }, { transform: 'scale(0)', opacity: 0 }], { duration: OUT, easing: 'ease-in', fill: 'forwards' }).onfinish = () => g.remove();
    }
    // 2) le nouveau arrive de la droite en roulant, avec un halo doré
    const br = b.getBoundingClientRect(), dx = tr.right - br.left + 10, delay = OUT + n * GAP, h = br.height;
    const turns = -(1 + Math.round(dx / (h * 3.1))) * 360 - 90 * Math.floor(rnd() * 4);

      { transform: `translate(${dx}px,-${h * .08}px) rotate(${turns}deg)`, offset: 0 },
      { transform: `translate(${dx * .45}px,${h * .03}px) rotate(${turns * .4}deg)`, offset: .45 },
      { transform: `translate(${dx * .14}px,-${h * .1}px) rotate(${turns * .1}deg)`, offset: .72 },
      { transform: `translate(-${h * .1}px,0) rotate(8deg)`, offset: .9 },
      { transform: 'translate(0,0) rotate(0deg)', offset: 1 }
    ], { duration: FLY, delay, easing: 'cubic-bezier(.25,.6,.35,1)', fill: 'backwards' });
    sh.animate([{ transform: `translateX(${dx}px)`, opacity: .6 }, { transform: 'translateX(0)', opacity: 1 }], { duration: FLY, delay, easing: 'cubic-bezier(.25,.6,.35,1)', fill: 'backwards' });
    const glow = document.createElement('span'); glow.className = 'glow'; body.prepend(glow);
    glow.animate([{ opacity: 0, transform: 'scale(.85)' }, { opacity: 1, transform: 'scale(1)', offset: .12 }, { opacity: 1, transform: 'scale(1.05)', offset: .7 }, { opacity: 0, transform: 'scale(1.3)' }],
      { duration: FLY + 260, delay, fill: 'both' }).onfinish = () => glow.remove();

      if (el > delay && el - lastSp > 34) {
        lastSp = el; const r = body.getBoundingClientRect();
        if (r.left < tr.right) {
          const sp = document.createElement('i'); sp.className = 'spark';
          const x = r.right - tr.left - r.width * .1 + rnd() * r.width * .35, y = r.top - tr.top + r.height * (.15 + rnd() * .7);

  const just = V.last && Date.now() < justUntil ? V.last.seat + ':' + V.last.cat : '';
  const cell = (o, cat) => {
    const v = o.s.card[cat], isMe = o.i === net.me, cls = isMe ? 'me' : 'v', j = just === o.i + ':' + cat ? ' just' : '';
    if (v !== undefined) return `<span class="${cls}${j}">${v}${cat === 'cy' && o.s.card.yb ? `<small class="ytag">+${o.s.card.yb}</small>` : ''}</span>`;
    if (canPick && isMe) { const p = catScore(cat, V.dice); return `<span class="me pick${p ? '' : ' zero'}" data-cat="${cat}">${p}</span>`; }
    return `<span class="${cls} empty">·</span>`;
  };
  const head = `<div class="ghead" style="${tpl}"><span></span>${cols.map(o => `<span style="color:${o.i === net.me ? '#5fe8d8' : '#f2c14e'}">${esc(o.s.n)}</span>`).join('')}</div>`;
  const T = cols.map(o => totals(o.s.card));
  const left = head + UP.map((c, n) => `<div class="grow" style="${tpl}"><span class="ic" title="${esc(t(c))}">${upIcon(n + 1)}</span>${cols.map(o => cell(o, c)).join('')}</div>`).join('')
    + `<div class="grow bon" style="${tpl}"><span class="lbl2">BONUS<small>${t('bonusIf')}</small></span>${cols.map((o, x) => `<span class="${o.i === net.me ? 'me' : 'v'}">${T[x].bonus ? 35 : T[x].up ? `<small style="font-size:11px">${T[x].up}/63</small>` : 0}</span>`).join('')}</div>`
    + `<div class="gtot" style="${tpl}"><span>${t('upperS')}</span>${T.map(x => `<span>${x.up + x.bonus}</span>`).join('')}</div>`;
  const right = head + LOW.map(c => `<div class="grow" style="${tpl}"><span class="ic" title="${esc(t(c))}"><span class="badge2">${tagOf(c)}</span></span>${cols.map(o => cell(o, c)).join('')}</div>`).join('')
    + `<div class="gtot" style="${tpl}"><span>${t('lowerS')}</span>${T.map(x => `<span>${x.low}</span>`).join('')}</div>`;
  $('#grid').innerHTML = `<div class="gcol">${left}</div><div class="gcol">${right}</div>`;
  // couleurs des colonnes : toi en vert, les autres en or (comme l'en-tête)
}
setInterval(() => { const b = document.getElementById('tbar'); if (b && V && V.phase === 'play') b.style.transform = `scaleX(${Math.max(0, Math.min(1, (localDeadline - Date.now()) / TURN_MS))})`; }, 250);
$('#dice').addEventListener('click', e => {
  const b = e.target.closest('[data-die]'); if (!b || b.disabled || !V) return;
  const k = +b.dataset.die; localHeld[k] = !localHeld[k]; b.classList.toggle('held', localHeld[k]); P.sfx('click');
  send({ t: 'hold', i: k, v: localHeld[k] });
});
$('#bRoll').onclick = () => { if (!V || V.turn !== net.me || V.rolls >= 3) return; if (animating()) return; P.unlockAudio(); const rb = $('#bRoll'); rb.disabled = true; rb.classList.remove('shake'); void rb.offsetWidth; rb.classList.add('shake'); send({ t: 'roll', held: localHeld }); };
$('#versus').addEventListener('click', e => { const b = e.target.closest('[data-cmp]'); if (!b || +b.dataset.cmp === net.me) return; cmpPick = +b.dataset.cmp; P.sfx('click'); if (V) render(); });
$('#grid').addEventListener('click', e => {
  const c = e.target.closest('[data-cat]'); if (!c || !V || V.turn !== net.me || !V.rolls) return;
  const cat = c.dataset.cat; P.sfx('click'); document.querySelectorAll('#grid [data-cat]').forEach(x => x.removeAttribute('data-cat')); send({ t: 'score', c: cat });
});
document.addEventListener('keydown', e => {
  if (!V || V.turn !== net.me || document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); $('#bRoll').click(); }
  const n = +e.key; if (n >= 1 && n <= 5) { const b = document.querySelector(`[data-die="${n - 1}"]`); if (b && !b.disabled) b.click(); }
});
$('#bQuit').onclick = () => {
  P.sfx('click');
  P.quitMenu($('#bQuit'), () => {
  leaveNet(); S = null; V = null; show('home'); renderSoloSub();
  });
};

/* ---------- Fin ---------- */
let endKey = '';
function renderEnd() {
  show('end');
  const L = V.seats.map((s, i) => ({ s, i, tot: totals(s.card).total })).filter(o => !o.s.gone).sort((a, b) => b.tot - a.tot);
  const top = L.length ? L[0].tot : 0, win = L.filter(o => o.tot === top);
  $('#endTitle').textContent = net.solo ? t('soloEnd', { n: top }) + (V.newRecord ? ' ' + t('newRecord') : '') : win.length > 1 ? t('tie') : t('winner', { name: win[0] ? win[0].s.n : '?', n: top });
  $('#ranks').innerHTML = L.map((o, k) => `<div class="pl">${k < 3 ? ['🥇', '🥈', '🥉'][k] : '#' + (k + 1)} ${dieSVG(6, o.s.skin)}<span>${esc(o.s.n)}</span><b>${o.tot}</b></div>`).join('');
  const guest = net.role !== 'host';
  $('#bAgain').hidden = guest; $('#endWait').textContent = guest ? t('hostAgain') : ''; $('#bMenu').hidden = !net.relay;
  const k = net.gameNo + ':' + net.sess;
  if (endKey !== k) { endKey = k; const won = (win.some(o => o.i === net.me) && !net.solo) || V.newRecord; P.sfx(won ? 'win' : 'lose'); if (won) P.confetti($('#confetti')); }
}
$('#bAgain').onclick = () => { P.sfx('click'); P.stopConfetti(); if (net.solo) { net.gameNo++; show('game'); net.roster[0].skin = mySkin; newGame(); } else if (net.role === 'host') $('#bStart').click(); };
$('#bHome').onclick = () => { P.sfx('click'); P.stopConfetti(); clearTimeout(window.__endT); leaveNet(); S = null; V = null; show('home'); renderSoloSub(); };
$('#bMenu').onclick = () => {
  P.sfx('click'); P.stopConfetti();
  if (net.relay) { S = null; V = null; show('online'); $('#onForm').hidden = true; $('#onWait').hidden = false; if (net.role === 'host') { net.roster = net.roster.filter(r => !r.gone); broadcastLobby(); } else renderLobby(); return; }
  show('home');
};
function renderSoloSub() { const r = +P.get('ym-best', '0'); $('#soloSub').textContent = r ? t('record', { n: r }) : t('soloSub'); }

/* ---------- Chat de la partie ---------- */
const CHAT = { list: [], unread: 0 };
const wideChat = () => matchMedia('(min-width:1150px)').matches && document.body.classList.contains('netlive');
const chatVisible = () => !$('#rc').hidden || wideChat();
function chatIn(s, txt, l) {
  txt = String(txt || '').replace(/\s+/g, ' ').trim().slice(0, 160); if (!txt) return;
  const r = net.roster[s] || {};
  const m = { s, n: r.name || '?', txt, l: ['fr', 'en', 'cs'].includes(l) ? l : 'fr' };
  net.roster.forEach(o => { if (o.conn && o.conn.open && !o.gone) o.conn.send({ t: 'chat', m }); });
  chatAdd(m);
}
function chatSys(txt) { const m = { sys: true, txt }; net.roster.forEach(o => { if (o.conn && o.conn.open && !o.gone) o.conn.send({ t: 'chat', m }); }); chatAdd(m); }
function chatAdd(m) {
  if (!m || typeof m.txt !== 'string') return;
  CHAT.list.push({ s: m.s | 0, n: String(m.n || '?').slice(0, 14), txt: m.txt.slice(0, 160), l: m.l, sys: !!m.sys });
  if (CHAT.list.length > 80) CHAT.list.shift();
  if (!m.sys && m.s !== net.me) { if (!chatVisible()) { CHAT.unread++; toast(`💬 <b>${esc(String(m.n || '?'))}</b> : ${esc(String(m.txt).slice(0, 60))}`); } P.sfx('chat'); }
  renderChat();
}
function renderChat() {
  const L = $('#rcList');
  L.innerHTML = CHAT.list.length ? CHAT.list.map(m => m.sys ? `<div class="rc-msg sys">${esc(m.txt)}</div>` : `<div class="rc-msg${m.s === net.me ? ' me' : ''}">${avatar(m.s)}<div class="bub"><b style="color:${COLORS[m.s % 10]}">${esc(m.n)}</b>${trHtml(m.txt, m.l, m.s === net.me)}</div></div>`).join('') : `<p class="rc-empty">${t('chatEmpty')}</p>`;
  L.scrollTop = L.scrollHeight;
  if (chatVisible()) CHAT.unread = 0;
  document.querySelectorAll('.badge').forEach(b => { b.textContent = CHAT.unread ? CHAT.unread : ''; });
  const last = [...CHAT.list].reverse().find(m => !m.sys);
  const bar = last ? `<b style="color:${COLORS[last.s % 10]}">${esc(last.n)}</b>${trHtml(last.txt, last.l, last.s === net.me)}` : `<i>${t('chatInvite')}</i>`;
  document.querySelectorAll('.chatbar .cb-txt').forEach(el => { el.innerHTML = bar; });
  document.querySelectorAll('#chatBar, #bChat').forEach(el => { el.style.display = net.solo ? 'none' : ''; });
}
function toggleChat(open) { $('#rc').hidden = !open; if (open) { CHAT.unread = 0; renderChat(); setTimeout(() => $('#rcIn').focus(), 50); } }
$('#bChat').onclick = () => { P.sfx('click'); toggleChat($('#rc').hidden); };
$('#chatBar').onclick = () => { P.sfx('click'); toggleChat(true); };
$('#bChatL').onclick = () => { P.sfx('click'); toggleChat(true); };
$('#rcClose').onclick = () => { P.sfx('click'); toggleChat(false); };
$('#rcForm').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('#rcIn').value.replace(/\s+/g, ' ').trim().slice(0, 160); if (!v) return;
  $('#rcIn').value = '';
  if (net.role === 'host') chatIn(0, v, P.lang()); else if (net.conn && net.conn.open) net.conn.send({ t: 'chat', txt: v, l: P.lang() });
});
window.addEventListener('resize', renderChat);
const gcHome = window.GChat ? GChat.mount($('#gchatHome'), { db: P.DB_URL, lang: P.lang, name: () => P.hasName() ? P.name() : '', needName: () => P.needName($('#inName')) }) : null;

/* ---------- Groupe d'amis ---------- */
function joinFromParty(c) { P.stopConfetti(); S = null; V = null; pendingJoin = c; if (!P.hasName()) { show('home'); nameOk(); return; } $('#mOnline').click(); }
if (window.Party) { Party.busy = () => !$('#game').hidden && !!V && V.phase !== 'end' && !net.solo; Party.onJoinHere = (g, c) => { joinFromParty(c); return true; }; }

/* ---------- Démarrage ---------- */
P.onLang(() => {
  if (net.role === 'guest' && net.conn && net.conn.open) net.conn.send({ t: 'lang', l: P.lang() });
  renderSnd(); renderMus(); renderChat(); renderSkins(); renderSoloSub(); if (gcHome) gcHome.refresh();
  if (!$('#onWait').hidden) renderLobby(); if (V) render();
});
P.applyStatic(); renderSnd(); renderMus(); renderChat(); renderSkins(); renderSoloSub();
{ const jc = window.Party && Party.takeJoin(); if (jc) joinFromParty(jc); }
window.__ym = { dsDie, dsLoad,  get S() { return S; }, get V() { return V; }, net, catScore, totals };
// Skins : chargés au démarrage, puis mis à jour en direct
P.skinLive(() => { try { if (V && !$('#game').hidden) render(); else if (!$('#onWait').hidden) renderLobby(); if (typeof renderChat === 'function') renderChat(); } catch (e) {} });
})();
</script>
</body>

<script>try{if(localStorage.getItem('df-ui')!=='day')document.documentElement.dataset.ui='night'}catch(e){document.documentElement.dataset.ui='night'}</script>
<style>
/* Layout : écrans plein cadre (accueil, en ligne, partie, résultat).
   En partie : barre du haut, puis les deux images empilées (portrait) ou côte à côte (paysage).
   Identité propre au jeu : ciel d'été, papier crème, contours bleu nuit, soleil et feuillage. */
:root{
  --sky1:#7fd4ff;--sky2:#d8f4ff;--ink:#1d2448;--paper:#fffaf0;--paper-2:#ffeec8;--text:#1d2448;--muted:#5a6688;
  --sun:#ffcf3f;--coral:#ff6b6b;--leaf:#5ac85a;--blue:#4aa8ff;--gold:#ffcf3f;--blood:#ff5a5a;
  --f-ui:"Nunito","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --f-text:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;color:var(--text);font-family:var(--f-ui);font-weight:600;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  background:
    radial-gradient(ellipse 120px 44px at 12% 14%,#fff 60%,transparent 62%),radial-gradient(ellipse 90px 34px at 18% 11%,#fff 60%,transparent 62%),
    radial-gradient(ellipse 140px 48px at 86% 22%,#fff 60%,transparent 62%),radial-gradient(ellipse 100px 36px at 80% 19%,#fff 60%,transparent 62%),
    linear-gradient(180deg,var(--sky1) 0,var(--sky2) 100%) fixed;background-color:var(--sky2)}
[hidden]{display:none!important}
/* ---------- Décor de fond illustré (collines, village, arbres) ---------- */
#land{position:fixed;left:0;right:0;bottom:0;height:min(46vh,430px);z-index:0;pointer-events:none}
#land svg{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:100%;width:max(100%,820px)}
#land .h1{fill:#a7e48a}#land .h2{fill:#7fd062}#land .h3{fill:#5cb84a}#land .h4{fill:#4aa23e}
#land .tr{fill:#3f9a3a}#land .tr2{fill:#2f8030}#land .trunk{fill:#9a6236}
#land .wall{fill:#fff1d6}#land .wall2{fill:#ffe0b0}#land .roof{fill:#ff7a5c}#land .roof2{fill:#5aa8ff}#land .win{fill:#9ad8ff}
#land .path{fill:#f3d9a0}#land .fl1{fill:#ff6b9a}#land .fl2{fill:#ffd23f}#land .fl3{fill:#fff}
#land .o{stroke:var(--ink);stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
#land .glow{display:none}
html[data-ui=night] #land .h1{fill:#2c5a48}html[data-ui=night] #land .h2{fill:#24503c}html[data-ui=night] #land .h3{fill:#1d4432}html[data-ui=night] #land .h4{fill:#173a2a}
html[data-ui=night] #land .tr{fill:#348a52}html[data-ui=night] #land .tr2{fill:#2b7546}html[data-ui=night] #land .trunk{fill:#5a3c26}
html[data-ui=night] #land .wall{fill:#6a6490}html[data-ui=night] #land .wall2{fill:#5c5680}html[data-ui=night] #land .roof{fill:#8a4a5a}html[data-ui=night] #land .roof2{fill:#3a5a90}
html[data-ui=night] #land .win{fill:#ffd36a}html[data-ui=night] #land .glow{display:inline}
html[data-ui=night] #land .path{fill:#6a6450}html[data-ui=night] #land .fl1{fill:#a85a7a}html[data-ui=night] #land .fl2{fill:#b8a050}html[data-ui=night] #land .fl3{fill:#9aa0c0}
#land .ff circle{fill:#fff6a0;animation:ff 3s ease-in-out infinite}
#land .ff{display:none}html[data-ui=night] #land .ff{display:inline}
@keyframes ff{0%,100%{opacity:.15;transform:translate(0,0)}50%{opacity:1;transform:translate(6px,-10px)}}
body.ingame #land{opacity:.55}
@media (prefers-reduced-motion:reduce){#land .ff circle{animation:none}}

.frame{position:relative;background:linear-gradient(180deg,#fff 0,var(--paper) 40%,var(--paper-2) 100%);border:4px solid var(--ink);border-radius:24px;box-shadow:0 7px 0 var(--ink)}
.btn{position:relative;font-family:var(--f-ui);font-weight:700;font-size:18px;color:var(--ink);cursor:pointer;line-height:1.05;text-decoration:none;
  background:linear-gradient(180deg,#e8f6ff 0,#a8dcff 50%,#7cc4f4 100%);border:4px solid var(--ink);border-radius:16px;padding:9px 14px 8px;
  box-shadow:0 5px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.7);transition:transform .07s,box-shadow .07s,filter .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.7)}
@media (hover:hover){.btn:hover{filter:brightness(1.05)}}
.btn:focus-visible{outline:4px solid var(--coral);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:default}
.btn.orange{background:linear-gradient(180deg,#fff6c8 0,var(--sun) 50%,#f5a623 100%)}
.btn.green{background:linear-gradient(180deg,#e2ffd2 0,#8ee06a 50%,#4fb83a 100%)}
.btn.icon{padding:7px;border-radius:14px;flex:none}
.btn.icon svg{width:24px;height:24px}
.btn.wide{width:100%;padding:13px 14px 11px}
.field{font-family:var(--f-ui);font-weight:600;font-size:19px;color:var(--ink);background:#fff;border:4px solid var(--ink);border-radius:14px;padding:9px 12px 8px;width:100%;min-width:0;outline:none;-webkit-user-select:text;user-select:text;box-shadow:inset 0 3px 0 rgba(29,36,72,.12)}
.field:focus{border-color:var(--blue)}
.field.code{text-transform:uppercase;letter-spacing:.3em;text-align:center}
.nseg{display:flex;gap:6px}
.nseg .btn{flex:1;padding:8px 4px 7px;font-size:15px;background:#fff;box-shadow:0 3px 0 var(--ink);flex-direction:column;gap:2px}
.nseg .btn small{font-size:11px;color:var(--muted);font-weight:600}
.nseg .btn[aria-pressed="true"]{background:linear-gradient(180deg,#fff6c8,var(--sun) 60%,#f5a623)}
label,.lbl{font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.sep::before,.sep::after{content:"";flex:1;height:3px;border-radius:2px;background:rgba(29,36,72,.25)}
.err{margin:0;color:#d63a3a;font-size:14px;font-family:var(--f-text);min-height:1em}

/* ---------- Écrans ---------- */
.screen{position:fixed;inset:0;overflow-y:auto;display:flex;padding:16px;padding-block:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 16px);animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}}
.col{width:100%;max-width:440px;margin:auto;display:flex;flex-direction:column;gap:14px;align-items:stretch}
.topnav{display:flex;justify-content:space-between;align-items:center}
.logo{text-align:center;display:flex;flex-direction:column;align-items:center;animation:drop .7s cubic-bezier(.2,1.5,.4,1) both}
@keyframes drop{from{opacity:0;transform:translateY(-40px) scale(.8)}}
.logo-art{width:170px;height:118px;filter:drop-shadow(0 5px 0 var(--ink));animation:wobble 3.5s ease-in-out infinite}
@keyframes wobble{50%{transform:rotate(-3deg) translateY(-4px)}}
.logo-t{font-family:var(--f-ui);font-weight:700;font-size:clamp(44px,13vw,66px);line-height:.95;margin-top:-6px;color:#ffb83a;
  -webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);letter-spacing:.01em}
.logo-t span{color:var(--coral)}
.tag{font-size:17px;color:var(--ink);margin-top:6px;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:3px 14px 2px;box-shadow:0 3px 0 var(--ink);transform:rotate(-2deg)}
.panel{padding:16px;display:flex;flex-direction:column;gap:11px}
.mode{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px 10px;border-radius:20px;text-align:left;justify-content:flex-start}
.mode svg{width:44px;height:44px;flex:none}
.mode span{display:flex;flex-direction:column;gap:2px;min-width:0}
.mode b{font-weight:700;font-size:21px}
.mode small{font-size:13px;font-weight:600;color:rgba(29,36,72,.75)}
.best{font-family:var(--f-text);font-size:13px;color:var(--muted);text-align:center;margin:0}
.bigcode{font-size:50px;font-weight:700;letter-spacing:.2em;color:var(--coral);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);text-align:center;padding-left:.2em}
.roster{display:flex;flex-direction:column;gap:5px}
.roster div{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:7px 12px;font-size:17px}
.roster i{width:16px;height:16px;border-radius:50%;border:3px solid var(--ink);flex:none}
.roster small{margin-left:auto;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.wait-txt{margin:0;font-family:var(--f-text);font-size:14px;color:var(--muted);text-align:center;line-height:1.45}
.row{display:flex;gap:8px;align-items:center}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

/* ---------- Partie ---------- */
#game{position:fixed;inset:0;display:flex;flex-direction:column;padding:10px 12px;padding-block:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-bottom,0px) + 10px);gap:10px}
.hud{display:flex;align-items:center;gap:8px;padding:7px 8px}
.chips{flex:1;display:flex;gap:6px;min-width:0;overflow:hidden}
.chip{display:flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:3px 10px 2px 3px;font-size:15px;min-width:0}
.chip i{width:24px;height:24px;border-radius:50%;border:3px solid var(--ink);flex:none;display:grid;place-items:center;font-style:normal;font-size:13px;color:var(--ink)}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:9ch}
.chip.solo{background:none;border:0;padding:0;gap:4px}
.pips{display:flex;gap:4px}
.pips i{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--ink)}
.pips i.on{background:var(--leaf);animation:pop .3s}
.pips.many{gap:3px}.pips.many i{width:15px;height:15px;border-width:2.5px}
@media (max-width:370px){.pips.many{gap:2px}.pips.many i{width:12px;height:12px;border-width:2px}}
@keyframes pop{from{transform:scale(.3)}}
.timer{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;min-width:58px;text-align:center}
.timer.pen{color:var(--blood);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#bHint{background:linear-gradient(180deg,#fff6c8 0,var(--sun) 50%,#f5a623 100%)}
#bHint b{position:absolute;top:-9px;right:-9px;min-width:22px;height:22px;border-radius:11px;background:var(--coral);color:#fff;font-size:12px;display:grid;place-items:center;border:3px solid var(--ink)}
.strip{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin-top:-2px}
.strip .chip{padding:2px 8px 1px 2px;font-size:13px;gap:4px}
.strip .chip i{width:20px;height:20px;font-size:11px;border-width:2.5px}
.strip .chip span{max-width:7ch}
.strip .chip.me{box-shadow:0 0 0 3px var(--sun)}
.roster.many{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.roster.many div{font-size:14px;padding:5px 8px;gap:6px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.roster.many small{display:none}
.scores.many{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.scores.many div{font-size:15px;padding:5px 9px;gap:7px;min-width:0}
.scores.many div:first-child{grid-column:1/-1}
.count{position:fixed;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;pointer-events:none}
.count-n{font-family:var(--f-ui);font-weight:700;font-size:min(34vw,200px);line-height:1;color:var(--sun);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 10px 0 var(--ink)}
.count-n.pop{animation:cpop .9s cubic-bezier(.2,1.6,.4,1) both}
@keyframes cpop{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.1);opacity:1}80%{transform:scale(1);opacity:1}100%{transform:scale(.9);opacity:.2}}
.board.veil .pic canvas,html[data-ui=night] .board.veil .pic canvas.art{filter:blur(16px) brightness(.75)!important}
.board .pic canvas{transition:filter .4s}
.board .pic canvas{transition:filter .35s}
.board{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:12px}
.board.stack{flex-direction:column}
.visSub{font-size:12.5px;line-height:1.3;opacity:.75;margin:4px 2px 6px}
.pic{position:relative;border:5px solid var(--ink);border-radius:18px;overflow:hidden;box-shadow:0 7px 0 var(--ink);flex:none;touch-action:none;cursor:crosshair;background:#fff}
.pic canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.pic .tagA{position:absolute;left:8px;top:6px;z-index:2;font-size:14px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:10px;padding:1px 8px 0;pointer-events:none}
.pic.lock::after{content:"";position:absolute;inset:0;background:rgba(255,90,90,.28);animation:fadeIn .15s}
.status{margin:0;padding:0 50px;text-align:center;font-size:14px;color:var(--ink);font-family:var(--f-text);min-height:1.2em;font-weight:500}
#toast{position:fixed;z-index:20;left:50%;top:22%;transform:translate(-50%,-50%) scale(.8);background:var(--coral);color:#fff;border:4px solid var(--ink);border-radius:18px;padding:9px 16px 8px;font-size:17px;box-shadow:0 5px 0 var(--ink);opacity:0;pointer-events:none;transition:opacity .2s,transform .25s cubic-bezier(.2,1.6,.4,1);max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast.good{background:var(--leaf);color:var(--ink)}
#toast.info{background:#fff;color:var(--ink)}

/* ---------- Thème Nuit : moins de blanc, plus doux pour les yeux ---------- */
html[data-ui=night]{--sky1:#10142e;--sky2:#232a56;--paper:#272d60;--paper-2:#1f244c;--text:#eef0ff;--muted:#a8b0de;--ink:#0d1130;color-scheme:dark}
html[data-ui=night] body{background:
    radial-gradient(1.5px 1.5px at 20% 12%,#fff 50%,transparent 55%),radial-gradient(1.5px 1.5px at 70% 8%,#fff 50%,transparent 55%),
    radial-gradient(2px 2px at 45% 20%,#ffe9a8 50%,transparent 55%),radial-gradient(1.5px 1.5px at 88% 30%,#fff 50%,transparent 55%),radial-gradient(1.5px 1.5px at 8% 34%,#fff 50%,transparent 55%),
    radial-gradient(circle 34px at 84% 13%,#fff3c4 0,#ffe08a 60%,transparent 63%),
    linear-gradient(180deg,var(--sky1) 0,var(--sky2) 100%) fixed;background-color:var(--sky2)}
html[data-ui=night] .frame{background:linear-gradient(180deg,#3a4282 0,var(--paper) 40%,var(--paper-2) 100%);color:var(--text)}
html[data-ui=night] .btn{background:linear-gradient(180deg,#8fb0e0 0,#5c86cc 50%,#456cb4 100%);box-shadow:0 5px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.35)}
html[data-ui=night] .btn.orange{background:linear-gradient(180deg,#f0d890 0,#e0a838 50%,#c8821c 100%)}
html[data-ui=night] .btn.green{background:linear-gradient(180deg,#b0dc98 0,#5fb048 50%,#3a8a2c 100%)}
html[data-ui=night] .nseg .btn{background:#262c5c;color:var(--text);box-shadow:0 3px 0 var(--ink)}
html[data-ui=night] .nseg .btn small{color:var(--muted)}
html[data-ui=night] .nseg .btn[aria-pressed="true"]{background:linear-gradient(180deg,#ffe9a0,#f5b93a 60%,#e0901c);color:#1d2448}
html[data-ui=night] .nseg .btn[aria-pressed="true"] small{color:#4a4020}
html[data-ui=night] .field{background:#1b2048;color:var(--text);box-shadow:inset 0 3px 0 rgba(0,0,0,.25)}
html[data-ui=night] .field::placeholder{color:#7f88bf}
html[data-ui=night] .tag,html[data-ui=night] .pic .tagA,html[data-ui=night] #toast.info{background:#262c5c;color:var(--text)}
html[data-ui=night] .roster div,html[data-ui=night] .scores div,html[data-ui=night] .chip{background:#262c5c;color:var(--text)}
html[data-ui=night] .chip.solo{background:none}
html[data-ui=night] .pips i{background:#1b2048}
html[data-ui=night] .pips i.on{background:var(--leaf)}
html[data-ui=night] .scores div:first-child{background:linear-gradient(90deg,#6a5520,#262c5c 70%)}
html[data-ui=night] .status{color:#dfe3ff}
html[data-ui=night] .sep::before,html[data-ui=night] .sep::after{background:rgba(255,255,255,.18)}
html[data-ui=night] .pic{background:#1b2048}
html[data-ui=night] .pic canvas.art{filter:brightness(.88) saturate(.92)}
html[data-ui=night] #result{background:radial-gradient(ellipse at 50% 40%,rgba(40,46,100,.5),rgba(15,18,48,.9) 75%)}
html[data-ui=night] .mode small{color:rgba(29,36,72,.8)}
html[data-ui=night] .err{color:#ff8a8a}

/* ---------- Résultat ---------- */
#result{z-index:10;background:radial-gradient(ellipse at 50% 40%,rgba(255,250,240,.35),rgba(127,212,255,.85) 75%)}
#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:11;pointer-events:none}
.stars{display:flex;gap:6px;justify-content:center;align-items:flex-end}
.stars i{width:46px;height:46px;background:#c8d4e8;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);filter:drop-shadow(0 4px 0 var(--ink));animation:starPop .5s cubic-bezier(.2,1.8,.4,1) both}
.stars i:nth-child(2){width:60px;height:60px;animation-delay:.15s}.stars i:nth-child(3){animation-delay:.3s}
.stars i.on{background:var(--sun)}
@keyframes starPop{from{transform:scale(0) rotate(-90deg)}}
.banner{align-self:center;transform:rotate(-2deg)}
.banner h1{margin:0;font-family:var(--f-ui);font-weight:700;font-size:clamp(32px,10vw,50px);line-height:1;color:var(--ink);padding:8px 26px 6px;border:4px solid var(--ink);border-radius:18px;background:linear-gradient(180deg,#fff6c8,var(--sun) 60%,#f5a623);box-shadow:0 6px 0 var(--ink);white-space:nowrap}
.banner.lose h1{color:#fff;background:linear-gradient(180deg,#ff9a9a,var(--coral) 60%,#e04a4a)}
.res-lines{font-family:var(--f-text);font-size:16px;line-height:1.6;text-align:center;margin:0;color:var(--ink);font-weight:500}
.res-lines b{font-family:var(--f-ui);font-weight:700;color:#e0701a;font-size:19px}
.scores{display:flex;flex-direction:column;gap:5px}
.scores div{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:7px 12px;font-size:18px}
.scores div:first-child{background:linear-gradient(90deg,#fff1b8,#fff 70%)}
.scores i{width:16px;height:16px;border-radius:50%;border:3px solid var(--ink)}
.scores b{margin-left:auto}
.sheet{position:fixed;z-index:15;left:50%;top:50%;transform:translate(-50%,-50%);width:min(360px,calc(100% - 32px));padding:14px;display:flex;flex-direction:column;gap:10px;animation:fadeIn .2s}
.sheet-head{display:flex;justify-content:space-between;align-items:center;font-size:22px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>

  <!-- maisons du fond -->
  <g transform="translate(700 118)"><rect class="wall o" x="0" y="20" width="58" height="44"/><path class="roof o" d="M-8 24 L29 -8 L66 24z"/><rect class="win o" x="10" y="32" width="14" height="14" rx="2"/><rect class="win o" x="34" y="32" width="14" height="14" rx="2"/><circle class="glow" cx="29" cy="40" r="44" fill="url(#lg)"/></g>
  <g transform="translate(790 108)"><rect class="wall2 o" x="0" y="20" width="46" height="54"/><path class="roof2 o" d="M-7 24 L23 -10 L53 24z"/><rect class="win o" x="15" y="34" width="16" height="16" rx="2"/><circle class="glow" cx="23" cy="42" r="40" fill="url(#lg)"/></g>
  <path class="h2 o" d="M-20 270 Q160 190 340 240 T700 230 T1000 210 T1220 230 V440 H-20z"/>

function drawLens(p) {
  const c = p.querySelector('.fx'), art = p.querySelector('.art'), g = c.getContext('2d'), L = G.lens, z = 2.2;
  const W2 = c.width, H2 = c.height, cx = L.x / Scenes.W * W2, cy = L.y / Scenes.H * H2, R = Math.min(W2, H2) * 0.27;
  const lx = Math.max(R + 4, Math.min(W2 - R - 4, cx));
  let ly = cy - R * 1.2; if (ly - R < 4) ly = cy + R * 1.2; ly = Math.max(R + 4, Math.min(H2 - R - 4, ly));
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
  g.beginPath(); g.arc(lx, ly, R, 0, Math.PI * 2); g.save(); g.clip();
  g.fillStyle = '#fff'; g.fillRect(lx - R, ly - R, 2 * R, 2 * R);
  // zone source gardée dans l'image (pas de blanc près des bords)
  const r0 = R / z, scx = Math.max(r0, Math.min(W2 - r0, cx)), scy = Math.max(r0, Math.min(H2 - r0, cy));
  g.drawImage(art, scx - r0, scy - r0, 2 * r0, 2 * r0, lx - R, ly - R, 2 * R, 2 * R);
  const sx = z * W2 / Scenes.W, sy = z * H2 / Scenes.H;
  g.setTransform(sx, 0, 0, sy, lx - scx / W2 * Scenes.W * sx, ly - scy / H2 * Scenes.H * sy);
  G.scene.diffs.forEach((d, i) => { if (G.found[i] < 0) return; g.beginPath(); g.arc(d.x, d.y, d.r, 0, Math.PI * 2); g.lineWidth = 4; g.strokeStyle = '#0c0816'; g.stroke(); g.lineWidth = 2.2; g.strokeStyle = G.names.length > 1 ? COLORS[G.found[i]] : '#86f2a0'; g.stroke(); });
  g.restore();
  const u = W2 / 300;
  g.beginPath(); g.arc(lx, ly, R, 0, Math.PI * 2); g.lineWidth = 7 * u; g.strokeStyle = '#1d2448'; g.stroke(); g.lineWidth = 3 * u; g.strokeStyle = '#ffd23f'; g.stroke();
  const px = lx + (cx - scx) * z, py = ly + (cy - scy) * z; // repère : position exacte du doigt
  g.lineWidth = 2 * u; g.strokeStyle = 'rgba(29,36,72,.6)'; g.beginPath(); g.moveTo(px - 8 * u, py); g.lineTo(px + 8 * u, py); g.moveTo(px, py - 8 * u); g.lineTo(px, py + 8 * u); g.stroke();
  g.restore();
}
// Calque d'effets : cercles trouvés, croix d'erreur, indices
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!$('#game').hidden && G.scene) {
    if (!G.over) $('#timer').textContent = fmt(elapsed());
    for (const p of pics) {
      const c = p.querySelector('.fx'), g = c.getContext('2d');
      g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, c.width, c.height);
      g.setTransform(c.width / Scenes.W, 0, 0, c.height / Scenes.H, 0, 0);
      G.scene.diffs.forEach((d, i) => {
        if (G.found[i] < 0) return;
        const fx = G.fx.find(f => f.type === 'ring' && f.i === i), k = fx ? Math.min(1, fx.t / 0.35) : 1;
        const pop = 1 + Math.sin(k * Math.PI) * 0.25;
        g.beginPath(); g.arc(d.x, d.y, d.r * pop, 0, Math.PI * 2);
        g.lineWidth = G.vis ? 14 : 9; g.strokeStyle = '#0c0816'; g.stroke();
        g.lineWidth = G.vis ? 8 : 5; g.strokeStyle = G.names.length > 1 ? COLORS[G.found[i]] : '#86f2a0'; g.stroke();
      });
      for (const f of G.fx) {
        if (f.type === 'x' && f.t < 0.7) {
          const a = 1 - f.t / 0.7, s = 14;
          g.globalAlpha = a; g.lineCap = 'round';
          for (const [w, col] of [[10, '#0c0816'], [5, '#e8394d']]) { g.lineWidth = w; g.strokeStyle = col; g.beginPath(); g.moveTo(f.x - s, f.y - s); g.lineTo(f.x + s, f.y + s); g.moveTo(f.x + s, f.y - s); g.lineTo(f.x - s, f.y + s); g.stroke(); }
          g.globalAlpha = 1;
        }
        if (f.type === 'hint' && f.t < 2.2) {
          const d = G.scene.diffs[f.i], pulse = 1.6 - (f.t % 0.55) / 0.55 * 0.6;
          g.globalAlpha = Math.min(1, (2.2 - f.t) * 2);
          g.beginPath(); g.arc(d.x, d.y, (d.r + 30) * pulse, 0, Math.PI * 2); g.lineWidth = 6; g.strokeStyle = '#ffcf3f'; g.setLineDash([10, 8]); g.stroke(); g.setLineDash([]);
          g.globalAlpha = 1;
        }
        if (f.type === 'pend' && G.found[f.i] < 0 && f.t < 3) {
          const d = G.scene.diffs[f.i];
          g.beginPath(); g.arc(d.x, d.y, d.r, f.t * 6, f.t * 6 + 4); g.lineWidth = 5; g.strokeStyle = COLORS[G.me]; g.stroke();
        }
      }
    }
    if (G.lens) for (const p of pics) drawLens(p);
    G.fx.forEach(f => { f.t += dt; });
    G.fx = G.fx.filter(f => f.t < 3);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- Fin de partie ---------- */
function scoresOf(w) {
  return G.names.map((nm, s) => ({ s, nm, n: countOf(s) }))
    .sort((a, b) => (b.s === w) - (a.s === w) || b.n - a.n);
}
function finish(forcedWinner) {
  if (G.over) return;
  G.over = true; clearTimeout(G.botT);
  const w = forcedWinner ?? scoresOf()[0].s;
  if (G.mode === 'host') broadcast({ t: 'end', w, counts: G.names.map((_, s) => countOf(s)) });
  showResult(w);
}
let matchSeq = 0;
function showResult(w) {
  const time = elapsed(), solo = G.names.length === 1, win = solo || w === G.me;
  setTimeout(() => {
    show('result');
    $('#banner').classList.toggle('lose', !win);
    let lines = '';
    if (solo) {
      const target = [45, 70, 100][G.level];
      const stars = time <= target ? 3 : time <= target * 1.6 ? 2 : 1;
      [...$('#stars').children].forEach((s, i) => s.classList.toggle('on', i < stars));
      $('#stars').innerHTML = $('#stars').innerHTML; // relance l'animation
      const key = bestKey(G.level), best = +P.get(key, '0');
      const rec = !best || time < best; if (rec) P.set(key, time.toFixed(1));
      $('#resTitle').textContent = t('youWin');
      lines = t('timeLine', { time: fmt(time) }) + '<br>' + t('missLine', { n: G.miss }) + (rec ? `<br><b>${t('newBest')}</b>` : '');
      $('#scores').innerHTML = '';
    } else {
      [...$('#stars').children].forEach((s, i) => s.classList.toggle('on', win && i < 3));
      $('#resTitle').textContent = win ? t('youWin') : t('winner', { name: G.names[w] });
      $('#scores').classList.toggle('many', G.names.length > 4); $('#scores').innerHTML = scoresOf(w).map(r => `<div><i style="background:${COLORS[r.s]}"></i>${esc(r.nm)}<b>${r.n}</b></div>`).join('');
      lines = t('timeLine', { time: fmt(time) });
      // classement commun de la plateforme
      const id = G.mode === 'bot' ? 'dfbot-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6) : `df${net.code}${net.sess}${net.gameNo}`;
      P.pushMatch({ id, t: Date.now(), p: G.names.slice(), w, b: G.bots.slice(), g: 'diff' });
    }
    $('#resLines').innerHTML = lines;
    const guest = G.mode === 'guest';
    $('#bNext').disabled = guest;
    $('#bNext').textContent = guest ? t('hostAgain') : solo ? t('nextLevel') : t('again');
    P.sfx(win ? 'win' : 'lose');
    if (win) P.confetti($('#confetti'));
  }, 700);
}
$('#bNext').onclick = () => {
  P.sfx('click');
  if (G.mode === 'host') return hostStart();
  if (G.mode === 'guest') return;
  startGame(Scenes.seedAfter(G.seed), G.level, G.names, G.bots, 0, G.mode, vis);
};
$('#bMenu').onclick = () => { P.sfx('click'); leaveNet(); P.stopConfetti(); show('home'); renderLvl(); };
$('#bQuit').onclick = () => { P.sfx('click'); P.quitMenu($('#bQuit'), () => { clearTimeout(G.botT); clearTimeout(G.cdT); clearInterval(G.cdI); $('#count').hidden = true; $('#board').classList.remove('veil'); G.over = true; leaveNet(); show('home'); renderLvl(); }); };

/* ---------- Modes locaux ---------- */
$('#mSolo').onclick = () => { P.unlockAudio(); if (!nameOk()) return; P.sfx('click'); startGame(Scenes.seedAfter(lastSeed), level, [myName()], [false], 0, 'solo'); };
$('#mBot').onclick = () => { P.unlockAudio(); if (!nameOk()) return; P.sfx('click'); startGame(Scenes.seedAfter(lastSeed), level, [myName(), 'Oscar'], [false, true], 0, 'bot'); };

/* ---------- En ligne (relais par la base, salle « df_CODE ») ---------- */
const net = { relay: null, conn: null, roster: [], code: '', sess: '', gameNo: 0, role: '' };
function leaveNet() {
  const r = net.relay; net.relay = null; net.conn = null; net.roster = []; net.role = '';
  try { r && r.destroy(); } catch (e) {}
}
window.addEventListener('pagehide', leaveNet);
document.addEventListener('visibilitychange', () => { if (!document.hidden && net.relay) net.relay.wake(); });
const sendHost = m => { if (net.conn && net.conn.open) net.conn.send(m); };
const broadcast = (m, except) => net.roster.forEach(r => { if (r.conn && r.conn !== except && r.conn.open) r.conn.send(m); });
let pendingJoin = null;
$('#mOnline').onclick = () => { P.unlockAudio(); if (!nameOk()) return; P.sfx('click'); myName(); show('online'); $('#onForm').hidden = false; $('#onWait').hidden = true; $('#onErr').textContent = ''; if (pendingJoin) { $('#inCode').value = pendingJoin; pendingJoin = null; $('#bJoin').click(); } };
// Groupe d'amis : rejoindre la partie lancée par un ami sans taper de code
function joinFromParty(c) { clearTimeout(G.botT); G.over = true; pendingJoin = c; if (!P.hasName()) { show('home'); nameOk(); return; } $('#mOnline').click(); }
if (window.Party) { Party.busy = () => !$('#game').hidden && !G.over; Party.onJoinHere = (g, c) => { joinFromParty(c); return true; }; }
$('#onBack').onclick = () => { P.sfx('click'); leaveNet(); show('home'); };
$('#bLeave').onclick = () => { P.sfx('click'); leaveNet(); $('#onForm').hidden = false; $('#onWait').hidden = true; };
function renderRoster() {
  const names = net.role === 'host' ? net.roster.map(r => r.name) : (net.names || []);
  $('#roster').classList.toggle('many', names.length > 4); $('#roster').innerHTML = names.map((n, i) => `<div><i style="background:${COLORS[i]}"></i>${esc(n)}<small>${i ? t('connected') : t('host')}</small></div>`).join('');
  const host = net.role === 'host';
  $('#codeBox').hidden = !host; $('#hostOpts').hidden = !host; $('#bStart').hidden = !host;
  $('#bStart').disabled = names.length < 2;
  $('#waitTxt').innerHTML = host ? (names.length < 2 ? t('waitHost') : '') : t('waitGuest');
}
function backToForm(msg) { leaveNet(); show('online'); $('#onForm').hidden = false; $('#onWait').hidden = true; $('#onErr').textContent = msg || ''; }
$('#bHost').onclick = () => {
  P.sfx('click'); leaveNet();
  $('#onErr').textContent = t('connecting');
  openHost(0);
};
function openHost(attempt) {
  const code = P.genCode();
  const relay = new P.Online('df', code, 'host');
  Object.assign(net, { relay, code, role: 'host', sess: Date.now().toString(36), gameNo: 0, roster: [{ name: myName(), conn: null }] });
  relay.on('open', () => { if (window.Party) Party.announce('df', code); $('#onErr').textContent = ''; $('#codeShow').textContent = code; $('#onForm').hidden = true; $('#onWait').hidden = false; renderRoster(); });
  relay.on('error', e => {
    if (net.relay !== relay) return;
    if (e.type === 'taken' && attempt < 4) { leaveNet(); openHost(attempt + 1); return; }
    if (net.roster.length > 1) return;
    backToForm(t('netErr'));
  });
  relay.on('connection', conn => {
    const entry = { conn, name: '' };
    conn.on('data', m => hostData(entry, m));
    conn.on('close', () => {
      const i = net.roster.indexOf(entry); if (i < 0) return;
      net.roster.splice(i, 1); toast(t('left', { name: esc(entry.name) }));
      if ($('#game').hidden) { broadcast({ t: 'lobby', names: net.roster.map(r => r.name) }); renderRoster(); }
    });
  });
}
function hostData(entry, m) {
  if (!m || typeof m !== 'object') return;
  if (m.t === 'hello') {
    if (!$('#game').hidden || net.roster.length >= MAXP) { entry.conn.send({ t: 'full' }); return; }
    entry.name = String(m.name || '?').slice(0, 14); entry.vis = !!m.vis; net.roster.push(entry);
    P.sfx('click'); broadcast({ t: 'lobby', names: net.roster.map(r => r.name) }); renderRoster();
  } else if (m.t === 'prog' && G.scene && !G.over) {
    const s = net.roster.indexOf(entry); if (s < 1) return;
    otherProgress(s, m.n); broadcast({ t: 'prog', s, n: G.counts[s] });
  } else if (m.t === 'done' && G.scene && !G.over) {
    const s = net.roster.indexOf(entry); if (s < 1) return;
    G.counts[s] = G.scene.diffs.length; finish(s); // le premier « done » reçu par l'hôte gagne
  }
}
function hostStart() {
  if (net.roster.length < 2) return;
  net.gameNo++;
  const seed = Scenes.seedAfter(G.seed), names = net.roster.map(r => r.name);
  const v = vis || net.roster.some(r => r.vis); // si un joueur a la vue adaptée, tout le monde a les mêmes images adaptées
  net.roster.forEach((r, s) => { if (r.conn) r.conn.send({ t: 'start', seed, level, vis: v, names, seat: s, code: net.code, sess: net.sess, game: net.gameNo }); });
  startGame(seed, level, names, names.map(() => false), 0, 'host', v);
}
$('#bStart').onclick = () => { P.sfx('click'); hostStart(); };
$('#bCopy').onclick = () => {
  const done = () => { $('#bCopy').textContent = t('copied'); setTimeout(() => { $('#bCopy').textContent = t('copyCode'); }, 1400); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(net.code).then(done, () => {});
};
$('#inCode').addEventListener('input', e => { e.target.value = window.BGCode ? BGCode(e.target.value) : e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });
$('#bJoin').onclick = () => {
  P.sfx('click');
  const code = $('#inCode').value.trim().toUpperCase();
  if (code.length !== 5) { $('#onErr').textContent = t('badCode'); return; }
  leaveNet(); $('#onErr').textContent = t('connecting');
  const relay = new P.Online('df', code, 'guest');
  Object.assign(net, { relay, code, role: 'guest', names: [] });
  let linked = false;
  const timer = setTimeout(() => { if (!linked) backToForm(t('noGame')); }, 15000);
  relay.on('error', e => { if (net.relay !== relay) return; clearTimeout(timer); backToForm(e.type === 'nogame' ? t('noGame') : t('netErr')); });
  relay.on('open', conn => {
    net.conn = conn;
    conn.on('open', () => { linked = true; clearTimeout(timer); $('#onErr').textContent = ''; conn.send({ t: 'hello', name: myName(), vis }); });
    conn.on('data', guestData);
    conn.on('close', () => { if (net.conn === conn) { backToForm(t('hostLeft')); P.sfx('bad'); } });
  });
};
function guestData(m) {
  if (!m || typeof m !== 'object') return;
  if (m.t === 'lobby') { net.names = (m.names || []).map(n => String(n).slice(0, 14)); $('#onForm').hidden = true; $('#onWait').hidden = false; show('online'); renderRoster(); }
  else if (m.t === 'full') backToForm(t('full'));
  else if (m.t === 'start') {
    Object.assign(net, { sess: String(m.sess || ''), gameNo: m.game | 0 });
    const lvl = [0, 1, 2].includes(m.level) ? m.level : 1;
    startGame(m.seed | 0, lvl, (m.names || []).map(n => String(n).slice(0, 14)), (m.names || []).map(() => false), m.seat | 0, 'guest', !!m.vis);
  }
  else if (m.t === 'prog' && G.scene && !G.over) otherProgress(m.s, m.n);
  else if (m.t === 'end' && G.scene) {
    if (Array.isArray(m.counts)) m.counts.forEach((n, s) => { if (s !== G.me) G.counts[s] = n | 0; });
    G.over = true; showResult(m.w | 0);
  }
}

/* ---------- Démarrage ---------- */
P.onLang(() => { renderLvl(); renderSnd(); renderMus(); renderVis(); renderUi(); if (!$('#onWait').hidden) renderRoster(); if (!$('#game').hidden) { renderHud(); $('#status').textContent = statusText(); } });
P.applyStatic(); renderLvl(); renderSnd(); renderMus(); renderVis(); renderUi();
{ const jc = window.Party && Party.takeJoin(); if (jc) joinFromParty(jc); }
window.__df = { G, startGame, claim, net };
})();
</script>

<title>Brutal&#39;s Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titan+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Accueil « lobby de jeu mobile » : grande bannière illustrée, profil du joueur, jeu à la une, grille de jeux,
   groupe d'amis, classement et chat. Barre d'onglets en bas sur téléphone, colonne latérale sur grand écran. */
:root{
  --bg0:#070f1e;--bg1:#0f1d38;--panel:#1b2d54;--panel2:#122142;--ink:#050a14;--line:#2b4373;--bone:#fff6e4;--dim:#a9bad8;
  --orange:#ff9a3c;--orange2:#e8661c;--gold:#ffcf3f;--mint:#6ff2b0;--pink:#ff5a8a;--sky:#5cc8ff;
  --f-display:"Titan One","Arial Black",system-ui,sans-serif;--f-ui:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg0)}
body{margin:0;min-height:100%;color:var(--bone);font-family:var(--f-ui);font-weight:700;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(1200px 700px at 50% -200px,#2a4f8f 0,#16305f 35%,transparent 70%) no-repeat,
        linear-gradient(180deg,var(--bg1),var(--bg0) 60%) fixed;background-color:var(--bg0);
  padding:0 0 calc(env(safe-area-inset-bottom,0px) + 96px)}
[hidden]{display:none!important}
a{color:inherit}
#sparks{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#sparks i{position:absolute;bottom:-12px;width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);opacity:.5;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-110vh) translateX(40px);opacity:0}}
.wrap{--gut:14px;position:relative;z-index:1;margin:0 auto;padding:0 var(--gut)}
@media (min-width:1100px){.wrap{--gut:24px}}
/* éléments de base */
.frame{position:relative;background:linear-gradient(180deg,#26407a 0,var(--panel) 26%,var(--panel2) 100%);border:3px solid var(--ink);border-radius:22px;
  box-shadow:0 6px 0 var(--ink),inset 0 2px 0 rgba(255,255,255,.14),inset 0 0 0 2px rgba(255,255,255,.04)}
.btn{position:relative;font-family:var(--f-display);font-weight:400;font-size:17px;color:var(--bone);cursor:pointer;line-height:1;letter-spacing:.02em;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(180deg,#4466b0 0,#33508f 50%,#253c70 100%);border:3px solid var(--ink);border-radius:14px;padding:10px 14px 9px;box-shadow:0 4px 0 var(--ink),inset 0 2px 0 rgba(255,255,255,.25);text-shadow:0 2px 0 rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s,filter .15s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink),inset 0 2px 0 rgba(255,255,255,.25)}
@media (hover:hover){.btn:hover{filter:brightness(1.1)}}
.btn:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.btn.orange{color:#2a1302;text-shadow:0 1px 0 rgba(255,255,255,.45);background:linear-gradient(180deg,#ffd29a 0,var(--orange) 50%,var(--orange2) 100%)}
.btn.icon{padding:8px;border-radius:13px}
.btn.icon svg{width:22px;height:22px}
.field{font-family:var(--f-ui);font-weight:900;font-size:19px;color:var(--bone);background:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:9px 12px 8px;width:100%;min-width:0;outline:none;box-shadow:inset 0 3px 6px rgba(0,0,0,.5)}
.field:focus{border-color:var(--orange)}
.field::placeholder{color:#62749a}
.nseg{display:flex;gap:6px}
.nseg .btn{flex:1;padding:9px 6px 8px;font-size:15px;background:var(--ink);color:var(--dim);box-shadow:inset 0 2px 4px rgba(0,0,0,.4);text-shadow:none}
.nseg .btn[aria-pressed="true"]{color:#2a1302;background:linear-gradient(180deg,#fff3c4,var(--gold) 55%,#e0a020);box-shadow:0 3px 0 var(--ink),inset 0 2px 0 rgba(255,255,255,.6)}
label,.lbl{font-size:12px;color:var(--dim);letter-spacing:.09em;text-transform:uppercase;font-weight:900}
h2.sec{margin:6px 0 0;font-family:var(--f-display);font-weight:400;font-size:24px;letter-spacing:.01em;text-shadow:0 3px 0 var(--ink);display:flex;align-items:center;gap:10px;scroll-margin-top:16px}
h2.sec .ico{width:34px;height:34px;flex:none;filter:drop-shadow(0 3px 0 var(--ink))}
h2.sec::after{content:"";flex:1;height:4px;border-radius:3px;background:linear-gradient(90deg,var(--line),transparent)}

/* bannière : ciel bleu nuit, halo derrière le logo, objets des jeux qui flottent */
.hero{position:relative;height:clamp(250px,44vw,370px);margin:0 calc(-1 * var(--gut));overflow:hidden;border-bottom:4px solid var(--ink);isolation:isolate}
.hero svg.scene{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero .float{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.hero .f2{animation-delay:-1.3s}.hero .f3{animation-delay:-2.1s}.hero .f4{animation-delay:-.7s}.hero .f5{animation-delay:-2.8s}.hero .f6{animation-delay:-1.9s}.hero .f7{animation-delay:-3.3s}.hero .f8{animation-delay:-.4s}
@keyframes bob{50%{transform:translateY(-9px) rotate(-4deg)}}
.hero .rays{transform-box:view-box;transform-origin:500px 175px;animation:spin 90s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero .halo{transform-box:fill-box;transform-origin:center;animation:breathe 5s ease-in-out infinite}
@keyframes breathe{50%{opacity:.75;transform:scale(1.06)}}
.hero .tw{animation:tw 3s ease-in-out infinite}.hero .tw:nth-child(2n){animation-delay:-1.5s}.hero .tw:nth-child(3n){animation-delay:-.8s}
@keyframes tw{50%{opacity:.25}}
.hero .cl{animation:drift 26s ease-in-out infinite alternate}.hero .cl2{animation-duration:34s;animation-direction:alternate-reverse}
@keyframes drift{to{transform:translateX(-40px)}}
.brand{position:absolute;left:0;right:0;top:clamp(26px,7vw,54px);display:flex;flex-direction:column;align-items:center;pointer-events:none}
.logo{font-family:var(--f-display);font-weight:400;font-size:clamp(46px,12.5vw,100px);line-height:.92;letter-spacing:.01em;text-align:center;
  background:linear-gradient(180deg,#fffaf0 0,#ffe7a8 45%,#ffb347 70%,#e8661c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;
  filter:drop-shadow(0 6px 0 var(--ink)) drop-shadow(0 0 30px rgba(255,170,80,.35));animation:drop .8s cubic-bezier(.2,1.5,.4,1) both}
.logo span{display:block;font-size:.62em;letter-spacing:.12em;margin-top:2px}
@keyframes drop{from{opacity:0;transform:translateY(-40px) scale(.75)}}
.ribbon{margin-top:10px;transform:rotate(-2deg);position:relative}
.ribbon b{position:relative;z-index:1;display:block;font-family:var(--f-display);font-weight:400;font-size:clamp(14px,3.8vw,19px);color:#2a1302;padding:6px 20px 5px;border:3px solid var(--ink);border-radius:9px;background:linear-gradient(180deg,#ffd29a,var(--orange) 55%,var(--orange2));box-shadow:0 4px 0 var(--ink);white-space:nowrap}
.ribbon::before,.ribbon::after{content:"";position:absolute;top:9px;width:28px;height:100%;background:#b8501a;border:3px solid var(--ink)}
.ribbon::before{left:-18px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,35% 50%)}.ribbon::after{right:-18px;clip-path:polygon(0 0,100% 0,65% 50%,100% 100%,0 100%)}
.hero .gear{position:absolute;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:3}

/* mise en page */
.layout{display:grid;grid-template-columns:1fr;gap:18px;margin-top:-34px;position:relative;z-index:2}
.maincol,.sidecol{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (min-width:1100px){.layout{grid-template-columns:minmax(0,1fr) clamp(370px,28%,440px);gap:24px;align-items:start}.sidecol{position:sticky;top:16px}}

/* profil */
.profile{display:flex;align-items:center;gap:12px;padding:12px 14px}
.avatar{appearance:none;-webkit-appearance:none;margin:0;padding:0;line-height:1;box-sizing:border-box;position:relative;width:66px;height:66px;flex:none;border-radius:20px;border:3px solid var(--ink);cursor:pointer;font-family:var(--f-display);font-size:32px;color:#2a1302;box-shadow:0 4px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.4);background:linear-gradient(180deg,#ffe7a8,var(--orange));transition:transform .15s cubic-bezier(.2,1.5,.4,1)}
.avatar:active{transform:scale(.94)}
.avatar:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#avPic{position:absolute;inset:0;border-radius:17px;overflow:hidden;display:grid;place-items:center}
#avPic svg{width:100%;height:100%;display:block}
.avatar .pen{position:absolute;right:-7px;bottom:-7px;width:26px;height:26px;border-radius:50%;border:3px solid var(--ink);background:var(--gold);display:grid;place-items:center;box-shadow:0 2px 0 var(--ink)}
.avatar .pen svg{width:14px;height:14px}
.avatar.noskin .pen{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.18)}}
/* éditeur de skin */
.avback{position:fixed;inset:0;z-index:30;background:rgba(3,7,16,.72);backdrop-filter:blur(3px)}
.aved{position:fixed;z-index:31;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 20px));max-height:calc(100dvh - 24px);display:flex;flex-direction:column;gap:10px;padding:14px;animation:pop .25s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:translate(-50%,-46%) scale(.92);opacity:0}}
.aved .sheet-head{font-size:24px}
.av-top{display:flex;align-items:center;gap:14px}
.av-big{width:128px;height:128px;flex:none;border-radius:30px;border:4px solid var(--ink);overflow:hidden;box-shadow:0 5px 0 var(--ink),0 0 30px rgba(255,154,60,.3)}
.av-big svg{width:100%;height:100%;display:block}
.av-side{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.av-side .who{font-family:var(--f-display);font-size:22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av-cats{display:flex;gap:5px;flex-wrap:wrap}
.av-cats .btn{flex:1 1 auto;font-size:13px;padding:7px 8px 6px;border-radius:11px;box-shadow:0 3px 0 var(--ink)}
.av-cats .btn[aria-pressed="true"]{color:#2a1302;background:linear-gradient(180deg,#ffd29a,var(--orange) 50%,var(--orange2))}
.av-grp{grid-column:1/-1;font-family:var(--f-display);font-size:15px;color:var(--dim);padding:6px 2px 0;letter-spacing:.02em}
.av-opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;overflow-y:auto;padding:4px 8px 10px;min-height:80px;max-height:340px;border-radius:14px;background:var(--ink)}
.av-opts button{all:unset;box-sizing:border-box;aspect-ratio:1;border-radius:14px;border:3px solid #1b2d54;overflow:hidden;cursor:pointer;display:grid;place-items:center;transition:transform .12s}
.av-opts button svg{width:100%;height:100%;display:block}
.av-opts button:active{transform:scale(.92)}
.av-opts button[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 0 14px rgba(255,207,63,.5)}
.av-opts button.sw{border-radius:50%}
.av-foot{display:flex;gap:8px}
.av-foot .btn{flex:1}
@media (max-width:520px){.aved{top:auto;bottom:0;transform:translateX(-50%);width:100%;border-radius:22px 22px 0 0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}@keyframes pop{from{transform:translate(-50%,40%)}}.av-big{width:104px;height:104px;border-radius:26px}.av-opts{grid-template-columns:repeat(5,1fr);max-height:min(300px,38dvh)}}
/* petits avatars du classement */
.lbav{display:inline-grid;place-items:center;vertical-align:middle;width:26px;height:26px;margin-right:7px;border-radius:8px;overflow:hidden;border:2px solid #000;background:#26407a;font-family:var(--f-display);font-size:13px;font-style:normal;color:var(--dim)}
.lbav svg{width:100%;height:100%;display:block}
/* bouton volume et invitations aux couleurs du menu */
.bg-dock-btn{background:linear-gradient(180deg,#3a5a9e,#1f3366)!important}
.bg-dock-pop,.pty-inv{background:#122142!important}
.pty-inv .no{background:#26407a!important}
.profile .pf{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--dim);background:var(--ink);border-radius:999px;padding:4px 10px 3px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.06)}
.chip b{font-family:var(--f-display);font-weight:400;color:var(--bone);font-size:14px}
.chip.gold b{color:var(--gold)}
.chip.hint{font-size:12.5px}

/* jeu à la une */
.feat{display:grid;grid-template-columns:1fr;overflow:hidden;text-decoration:none;transition:transform .2s cubic-bezier(.2,1.5,.4,1)}
@media (hover:hover){.feat:hover{transform:translateY(-3px)}}
.feat .art{position:relative;height:clamp(170px,40vw,250px);border-bottom:3px solid var(--ink);overflow:hidden}
.feat .art svg{position:absolute;inset:0;width:100%;height:100%}
.feat .fb{padding:12px 14px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.feat .fb .tx{flex:1;min-width:200px;display:flex;flex-direction:column;gap:4px}
.feat h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:28px;text-shadow:0 3px 0 var(--ink)}
.feat p{margin:0;font-size:14px;color:var(--dim);line-height:1.4;font-weight:700}
.feat .btn{font-size:22px;padding:12px 26px 11px}
.badge-new{position:absolute;top:12px;left:12px;font-family:var(--f-display);font-size:14px;color:#2a1302;background:linear-gradient(180deg,#fff3c4,var(--gold));border:3px solid var(--ink);border-radius:10px;padding:5px 10px 4px;box-shadow:0 3px 0 var(--ink);transform:rotate(-4deg);z-index:2}
.badge-new.sm{top:8px;left:8px;font-size:11px;padding:3px 7px 2px}
.feat .kicker{font-family:var(--f-display);font-size:13px;color:var(--gold);letter-spacing:.06em}
@media (min-width:760px){.feat{grid-template-columns:1.35fr 1fr}.feat .art{height:auto;min-height:250px;border-bottom:0;border-right:3px solid var(--ink)}.feat .fb{flex-direction:column;align-items:stretch;justify-content:center;padding:18px}.feat .fb .tx{min-width:0}}

/* grille des jeux */
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.games{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}}
@media (min-width:1100px){.games{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;overflow:hidden;text-decoration:none;transition:transform .2s cubic-bezier(.2,1.5,.4,1)}
@media (hover:hover){.tile:hover{transform:translateY(-4px) rotate(-.5deg)}}
.tile .thumb{position:relative;aspect-ratio:2/1;border-bottom:3px solid var(--ink);overflow:hidden}
.tile .thumb svg{position:absolute;inset:0;width:100%;height:100%}
.tile .tb{padding:9px 10px 10px;display:flex;flex-direction:column;gap:6px;flex:1}
.tile h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(16px,4.4vw,20px);line-height:1.05;text-shadow:0 2px 0 var(--ink)}
.tile p{margin:0;font-size:12.5px;color:var(--dim);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .meta{margin-top:auto;display:flex;align-items:center;gap:6px}
.tile .meta span{font-size:11.5px;color:var(--dim);background:var(--ink);border-radius:999px;padding:3px 8px 2px;white-space:nowrap}
.tile .meta .go{margin-left:auto;width:34px;height:34px;flex:none;border-radius:11px;border:3px solid var(--ink);display:grid;place-items:center;background:linear-gradient(180deg,#ffd29a,var(--orange) 55%,var(--orange2));box-shadow:0 3px 0 var(--ink)}
.tile .meta .go svg{width:16px;height:16px}

/* panneaux */
.partybox,.chatbox,.lb{padding:14px}
#gchat{height:380px}
@media (min-width:1100px){#gchat{height:calc(var(--vh,100vh) - 420px);min-height:300px}}
.lb{display:flex;flex-direction:column;gap:12px}
.lb-head{display:flex;flex-direction:column;gap:8px}
#lbTabs{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 4px}
#lbTabs .btn{flex:1 1 auto;white-space:nowrap;padding:8px 10px 7px;font-size:14px;box-shadow:0 3px 0 var(--ink),inset 0 2px 0 rgba(255,255,255,.25)}
@media (max-width:520px){#lbTabs{gap:5px}#lbTabs .btn{font-size:12.5px;padding:7px 8px 6px;border-radius:11px}}
.lb-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
@media (max-width:760px){.lb-grid{grid-template-columns:1fr}}
.lb-cols,.lb-row{display:grid;grid-template-columns:30px 1fr 44px 44px 46px;align-items:center;gap:6px}
.lb-cols{font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;padding:0 8px;font-weight:900}
.lb-cols span:nth-child(n+3),.lb-row span:nth-child(n+3){text-align:right;font-variant-numeric:tabular-nums}
.lb-list{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.lb-row{background:var(--ink);border-radius:13px;padding:8px 8px 7px;font-size:15px;font-weight:900}
.lb-row:first-child{background:linear-gradient(90deg,rgba(255,207,63,.25),var(--ink) 70%)}
.lb-row.me{box-shadow:inset 0 0 0 2px var(--orange)}
.lb-row .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-row .nm small{font-size:10.5px;color:var(--dim);margin-left:5px;background:rgba(255,255,255,.08);border-radius:6px;padding:1px 5px}
.rank{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;color:var(--dim);border:2px solid transparent;font-family:var(--f-display)}
.rank.r1{background:radial-gradient(circle at 35% 30%,#fff2a8,var(--gold));color:#3a2600;border-color:var(--ink)}
.rank.r2{background:radial-gradient(circle at 35% 30%,#fff,#c9d0de);color:#22283a;border-color:var(--ink)}
.rank.r3{background:radial-gradient(circle at 35% 30%,#ffc08a,#c9783a);color:#2e1606;border-color:var(--ink)}
.hist{display:flex;flex-direction:column;gap:5px;font-size:13px;margin-top:6px}
.hist div{display:flex;align-items:center;gap:8px;color:var(--dim);padding:6px 8px;border-radius:11px;background:rgba(11,7,22,.6)}
.hist .gi{width:22px;height:22px;flex:none}
.hist b{color:var(--bone)}
.hist span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{font-size:14px;color:var(--dim);padding:10px;border-radius:12px;background:var(--ink)}
.dbline{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:7px}
.dbline i{width:9px;height:9px;border-radius:50%;background:var(--dim)}
.dbline i.on{background:var(--mint);box-shadow:0 0 8px var(--mint)}.dbline i.off{background:var(--pink)}
.install{font-size:13px;color:var(--dim);text-align:center;line-height:1.5;margin:4px 0 0}
.sheet{position:fixed;z-index:15;left:50%;top:50%;transform:translate(-50%,-50%);width:min(360px,calc(100% - 32px));padding:14px;display:flex;flex-direction:column;gap:10px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-display);font-size:22px}

/* barre d'onglets (téléphone) — laisse le coin gauche au bouton du volume */
.tabbar{position:fixed;z-index:20;left:72px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:4px;padding:5px;border-radius:18px;
  background:linear-gradient(180deg,#26407a,var(--panel2));border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink),inset 0 2px 0 rgba(255,255,255,.12)}
.tabbar button{all:unset;flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px 4px;border-radius:12px;cursor:pointer;font-size:10.5px;font-weight:900;color:var(--dim);letter-spacing:.02em}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{background:var(--ink);color:var(--bone)}
@media (min-width:1100px){.tabbar{display:none}body{padding-bottom:40px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

function histTxt(m) {
  if (P.aliasOf) m = Object.assign({}, m, { p: m.p.map(P.aliasOf) });
  const wa = P.winnersOf(m);
  if (wa.length > 1) { const nm = wa.slice(0, 3).map(i => m.p[i]).join(', ') + (wa.length > 3 ? '…' : ''); return t('winTeam', { a: esc(nm), n: m.p.length }); }
  return m.p.length > 2 ? t('winN', { a: esc(m.p[m.w]), n: m.p.length }) : t('beat', { a: esc(m.p[m.w]), b: esc(m.p[1 - m.w]) });
}
function render() {
  $('#lbTabs').innerHTML = GAMES.map(([k, l]) => `<button class="btn" data-tab="${k}" aria-pressed="${k === tab}">${k === 'all' ? t('all') : esc(t(l))}</button>`).join('');
  const rows = P.ranking(matches, tab === 'all' ? null : tab);
  const me = P.name().toLowerCase();
  $('#lbList').innerHTML = rows.length ? rows.slice(0, 30).map((r, i) => `<div class="lb-row${r.name.toLowerCase() === me ? ' me' : ''}"><span class="rank${i < 3 ? ' r' + (i + 1) : ''}">${i + 1}</span><span class="nm">${lbAv(r.name)}${esc(r.name)}${r.ai ? `<small>${t('aiTag')}</small>` : ''}</span><span>${r.w}</span><span>${r.g}</span><span>${Math.round(100 * r.w / r.g)}%</span></div>`).join('')
    : `<div class="empty">${t('lbEmpty')}</div>`;
  const fmt = new Intl.DateTimeFormat(t('locale'), { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  const hist = matches.filter(m => tab === 'all' || m.g === tab).slice(-8).reverse();
  $('#hist').innerHTML = hist.length ? hist.map(m => `<div>${GI[m.g] || ''}<span>${histTxt(m)}</span><span>${fmt.format(new Date(m.t))}</span></div>`).join('')
    : `<div class="empty">${t('lbEmpty')}</div>`;
  const all = P.ranking(matches), mi = all.findIndex(r => r.name.toLowerCase() === me);
  $('#myStat').innerHTML = mi >= 0 ? `<span class="chip gold">🏆 <b>${all[mi].w}</b> ${t('stWins')}</span><span class="chip">🎮 <b>${all[mi].g}</b> ${t('stGames')}</span><span class="chip">${t('stRank')} <b>#${mi + 1}</b></span>`
    : `<span class="chip hint">${t('myStat0')}</span>`;
  renderMyAv();
  $('#dbDot').className = dbState === 'on' ? 'on' : dbState === 'off' ? 'off' : '';
  $('#dbTxt').textContent = dbState === 'on' ? t('dbOn', { n: matches.length, games: P.gamesWord(matches.length) }) : dbState === 'off' ? t('dbOff') : t('dbLoad');
}
document.addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) { P.unlockAudio(); P.sfx('click'); tab = b.dataset.tab; P.set('hub-tab', tab); render(); } });
async function load() {
  const av = P.fetchAvatars();
  try { matches = await P.fetchMatches(); dbState = 'on'; } catch (e) { dbState = 'off'; }
  await av;
  render();
}
setInterval(() => { if (!document.hidden) load(); }, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });

/* --- skin du joueur --- */
const lbAv = n => { const a = P.avatarOf(n); return a ? `<i class="lbav">${P.avatarSVG(a)}</i>` : `<i class="lbav">${esc(String(n || '?')[0].toUpperCase())}</i>`; };
function renderMyAv() {
  const a = P.myAvatar(), nm = P.hasName() ? P.name() : '';
  $('#avPic').innerHTML = a ? P.avatarSVG(a) : esc(nm ? nm[0].toUpperCase() : '?');
  $('#avatar').classList.toggle('noskin', !a);
}
let avDraft = null;
const avRand = () => P.SKINS[Math.floor(Math.random() * P.SKINS.length)].id;
const AVG = [['qd', 'gn_qd'], ['uc', 'gn_uc'], ['cn', 'gn_cn'], ['bn', 'gn_bn']];
function renderAvEd() {
  $('#avBig').innerHTML = P.avatarSVG(avDraft);
  $('#avWho').textContent = P.hasName() ? P.name() : '';
  $('#avOpts').innerHTML = AVG.map(([g, k]) => `<div class="av-grp">${esc(t(k))}</div>` + P.SKINS.filter(x => x.g === g).map(x => `<button data-avo="${x.id}" aria-pressed="${avDraft === x.id}">${x.svg()}</button>`).join('')).join('');
}
function openAvEd() {
  P.unlockAudio(); P.sfx('click');
  avDraft = P.myAvatar() || P.SKINS[0].id;
  $('#avBack').hidden = $('#avEd').hidden = false; renderAvEd();
}
function closeAvEd() { $('#avBack').hidden = $('#avEd').hidden = true; }
$('#avatar').onclick = openAvEd;
$('#avClose').onclick = $('#avCancel').onclick = $('#avBack').onclick = () => { P.sfx('click'); closeAvEd(); };
$('#avRnd').onclick = () => { P.sfx('click'); avDraft = avRand(); renderAvEd(); };
$('#avSave').onclick = () => { P.sfx('good'); P.setMyAvatar(avDraft); closeAvEd(); renderMyAv(); render(); };
$('#avOpts').addEventListener('click', e => { const b = e.target.closest('[data-avo]'); if (!b) return; P.sfx('click'); avDraft = b.dataset.avo; const sc = $('#avOpts').scrollTop; renderAvEd(); $('#avOpts').scrollTop = sc; });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#avEd').hidden) closeAvEd(); });
$('#inName').addEventListener('change', () => P.pushAvatar());
P.pushAvatar();

P.bindName($('#inName'));
$('#inName').addEventListener('input', () => render());
function renderSnd() { $('#sndSeg').innerHTML = `<button class="btn" data-snd="1" aria-pressed="${P.soundOn()}">${t('on')}</button><button class="btn" data-snd="0" aria-pressed="${!P.soundOn()}">${t('off')}</button>`; }
document.addEventListener('click', e => { const b = e.target.closest('[data-snd]'); if (b) { P.setSound(b.dataset.snd === '1'); renderSnd(); P.sfx('click'); } });
$('#bSet').onclick = () => { P.unlockAudio(); P.sfx('click'); $('#settings').hidden = !$('#settings').hidden; };
$('#bSetClose').onclick = () => { P.sfx('click'); $('#settings').hidden = true; };
document.addEventListener('click', e => { const a = e.target.closest('a.card'); if (!a) return; P.unlockAudio(); if (!P.needName($('#inName'))) { e.preventDefault(); P.sfx('bad'); $('#inName').scrollIntoView({ block: 'center', behavior: 'smooth' }); return; } P.sfx('click'); });
// barre d'onglets : aller à une section, et suivre la section visible
document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { P.sfx('click'); document.getElementById(b.dataset.go).scrollIntoView({ behavior: 'smooth', block: 'start' }); }));
if (window.IntersectionObserver) {
  const io = new IntersectionObserver(es => { es.forEach(en => { if (en.isIntersecting) document.querySelectorAll('[data-go]').forEach(b => b.classList.toggle('on', b.dataset.go === en.target.id)); }); }, { rootMargin: '-35% 0px -55% 0px' });
  ['s-games', 's-party', 's-lb', 's-chat'].forEach(id => io.observe(document.getElementById(id)));
}
// Chat général (même chat que dans les jeux)
const gc = GChat.mount($('#gchat'), { db: P.DB_URL, lang: P.lang, name: () => P.hasName() ? P.name() : '', needName: () => { P.needName($('#inName')); $('#inName').scrollIntoView({ block: 'center', behavior: 'smooth' }); } });
Party.mountPanel($('#party'));
// Bouton volume (réglages communs : la musique de chaque jeu et les bruitages)
P.audioDock({ on: () => P.musicVol() > 0.01, set: () => {}, vol: () => {} });
P.onLang(() => { renderGames(); render(); renderSnd(); gc.refresh(); Party.refresh(); if (!$('#avEd').hidden) renderAvEd(); });
// Grand écran : la page occupe toute la largeur et s'agrandit en proportion (mise en page calculée sur 1500 px)
function fitScreen() {
  const w = window.innerWidth, z = w > 1500 ? Math.min(w / 1500, 2.2) : 1;
  document.body.style.zoom = z === 1 ? '' : z;
  document.documentElement.style.setProperty('--vh', (window.innerHeight / z) + 'px');
}
window.addEventListener('resize', fitScreen); fitScreen();
P.applyStatic(); renderGames(); renderSnd(); render(); load();
})();
</script>
</body>
</html>

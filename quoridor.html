<title>Quoridor du Donjon</title>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Lilita+One&display=swap">
<style>
/* Layout : portrait sur mobile (adversaires en haut, plateau 3D au centre, console en bas) ;
   sur PC, colonne de jeu à gauche, plateau au centre, classement à droite. Style jeu mobile cartoon. */
:root{
  --void:#1a1a2e;
  --panel:#2a2148;
  --panel-2:#3b2d66;
  --ink:#0c0816;
  --bone:#f3e7c9;
  --bone-dim:#a69bbb;
  --torch:#ff9a3c;
  --slime:#86f2a0;
  --blood:#e8394d;
  --gold:#ffcf3f;
  --rivet:#cbbf9f;
  --f-display:"Creepster","Chiller",fantasy,cursive;
  --f-ui:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --f-text:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--void);color:var(--bone);font-family:var(--f-ui);overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#app{position:fixed;inset:0;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 45%,rgba(8,5,20,.72) 100%)}

/* ---------- Cadres façon jeu mobile ---------- */
.frame,.card,.sheet{
  background:linear-gradient(180deg,color-mix(in srgb,var(--panel) 84%,#fff 16%) 0,var(--panel) 34%,color-mix(in srgb,var(--panel) 82%,#000) 100%);
  border:3px solid var(--ink);border-radius:20px;
  box-shadow:0 6px 0 var(--ink),inset 0 0 0 2px color-mix(in srgb,var(--panel) 70%,#fff 14%),inset 0 4px 0 rgba(255,255,255,.08);
}
.frame{position:relative}
.frame::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:
    radial-gradient(circle at 9px 9px,var(--rivet) 2.4px,var(--ink) 3px 4.2px,transparent 4.6px),
    radial-gradient(circle at calc(100% - 9px) 9px,var(--rivet) 2.4px,var(--ink) 3px 4.2px,transparent 4.6px),
    radial-gradient(circle at 9px calc(100% - 9px),var(--rivet) 2.4px,var(--ink) 3px 4.2px,transparent 4.6px),
    radial-gradient(circle at calc(100% - 9px) calc(100% - 9px),var(--rivet) 2.4px,var(--ink) 3px 4.2px,transparent 4.6px)}

/* ---------- Boutons ---------- */
.btn{position:relative;font-family:var(--f-ui);font-size:17px;color:var(--bone);cursor:pointer;line-height:1;letter-spacing:.02em;
  background:linear-gradient(180deg,color-mix(in srgb,var(--panel-2) 72%,#fff 28%) 0,var(--panel-2) 46%,color-mix(in srgb,var(--panel-2) 78%,#000) 100%);
  border:3px solid var(--ink);border-radius:14px;padding:10px 14px 8px;
  box-shadow:0 4px 0 var(--ink),inset 0 2px 0 rgba(255,255,255,.28),inset 0 -3px 0 rgba(0,0,0,.2);
  text-shadow:0 2px 0 rgba(0,0,0,.35);transition:transform .07s,box-shadow .07s,filter .15s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink),inset 0 2px 0 rgba(255,255,255,.28),inset 0 -2px 0 rgba(0,0,0,.2)}
@media (hover:hover){.btn:hover{filter:brightness(1.08)}}
.btn:focus-visible{outline:3px solid var(--slime);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:default;filter:grayscale(.4)}
.btn.orange{color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.45);
  background:linear-gradient(180deg,color-mix(in srgb,var(--torch) 55%,#fff 45%) 0,var(--torch) 48%,color-mix(in srgb,var(--torch) 78%,#000) 100%)}
.btn.gold{color:#2a1c00;text-shadow:0 1px 0 rgba(255,255,255,.5);background:linear-gradient(180deg,#fff0b0 0,var(--gold) 50%,#d99a1c 100%)}
.btn.icon{padding:8px;display:grid;place-items:center;flex:none}
.btn.icon svg{width:24px;height:24px;color:var(--bone)}
.btn.icon.sm{padding:6px;border-radius:12px}
.btn.icon.sm svg{width:22px;height:22px}
.btn .ico{width:20px;height:20px;flex:none;color:currentColor}
.btn.wide{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 14px 11px}
.btn.tall{font-size:21px;padding:16px 14px 13px;border-radius:18px}
.btn.big{font-size:26px;padding:16px 40px 13px;border-radius:20px;box-shadow:0 6px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.4),inset 0 -4px 0 rgba(0,0,0,.18)}

/* ---------- Barres de jeu ---------- */
.bar{position:absolute;left:0;right:0;padding-inline:16px;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:2}
#top{top:0;padding-top:calc(env(safe-area-inset-top,0px) + 12px)}
#bottom{bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}
.card{pointer-events:auto;width:100%;max-width:440px;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 8px;border-radius:18px;transition:box-shadow .25s}
.card.active{box-shadow:0 6px 0 var(--ink),0 0 0 3px var(--torch),0 0 26px color-mix(in srgb,var(--torch) 55%,transparent),inset 0 0 0 2px color-mix(in srgb,var(--panel) 70%,#fff 14%)}
.avatar{width:48px;height:48px;flex:none;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;overflow:hidden;position:relative;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.25),inset 0 -4px 0 rgba(0,0,0,.25)}
.avatar svg{width:42px;height:42px}
.avatar.sk{background:radial-gradient(circle at 35% 30%,#4a5f8f,#26304d)}
.avatar.mon{background:radial-gradient(circle at 35% 30%,#8a2a40,#4a1222)}
.avatar.gh{background:radial-gradient(circle at 35% 30%,#3b7f8f,#1d4049)}
.avatar.pk{background:radial-gradient(circle at 35% 30%,#8a5a20,#4a2a0c)}
#opps{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
#opps.multi{gap:4px;align-items:stretch}
.opp{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
#opps.multi .opp{flex-direction:column;gap:3px;padding:4px 2px 3px;border-radius:14px;border:2px solid transparent;text-align:center}
#opps.multi .opp.active{border-color:var(--torch);background:color-mix(in srgb,var(--torch) 18%,transparent)}
#opps.multi .avatar{width:38px;height:38px;border-width:2px}
#opps.multi .avatar svg{width:33px;height:33px}
.opp .mini-name{font-size:13px;line-height:1.05;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opp .mini-w{font-size:12px;color:var(--bone-dim);display:flex;align-items:center;gap:3px}
.opp .mini-w svg{width:14px;height:7px;color:var(--bone)}
.opp .mini-w small{font-size:10px;letter-spacing:.06em;color:var(--bone-dim)}
.who{display:flex;flex-direction:column;min-width:0;flex:1;gap:5px}
.name{font-size:17px;line-height:1;letter-spacing:.02em;display:flex;align-items:center;gap:8px;flex-wrap:wrap;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.chip{font-size:11px;padding:3px 8px 2px;border-radius:999px;border:2px solid var(--ink);background:var(--ink);color:var(--bone-dim);letter-spacing:.08em;text-transform:uppercase;text-shadow:none}
.card.active .chip,.opp.active .chip{background:var(--torch);color:var(--ink);animation:chipPulse 1.2s ease-in-out infinite}
@keyframes chipPulse{50%{transform:scale(1.08)}}
.bones{display:flex;gap:2px;flex-wrap:nowrap;align-items:center}
.bones svg{flex:0 1 16px;min-width:8px;width:16px;height:8px;color:var(--bone);transition:opacity .3s,transform .3s;filter:drop-shadow(0 1px 0 var(--ink))}
.bones svg.used{opacity:.14;transform:scale(.8)}
.tools{display:flex;gap:6px;flex:none}
html:not(.pc) #cardOp:has(#opps.multi) .tools{flex-direction:column;gap:5px}
#bChat{position:relative}
.badge{position:absolute;top:-7px;right:-7px;min-width:19px;height:19px;border-radius:10px;background:var(--blood);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--ink);text-shadow:none;animation:pop .3s}

.controls{flex-direction:column;align-items:stretch;gap:8px;padding:10px}
.row{display:flex;gap:8px;align-items:center}
.seg{flex:1;display:flex;background:var(--ink);border-radius:17px;padding:3px;gap:3px;min-width:0;box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
.seg .btn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;border-width:2px;box-shadow:none;background:transparent;color:var(--bone-dim);padding:11px 6px 9px;white-space:nowrap;text-shadow:none}
.seg .btn.sel{color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.4);background:linear-gradient(180deg,color-mix(in srgb,var(--torch) 55%,#fff 45%),var(--torch) 55%,color-mix(in srgb,var(--torch) 80%,#000));box-shadow:inset 0 -3px 0 rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.4)}
.seg .btn.sel.wall{background:linear-gradient(180deg,#fffaf0,var(--bone) 55%,#cbb98e)}
#bWall .ico{width:26px;height:12px}
.seg .btn{min-width:0}
.seg .btn span{min-width:0;overflow:hidden;text-overflow:ellipsis}
html.pc .seg .btn{font-size:15px;gap:5px;padding-inline:4px}
#status{margin:0;font-size:13px;color:var(--bone-dim);text-align:center;letter-spacing:.02em;min-height:1.2em}
#status b{color:var(--slime);font-weight:400}
.kbd{font-family:var(--f-text);font-size:12px;color:var(--bone-dim);display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center}
.kbd kbd{font-family:var(--f-ui);font-size:12px;background:var(--ink);border-radius:6px;padding:2px 6px 1px;color:var(--bone)}

#toast{position:absolute;z-index:9;left:50%;top:38%;transform:translate(-50%,-50%) scale(.8);background:linear-gradient(180deg,#ff6a7a,var(--blood));color:#fff;border:3px solid var(--ink);border-radius:16px;padding:10px 16px 8px;font-size:16px;box-shadow:0 5px 0 var(--ink);opacity:0;pointer-events:none;transition:opacity .2s,transform .25s cubic-bezier(.2,1.6,.4,1);max-width:calc(100% - 32px);text-align:center;text-shadow:0 2px 0 rgba(0,0,0,.3)}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* ---------- Écrans (accueil, fin) ---------- */
.screen{position:absolute;inset:0;z-index:4;display:flex;overflow-y:auto;padding:16px;padding-block:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px);
  background:radial-gradient(ellipse at 50% 40%,rgba(12,8,22,.18),rgba(12,8,22,.82) 72%);animation:fadeIn .3s ease-out}
@keyframes fadeIn{from{opacity:0}}
.panel{width:100%;max-width:420px;margin:auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.panel .row{width:100%;justify-content:center;flex-wrap:wrap}

.logo{display:flex;flex-direction:column;align-items:center;animation:logoDrop .8s cubic-bezier(.2,1.5,.4,1) both}
.logo-q{font-family:var(--f-display);font-size:clamp(60px,18vw,100px);line-height:.9;letter-spacing:.03em;
  background:linear-gradient(180deg,#fffaf0 0,var(--bone) 42%,#d9b46a 74%,#a87a32 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:2.5px var(--ink);filter:drop-shadow(0 6px 0 var(--ink)) drop-shadow(0 0 26px color-mix(in srgb,var(--torch) 45%,transparent));
  animation:float 4s ease-in-out .8s infinite;padding-inline:.06em}
.ribbon{position:relative;margin-top:-4px;transform:rotate(-2.5deg)}
.ribbon span{position:relative;z-index:1;display:block;font-size:clamp(16px,4.6vw,21px);color:var(--ink);padding:6px 22px 5px;border:3px solid var(--ink);border-radius:8px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--torch) 50%,#fff 50%),var(--torch) 55%,color-mix(in srgb,var(--torch) 80%,#000));box-shadow:0 4px 0 var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.5);white-space:nowrap}
.ribbon::before,.ribbon::after{content:"";position:absolute;top:9px;width:30px;height:100%;background:color-mix(in srgb,var(--torch) 60%,#000);border:3px solid var(--ink);z-index:0}
.ribbon::before{left:-20px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,35% 50%)}
.ribbon::after{right:-20px;clip-path:polygon(0 0,100% 0,65% 50%,100% 100%,0 100%)}
@keyframes logoDrop{0%{opacity:0;transform:translateY(-50px) scale(.7)}60%{opacity:1}}
@keyframes float{50%{transform:translateY(-5px) rotate(-.8deg)}}
.cast{display:flex;justify-content:center;margin-top:-2px}
.cast .avatar{width:58px;height:58px;margin-inline:-5px;animation:bob 2.4s ease-in-out infinite}
.cast .avatar svg{width:50px;height:50px}
.cast .avatar:nth-child(2){animation-delay:-.6s}.cast .avatar:nth-child(3){animation-delay:-1.2s}.cast .avatar:nth-child(4){animation-delay:-1.8s}
@keyframes bob{50%{transform:translateY(-7px) rotate(4deg)}}

.lobby{width:100%;padding:16px;display:flex;flex-direction:column;gap:11px;text-align:left}
.lobby label,.sheet label{font-size:13px;color:var(--bone-dim);letter-spacing:.07em;text-transform:uppercase}
.view{display:flex;flex-direction:column;gap:11px;animation:viewIn .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes viewIn{from{opacity:0;transform:translateX(24px) scale(.97)}}
.vhead{display:flex;align-items:center;gap:10px}
.vhead h2{margin:0;font-size:22px;font-weight:400;letter-spacing:.02em;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.field{font-family:var(--f-ui);font-size:19px;color:var(--bone);background:var(--ink);border:3px solid var(--ink);border-radius:13px;padding:10px 12px 8px;width:100%;min-width:0;outline:none;-webkit-user-select:text;user-select:text;box-shadow:inset 0 3px 6px rgba(0,0,0,.45)}
.field:focus{border-color:var(--torch)}
.field.code{text-transform:uppercase;letter-spacing:.3em;text-align:center}
.lobby .row{flex-wrap:nowrap}
.lobby .row .btn{flex:none}
.big-choice{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px 11px;border-radius:18px;text-align:left}
.big-choice .bico{width:42px;height:42px;flex:none;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
.big-choice.orange .bico{color:#fff4d6}.big-choice:not(.orange) .bico{color:var(--slime)}
.big-choice span{display:flex;flex-direction:column;gap:3px;min-width:0}
.big-choice b{font-weight:400;font-size:21px}
.big-choice small{font-size:13px;opacity:.82;text-shadow:none}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px 13px;border-radius:18px;font-size:18px}
.tile .bico{width:46px;height:46px;color:var(--slime)}
.tile.orange .bico{color:#fff4d6}
.minirow{display:grid;grid-template-columns:1fr auto auto;gap:8px}
html.pc .minirow{grid-template-columns:1fr auto}
#bTuto{font-size:16px}
.newtag{position:absolute;top:-10px;right:-6px;font-style:normal;font-size:11px;background:var(--blood);color:#fff;border:2px solid var(--ink);border-radius:999px;padding:3px 7px 2px;text-shadow:none;animation:chipPulse 1.1s infinite}
.pulse{animation:pulseRing 1.1s ease-out infinite!important}
@keyframes pulseRing{0%{box-shadow:0 4px 0 var(--ink),0 0 0 0 color-mix(in srgb,var(--slime) 80%,transparent)}100%{box-shadow:0 4px 0 var(--ink),0 0 0 16px transparent}}
.sep{display:flex;align-items:center;gap:10px;color:var(--bone-dim);font-size:13px}
.sep::before,.sep::after{content:"";flex:1;height:3px;border-radius:2px;background:var(--ink)}
#lobbyErr{margin:0;color:#ff8a96;font-size:14px;font-family:var(--f-text);min-height:1em}
.nseg{display:flex;gap:6px}
.nseg .btn{flex:1;padding:9px 6px 7px;font-size:16px;background:var(--ink);color:var(--bone-dim);box-shadow:inset 0 2px 4px rgba(0,0,0,.4);text-shadow:none}
.nseg .btn[aria-pressed="true"]{color:var(--ink);background:linear-gradient(180deg,#fffaf0,var(--bone) 55%,#cbb98e);box-shadow:0 3px 0 var(--ink),inset 0 2px 0 rgba(255,255,255,.6)}
.langseg .btn{font-size:14px}
.bigcode{font-size:50px;letter-spacing:.22em;color:var(--torch);text-shadow:0 4px 0 var(--ink);text-align:center;padding-left:.22em}
.wait{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.wait p{margin:0;color:var(--bone-dim);font-family:var(--f-text);font-size:14px;line-height:1.45}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.roster{display:flex;flex-direction:column;gap:5px;width:100%}
.roster>div{display:flex;align-items:center;gap:10px;background:var(--ink);border-radius:13px;padding:5px 10px 5px 5px;font-size:16px;text-align:left;animation:viewIn .3s}
.roster .avatar{width:34px;height:34px;border-width:2px}
.roster .avatar svg{width:30px;height:30px}
.roster small{margin-left:auto;font-size:11px;color:var(--bone-dim);letter-spacing:.06em;text-transform:uppercase}
.roster .empty{opacity:.45;animation:none}

a.btn{text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.hubback{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;z-index:2;font-size:15px;padding:8px 12px 6px}
/* ---------- Réglages ---------- */
.sheet{position:absolute;z-index:9;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,calc(100% - 32px));max-height:calc(100% - 32px);overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:9px;animation:sheetIn .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes sheetIn{from{opacity:0;transform:translate(-50%,-46%) scale(.92)}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;font-size:22px;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.set-grid{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.theme-b{font-family:var(--f-ui);font-size:12px;color:var(--bone);background:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:4px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;min-width:0}
.theme-b i{display:block;width:100%;height:28px;border-radius:8px}
.theme-b[aria-pressed="true"]{border-color:var(--torch);box-shadow:0 0 14px color-mix(in srgb,var(--torch) 60%,transparent)}
.theme-b:focus-visible{outline:3px solid var(--slime);outline-offset:2px}
.qseg .btn{font-size:13px;padding:8px 2px 6px;min-width:0}
.qnote{font-family:var(--f-text);font-size:12px;color:var(--bone-dim);min-height:1em}

/* ---------- Classement ---------- */
#lb{display:none;flex-direction:column;gap:10px;padding:14px;color:var(--bone);overflow:hidden;z-index:3}
#lb.open{display:flex;position:absolute;z-index:9;inset:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);animation:sheetIn2 .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes sheetIn2{from{opacity:0;transform:scale(.94)}}
.lb-head{display:flex;align-items:center;gap:8px}
.lb-head .cup{width:32px;height:32px;filter:drop-shadow(0 2px 0 var(--ink))}
.lb-head h2{margin:0;flex:1;font-family:var(--f-display);font-weight:400;font-size:34px;letter-spacing:.03em;color:var(--bone);text-shadow:0 3px 0 var(--ink);line-height:1}
.lb-chat{flex:1 1 260px;min-height:min-content;display:flex}
.lb-chat .gc-list{min-height:70px}
#lb .dbbox,#lb .lb-foot{flex:none}
.lb-chat.gc{font-family:var(--f-text)}
.lb-scroll{flex:0 1 auto;min-height:120px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-right:2px}
.lb-cols,.lb-row{display:grid;grid-template-columns:30px 1fr 44px 44px 46px;align-items:center;gap:6px}
.lb-cols{font-size:11px;color:var(--bone-dim);letter-spacing:.08em;text-transform:uppercase;padding:0 8px}
.lb-cols span:nth-child(n+3),.lb-row span:nth-child(n+3){text-align:right;font-variant-numeric:tabular-nums}
.lb-list{display:flex;flex-direction:column;gap:4px}
.lb-row{background:var(--ink);border-radius:12px;padding:7px 8px 6px;font-size:16px}
.lb-row:nth-child(1){background:linear-gradient(90deg,color-mix(in srgb,var(--gold) 22%,var(--ink)),var(--ink) 70%)}
.lb-row.me{box-shadow:inset 0 0 0 2px var(--torch)}
.lb-row .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-row .nm small{font-size:11px;color:var(--bone-dim);letter-spacing:.06em;margin-left:4px}
.rank{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;color:var(--bone-dim);border:2px solid transparent}
.rank.r1{background:radial-gradient(circle at 35% 30%,#fff2a8,var(--gold));color:#3a2600;border-color:var(--ink)}
.rank.r2{background:radial-gradient(circle at 35% 30%,#fff,#c9d0de);color:#22283a;border-color:var(--ink)}
.rank.r3{background:radial-gradient(circle at 35% 30%,#ffc08a,#c9783a);color:#2e1606;border-color:var(--ink)}
.lb-sub{font-size:13px;color:var(--bone-dim);letter-spacing:.06em;text-transform:uppercase;margin:4px 0 0}
.hist{display:flex;flex-direction:column;gap:3px;font-family:var(--f-text);font-size:13px}
.hist div{display:flex;justify-content:space-between;gap:8px;color:var(--bone-dim);padding:4px 8px;border-radius:8px;background:color-mix(in srgb,var(--ink) 55%,transparent)}
.hist b{color:var(--bone);font-weight:600}
.hist span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-empty{font-family:var(--f-text);font-size:14px;color:var(--bone-dim);line-height:1.45;padding:10px;border-radius:12px;background:var(--ink)}
.lb-foot{display:flex;align-items:center;gap:8px;font-family:var(--f-text);font-size:12px;color:var(--bone-dim);line-height:1.35}
.lb-foot p{margin:0;flex:1}
.lb-foot .btn{font-size:13px;padding:7px 10px 6px;flex:none}
.lb-foot .btn.danger{background:var(--blood);color:#fff}
.dbbox{display:flex;flex-direction:column;gap:7px;background:var(--ink);border-radius:14px;padding:10px;font-family:var(--f-text);font-size:13px;line-height:1.4;color:var(--bone-dim)}
.dbbox .dbt{font-family:var(--f-ui);font-size:14px;color:var(--bone);letter-spacing:.03em;display:flex;align-items:center;gap:8px}
.dbbox .dot{width:9px;height:9px;border-radius:50%;background:var(--bone-dim);flex:none}
.dbbox .dot.on{background:var(--slime);box-shadow:0 0 8px var(--slime)}
.dbbox .dot.off{background:var(--blood)}
.dbbox .row{display:flex;gap:6px}
.dbbox .field{font-family:var(--f-text);font-size:13px;padding:8px 9px;border-width:2px;background:var(--panel);letter-spacing:0;text-transform:none}
.dbbox .btn{font-size:13px;padding:7px 10px 6px;flex:none}
.dbbox details summary{cursor:pointer;color:var(--torch)}
.dbbox ol{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.dbbox code{font-size:11px;color:var(--bone);background:var(--panel);padding:1px 4px;border-radius:4px;word-break:break-all}
.dberr{color:#ff8a96}
.dbbox .link{background:none;border:0;padding:0;color:var(--torch);font:inherit;cursor:pointer;text-decoration:underline;align-self:flex-start}

/* ---------- Chat ---------- */
#chat{display:flex;flex-direction:column;gap:6px;padding:9px;pointer-events:auto;text-align:left}
#chat.float{position:absolute;z-index:7;top:calc(env(safe-area-inset-top,0px) + 96px);left:16px;right:16px;max-width:440px;margin-inline:auto;height:min(44vh,340px);animation:sheetIn2 .25s}
html.pc #chat.float{left:24px;right:auto;width:340px;top:118px;bottom:300px;height:auto;margin:0;min-height:120px;animation:none}
#chat.inline{width:100%;height:220px;box-shadow:none;background:var(--ink);border-radius:16px}
#chat.inline::before{display:none}
#chat.inline .chat-log .msg{background:var(--panel)}
#chat.inline .chat-log .msg.sys{background:none}
.chat-head{display:flex;align-items:center;gap:8px;font-size:15px;letter-spacing:.03em;padding-inline:4px}
.chat-head span{flex:1}
.chat-head .btn{padding:4px}
.chat-head .btn svg{width:16px;height:16px}
html.pc .chat-head .btn,#chat.inline .chat-head .btn{display:none}
.chat-log{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:4px;font-family:var(--f-text);font-size:14px;line-height:1.35;padding-right:2px}
.msg{background:var(--ink);border-radius:12px 12px 12px 4px;padding:5px 9px;max-width:88%;align-self:flex-start;overflow-wrap:anywhere;color:var(--bone);animation:pop .25s}
.msg b{font-weight:700;margin-right:5px}
.msg.mine{align-self:flex-end;background:var(--panel-2);border-radius:12px 12px 4px 12px}
.msg.sys{align-self:center;background:none;color:var(--bone-dim);font-size:12px;padding:0}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.chat-empty{color:var(--bone-dim);font-size:13px;margin:auto;text-align:center}
.chat-quick{display:flex;gap:4px}
.chat-quick button{flex:1;font-size:17px;line-height:1;padding:5px 0;background:var(--ink);border:2px solid var(--ink);border-radius:10px;cursor:pointer;transition:transform .08s}
.chat-quick button:active{transform:scale(.88)}
#chat.inline .chat-quick button{background:var(--panel)}
.chat-form{display:flex;gap:6px}
.chat-form .field{font-family:var(--f-text);font-size:15px;padding:8px 10px;border-width:2px;letter-spacing:0;text-transform:none}
#chat.inline .chat-form .field{background:var(--panel)}
.chat-form .btn{font-size:14px;padding:7px 10px 6px;flex:none}
.medal{margin-right:4px;font-size:15px}
.rkn{margin-right:5px;font-size:11px;color:var(--bone-dim);font-weight:700}
.c0{color:#f3e7c9}.c1{color:#ff7d8b}.c2{color:#9fe6ff}.c3{color:#ffb15a}
#chatPop{position:absolute;z-index:6;left:50%;top:calc(env(safe-area-inset-top,0px) + 100px);transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--panel);border:3px solid var(--ink);border-radius:14px;padding:7px 12px;font-family:var(--f-text);font-size:14px;box-shadow:0 4px 0 var(--ink);cursor:pointer;overflow-wrap:anywhere;animation:pop .25s}

/* ---------- Tutoriel ---------- */
#coach{position:absolute;z-index:8;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 200px);width:min(420px,calc(100% - 24px));display:flex;gap:10px;align-items:flex-start;padding:12px;animation:coachIn .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes coachIn{from{opacity:0;transform:translate(-50%,20px) scale(.9)}}
.coach-face{width:50px;height:50px;flex:none;border-radius:50%;border:3px solid var(--ink);background:radial-gradient(circle at 35% 30%,#4a5f8f,#26304d);display:grid;place-items:center;animation:bob 2s ease-in-out infinite}
.coach-face svg{width:44px;height:44px}
.coach-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
#coachTxt{margin:0;font-family:var(--f-text);font-size:15px;line-height:1.45;color:var(--bone)}
#coachTxt b{color:var(--torch)}
.coach-btns{display:flex;justify-content:flex-end;gap:8px}
.sm-btn{font-size:14px;padding:7px 12px 6px}
html.pc #coach{bottom:auto;top:24px;left:calc(380px + (100% - 750px) / 2)}

/* ---------- Fin de partie ---------- */
#confetti{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
.endpanel{gap:10px}
.hero-wrap{position:relative;width:170px;height:170px;display:grid;place-items:center}
.rays{position:absolute;inset:-30px;border-radius:50%;background:repeating-conic-gradient(color-mix(in srgb,var(--gold) 55%,transparent) 0 12deg,transparent 12deg 30deg);
  -webkit-mask:radial-gradient(circle,#000 30%,transparent 68%);mask:radial-gradient(circle,#000 30%,transparent 68%);animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero.avatar{width:132px;height:132px;border-width:5px;box-shadow:0 7px 0 var(--ink),inset 0 6px 0 rgba(255,255,255,.25),inset 0 -8px 0 rgba(0,0,0,.25);animation:dance 1s ease-in-out infinite}
.hero.avatar svg{width:114px;height:114px}
@keyframes dance{0%,100%{transform:translateY(0) rotate(-6deg)}25%{transform:translateY(-16px) rotate(0) scale(1.05,.97)}50%{transform:translateY(0) rotate(6deg) scale(1.04,.96)}75%{transform:translateY(-10px) rotate(0)}}
.endpanel.lose .rays{display:none}
.endpanel.lose .hero.avatar{filter:grayscale(.85) brightness(.75);animation:droop 2.4s ease-in-out infinite}
@keyframes droop{50%{transform:rotate(8deg) translateY(6px) scale(1,.95)}}
.stars{display:flex;gap:6px;align-items:flex-end;margin-top:-6px}
.stars i{width:38px;height:38px;background:var(--gold);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);filter:drop-shadow(0 3px 0 var(--ink));animation:starPop .5s cubic-bezier(.2,1.8,.4,1) both}
.stars i:nth-child(2){width:50px;height:50px;animation-delay:.18s}.stars i:nth-child(3){animation-delay:.36s}
.stars i:nth-child(1){animation-delay:0s}
@keyframes starPop{from{transform:scale(0) rotate(-90deg)}}
.endpanel.lose .stars i{background:#4a4560}
.banner{position:relative;transform:rotate(-2deg)}
.banner h1{position:relative;z-index:1;margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(30px,9vw,54px);line-height:1;letter-spacing:.03em;color:var(--ink);
  padding:8px 24px 6px;border:3px solid var(--ink);border-radius:10px;background:linear-gradient(180deg,#fff2b0,var(--gold) 55%,#d99a1c);box-shadow:0 5px 0 var(--ink);white-space:nowrap}
.endpanel.lose .banner h1{color:#fff;background:linear-gradient(180deg,#ff8a96,var(--blood) 55%,#9a1a2a);text-shadow:0 3px 0 var(--ink)}
.banner::before,.banner::after{content:"";position:absolute;top:12px;width:34px;height:100%;background:#b07a14;border:3px solid var(--ink);z-index:0}
.endpanel.lose .banner::before,.endpanel.lose .banner::after{background:#7a1422}
.banner::before{left:-22px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,35% 50%)}
.banner::after{right:-22px;clip-path:polygon(0 0,100% 0,65% 50%,100% 100%,0 100%)}
#endSub{margin:6px 0 0;color:var(--bone);font-size:18px;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.endstats{margin:0;font-family:var(--f-text);font-size:13px;color:var(--bone-dim)}
.endpanel .row:last-child{margin-top:2px}

#rotate{display:none;position:absolute;inset:0;background:var(--void);place-items:center;text-align:center;padding:16px;font-size:22px;z-index:20}
#rotate svg{width:72px;height:72px;margin-bottom:12px;color:var(--torch)}
@media (orientation:landscape) and (pointer:coarse) and (max-height:520px){#rotate{display:grid}}

/* ---------- Version PC (grand écran paysage) ---------- */
html.pc #top{left:24px;right:auto;width:340px;padding-inline:0;padding-top:24px;align-items:stretch}
html.pc #bottom{left:24px;right:auto;width:340px;padding-inline:0;padding-bottom:24px;align-items:stretch}
html.pc .card{max-width:none}
html.pc #lb{display:flex;position:absolute;top:24px;right:24px;bottom:24px;width:330px}
html.pc .mobile-only{display:none!important}
html.pc #toast{left:calc(380px + (100% - 750px) / 2);top:14%}
html.pc .screen{right:378px}
html.pc #confetti{width:calc(100% - 378px)}
html:not(.pc) .pc-only{display:none!important}
/* Les barres de jeu s'effacent derrière les écrans d'accueil et de fin */
#top,#bottom{transition:opacity .3s}
html.overlay #top,html.overlay #bottom{opacity:0;pointer-events:none}
html.overlay #top *,html.overlay #bottom *{pointer-events:none!important}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
}
.cpick{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(8,5,18,.72);animation:fadeIn .2s}
.cpick-box{width:min(440px,100%);padding:18px 16px 16px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;background:linear-gradient(180deg,var(--panel,#2a2148),#1a1430);border:4px solid var(--ink);border-radius:22px;box-shadow:0 7px 0 var(--ink)}
.cpick-box h3{margin:0;font-family:var(--f-title,var(--f-ui));font-size:26px;color:var(--bone)}
.cp-wait{margin:0;font-size:14px;color:var(--bone-dim);min-height:1.2em}
.cp-bar{width:100%;height:8px;border-radius:4px;background:rgba(0,0,0,.35);overflow:hidden}
.cp-bar i{display:block;height:100%;width:100%;background:var(--torch);transform-origin:left}
.charpick.big{flex-wrap:nowrap;gap:6px}
.charpick.big button{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--bone);font-family:var(--f-ui);font-size:13px;padding:6px 2px;border-radius:16px;min-width:0;flex:1}
.charpick.big .avatar{width:min(64px,17vw);height:min(64px,17vw)}
.charpick.big button.taken{opacity:.35;filter:grayscale(1);cursor:default}
.charpick.big button small{font-size:12px;color:var(--bone-dim);min-height:1em;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.charpick{display:flex;gap:10px;justify-content:center;margin:-2px 0 4px}
.charpick button{background:none;border:0;padding:3px;cursor:pointer;border-radius:50%;transition:transform .15s}
.charpick .avatar{width:56px;height:56px}
.charpick button[aria-pressed="false"]{opacity:.55;filter:saturate(.6)}
.charpick button[aria-pressed="true"]{transform:scale(1.1)}
.charpick button[aria-pressed="true"] .avatar{box-shadow:0 0 0 4px var(--torch),0 0 16px var(--torch)}
.name-err{color:#ff6b7a;font-weight:700;font-size:14px;margin:4px 2px 2px}.name-err:empty{display:none}.field.need{border-color:#e8394d!important;box-shadow:0 0 0 4px rgba(232,57,77,.4)!important;animation:needShake .4s}@keyframes needShake{0%,100%{transform:none}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
</style>
</head>
<body>

  </defs>
</svg>

<div id="app">
  <canvas id="c" data-i18n-aria="canvas" aria-label="Plateau de jeu"></canvas>
  <div id="vignette"></div>

  <div class="bar" id="top">

      <div class="tools">

        <button class="btn icon sm" id="bTheme" data-i18n-aria="settings" aria-label="Réglages">
          <svg viewBox="0 0 24 24"><path d="M12 2.5l2 2.6 3.2-.6.8 3.1 3 1.4-1.1 3 1.1 3-3 1.4-.8 3.1-3.2-.6-2 2.6-2-2.6-3.2.6-.8-3.1-3-1.4 1.1-3-1.1-3 3-1.4.8-3.1 3.2.6z" fill="currentColor" stroke="#0c0816" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12" r="3.3" fill="#0c0816"/></svg>
        </button>

    </div>
  </div>

  <div id="themeMenu" class="sheet" hidden>

    </div>
    <button class="btn wide gold mobile-only" id="bLb"><svg class="ico" viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0z" fill="currentColor" stroke="#0c0816" stroke-width="1.8"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 14v3M8 21h8l-1-4H9z" fill="none" stroke="#0c0816" stroke-width="1.8" stroke-linejoin="round"/></svg><span data-i18n="lbTitle">Classement</span></button>

              <svg class="bico" viewBox="0 0 24 24"><rect x="5" y="7" width="14" height="12" rx="3" fill="currentColor" stroke="#0c0816" stroke-width="2"/><circle cx="9.5" cy="12.5" r="1.6" fill="#0c0816"/><circle cx="14.5" cy="12.5" r="1.6" fill="#0c0816"/><path d="M12 7V4M10 4h4" stroke="#0c0816" stroke-width="2" stroke-linecap="round"/></svg>
              <span data-i18n="vsAI">Contre l'IA</span>
            </button>
            <button class="btn tile" id="bLocal">
              <svg class="bico" viewBox="0 0 24 24"><circle cx="8" cy="8" r="3.3" fill="currentColor" stroke="#0c0816" stroke-width="1.8"/><circle cx="16" cy="8" r="3.3" fill="currentColor" stroke="#0c0816" stroke-width="1.8"/><path d="M2.5 20c.5-4 2.6-6 5.5-6s5 2 5.5 6zM10.5 20c.5-4 2.6-6 5.5-6s5 2 5.5 6z" fill="currentColor" stroke="#0c0816" stroke-width="1.8" stroke-linejoin="round"/></svg>

        </section>
        <p id="lobbyErr" role="alert"></p>
      </div>
      <div class="lobby frame wait" id="lobbyWait" hidden>
        <div id="hostCodeBox" class="wait">
          <label data-i18n="gameCode">Code de la partie</label>
          <div class="bigcode" id="codeShow">·····</div>
          <button class="btn" id="bCopy" data-i18n="copyCode">Copier le code</button>

    g.fillStyle = '#fffaf0'; g.strokeStyle = '#0c0816'; g.lineWidth = 7;
    g.beginPath(); g.arc(64, 56, 44, 0, Math.PI * 2); g.fill(); g.stroke();
    g.beginPath(); g.moveTo(50, 94); g.lineTo(64, 120); g.lineTo(76, 94); g.closePath(); g.fill(); g.stroke();

const emotes = [];
function emote(i, ch) {
  if (!pawns[i] || !pawns[i].root.visible) return;
  const old = emotes.find(e => e.i === i); if (old) { scene.remove(old.s); emotes.splice(emotes.indexOf(old), 1); }
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: emoteTexture(ch), depthTest: false, transparent: true }));

}
function updateEmotes(dt) {
  for (let k = emotes.length - 1; k >= 0; k--) {
    const e = emotes[k]; e.t += dt;
    const p = pawns[e.i].root.position;
    const pop = e.t < 0.25 ? 1 - Math.pow(1 - e.t / 0.25, 3) * (1 - Math.sin(e.t * 25) * 0.15) : 1;
    const sc = 0.95 * pop;
    e.s.scale.set(sc, sc, 1);
    e.s.position.set(p.x, p.y + 1.55 + Math.sin(e.t * 4) * 0.04, p.z);
    e.s.material.opacity = e.t > 1.6 ? Math.max(0, 1 - (e.t - 1.6) / 0.4) : 1;
    if (e.t > 2) { scene.remove(e.s); e.s.material.dispose(); emotes.splice(k, 1); }

// Poussière et éclats (os qui tombent, atterrissages)
const FXN = 160;
const fxGeo = new THREE.BufferGeometry();
const fxPos = new Float32Array(FXN * 3).fill(-999), fxCol = new Float32Array(FXN * 3);
fxGeo.setAttribute('position', new THREE.BufferAttribute(fxPos, 3));
fxGeo.setAttribute('color', new THREE.BufferAttribute(fxCol, 3));
const dotTex = canvasTex(32, (g) => { const r = g.createRadialGradient(16, 16, 2, 16, 16, 15); r.addColorStop(0, '#fff'); r.addColorStop(0.6, 'rgba(255,255,255,.8)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, 32, 32); });
const fxMat = new THREE.PointsMaterial({ size: 9, sizeAttenuation: false, vertexColors: true, map: dotTex, transparent: true, depthWrite: false });
const fxPts = new THREE.Points(fxGeo, fxMat); fxPts.frustumCulled = false; scene.add(fxPts);
const fx = Array.from({ length: FXN }, () => ({ life: 0 }));
let fxNext = 0;
function burst(x, y, z, n, color, speed = 2.2, up = 2) {
  const c = new THREE.Color(color);
  for (let k = 0; k < n; k++) {
    const p = fx[fxNext]; fxNext = (fxNext + 1) % FXN;
    const a = Math.random() * Math.PI * 2, v = speed * (0.4 + Math.random() * 0.6);
    Object.assign(p, { x, y, z, vx: Math.cos(a) * v, vy: up * (0.5 + Math.random()), vz: Math.sin(a) * v, life: 0.5 + Math.random() * 0.4, max: 0.9, r: c.r, g: c.g, b: c.b });

}
function updateFx(dt) {
  for (let k = 0; k < FXN; k++) {
    const p = fx[k];
    if (p.life <= 0) { fxPos[k * 3 + 1] = -999; continue; }
    p.life -= dt; p.vy -= 6 * dt; p.vx *= 0.96; p.vz *= 0.96;
    p.x += p.vx * dt; p.y = Math.max(0.02, p.y + p.vy * dt); p.z += p.vz * dt;
    const f = Math.max(0, p.life / p.max);
    fxPos[k * 3] = p.x; fxPos[k * 3 + 1] = p.y; fxPos[k * 3 + 2] = p.z;
    fxCol[k * 3] = p.r * f; fxCol[k * 3 + 1] = p.g * f; fxCol[k * 3 + 2] = p.b * f;
  }

}

// Animation des personnages : respiration, clignement, réactions
function animatePawns(t, dt) {
  const amp = REDUCED ? 0.3 : 1;
  pawns.forEach((p, i) => {
    const b = p.body, c = MESH.indexOf(p); // animation propre au personnage (pas au siège)
    b.position.set(0, 0, 0); b.rotation.set(0, 0, 0); b.scale.set(1, 1, 1);
    if (c === 0) { b.position.y = (0.05 + Math.sin(t * 3.2) * 0.06) * amp; b.rotation.z = Math.sin(t * 1.6) * 0.08 * amp; p.jaw.rotation.x = 0; }
    if (c === 1) {
      b.position.y = Math.abs(Math.sin(t * 2.4)) * 0.05 * amp;
      b.scale.set(1 + Math.sin(t * 4.8) * 0.03 * amp, 1 - Math.sin(t * 4.8) * 0.03 * amp, 1);
      b.rotation.y = Math.sin(t * 0.9) * 0.25 * amp;
      p.arms.forEach((a, k) => { a.rotation.z = Math.sin(t * 3 + k * Math.PI) * 0.25 * amp; });
      p.brows.forEach((br, k) => { br.rotation.z = (k ? -1 : 1) * -0.35; });
    }
    if (c === 2) {
      b.position.y = (0.12 + Math.sin(t * 2.1) * 0.09) * amp; b.rotation.z = Math.sin(t * 1.3) * 0.1 * amp;
      p.arms.forEach((a, k) => { a.position.y = 0.52 + Math.sin(t * 3 + k) * 0.04; });
    }
    if (c === 3) {
      b.position.y = Math.max(0, Math.sin(t * 3.6)) * 0.04 * amp; b.rotation.y = Math.sin(t * 1.1) * 0.18 * amp;
      p.glow.color.setHSL(0.13, 1, 0.55 + Math.sin(t * 9) * 0.06 + (Math.random() - 0.5) * 0.04);
    }
    // clignement des yeux
    p.blinkAt -= dt;
    const blink = p.blinkAt < 0 ? Math.max(0.1, Math.abs(p.blinkAt + 0.07) / 0.07) : 1;
    if (p.blinkAt < -0.14) p.blinkAt = 2 + Math.random() * 3.5;
    p.eyes.forEach(e => { e.scale.y = blink; });
    // réactions
    const r = p.react; if (!r) return;
    r.t += dt;
    const k = r.t;
    if (r.type === 'land') {
      if (k < 0.28) { const s = Math.sin(Math.PI * k / 0.28); b.scale.y *= 1 - 0.22 * s; b.scale.x *= 1 + 0.14 * s; b.scale.z *= 1 + 0.14 * s; } else p.react = null;
    } else if (r.type === 'happy') {
      if (k < 0.7) { b.position.y += Math.sin(Math.PI * k / 0.7) * 0.35; b.rotation.y += Math.PI * 2 * (k / 0.7); if (p.jaw) p.jaw.rotation.x = Math.abs(Math.sin(k * 30)) * 0.4; } else p.react = null;
    } else if (r.type === 'angry') {
      if (k < 0.9) {
        const f = 1 - k / 0.9; b.rotation.z += Math.sin(k * 45) * 0.18 * f; b.scale.multiplyScalar(1 + 0.08 * f);
        if (p.brows) p.brows.forEach((br, j) => { br.rotation.z = (j ? 1 : -1) * 0.7; });
        if (p.jaw) p.jaw.rotation.x = Math.abs(Math.sin(k * 40)) * 0.35;
        p.eyes.forEach(e => { e.scale.y = 0.6; });
      } else p.react = null;
    } else if (r.type === 'win') {
      b.position.y += Math.abs(Math.sin(k * 6)) * 0.4; b.rotation.y += k * 3;
      if (p.jaw) p.jaw.rotation.x = Math.abs(Math.sin(k * 12)) * 0.4;
      if (p.arms) p.arms.forEach((a, j) => { a.rotation.z = (j ? -1 : 1) * (1.6 + Math.sin(k * 12) * 0.4); });
    } else if (r.type === 'sad') {
      b.scale.y *= 0.86; b.rotation.x += 0.3; b.position.y -= 0.03;
      p.eyes.forEach(e => { e.scale.y = 0.5; });
    }
  });
}

/* =========================================================
   RENDU / BOUCLE
   ========================================================= */
function resize() {
  const W = window.innerWidth, H = window.innerHeight;
  const pc = PC_MQ.matches;
  document.documentElement.classList.toggle('pc', pc);
  // Résolution plafonnée (~1080p de pixels rendus) puis réduite selon la qualité
  let pr = Math.min(DPR, 1.5);
  pr = Math.min(pr, Math.sqrt(2.1e6 / (W * H)));
  pr = Math.max(0.5, pr * QUALITY[QS.tier].scale);
  renderer.setPixelRatio(pr);
  renderer.setSize(W, H, false);
  // Zones d'écran occupées par l'interface : le plateau se centre dans ce qui reste
  let l = 0, r = 0, t = 0, b = 0;
  if (pc) { l = 24 + 340 + 16; r = 24 + 330 + 16; t = 16; b = 16; }
  else { t = $('#top').offsetHeight; b = $('#bottom').offsetHeight; }
  const uw = Math.max(160, W - l - r), uh = Math.max(140, H - t - b);
  const scale = Math.max(11.3 / uw, 10.0 / uh); // unités monde par pixel
  const halfW = W * scale / 2, halfH = H * scale / 2;
  const cx = (l - r) / 2 * scale, cy = (b - t) / 2 * scale;
  camera.left = -halfW - cx; camera.right = halfW - cx; camera.top = halfH - cy; camera.bottom = -halfH - cy;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

const tweens = [];
function tween(dur, update, done) { tweens.push({ t: 0, dur, update, done }); }
let shake = 0;
const flash = new Float32Array(81);
const M4 = new THREE.Matrix4(), Q = new THREE.Quaternion(), V3 = new THREE.Vector3(), ONE = new THREE.Vector3(1, 1, 1), YAX = new THREE.Vector3(0, 1, 0);
const GREEN = new THREE.Color(0x6dff9a), RED = new THREE.Color(0xff3347), TMP = new THREE.Color();

function updateWalls(dt) {
  for (let i = 0; i < walls.length; i++) {
    const w = walls[i];
    if (!w.settled) {
      w.vy -= 34 * dt; w.y += w.vy * dt;
      if (w.y <= 0) {
        w.y = 0;
        if (!w.hit) {
          w.hit = true; w.vy = -w.vy * 0.22; shake = REDUCED ? 0.05 : 0.22; SFX.bones(); SFX.thud();
          const cx = w.x + 0.5, cz = w.z + 0.5, along = w.o === 'h' ? [1, 0] : [0, 1];
          for (const s of [-0.7, 0, 0.7]) burst(cx + along[0] * s, 0.1, cz + along[1] * s, 8, 0xc9bfa6, 2.2, 1.6);
          burst(cx, 0.2, cz, 8, 0xfff4d6, 3, 2.5);
        }
        else { w.vy = 0; w.settled = true; }
      }
    }
    Q.setFromAxisAngle(YAX, w.o === 'v' ? Math.PI / 2 : 0);
    M4.compose(V3.set(w.x + 0.5, 0.2 + w.y, w.z + 0.5), Q, ONE);
    bones.setMatrixAt(i, M4); bonesOut.setMatrixAt(i, M4);
  }
  bones.count = bonesOut.count = walls.length;
  bones.instanceMatrix.needsUpdate = bonesOut.instanceMatrix.needsUpdate = true;
}
function updateGlows(t, dt) {
  let n = 0;
  const put = (x, z, col, k) => {
    M4.makeTranslation(x, 0.012, z); glows.setMatrixAt(n, M4);
    TMP.copy(col).multiplyScalar(k); glows.setColorAt(n, TMP); n++;
  };
  if (mode === 'move' && canAct()) {
    const k = 0.55 + 0.3 * Math.sin(t * 4);
    for (const m of validMoves(S, actor())) put(m.x, m.z, GREEN, k);
  }
  for (let id = 0; id < 81; id++) if (flash[id] > 0) {
    flash[id] -= dt;
    put(id % 9, id / 9 | 0, RED, Math.sin(flash[id] * 28) > 0 ? 1.1 : 0.3);
  }
  glows.count = n;
  glows.instanceMatrix.needsUpdate = true;
  if (glows.instanceColor) glows.instanceColor.needsUpdate = true;
}

function applyQuality() {
  const q = QUALITY[QS.tier];
  if (q.shadow !== null) {
    if (renderer.shadowMap.type !== q.shadow && moon.shadow.map) { moon.shadow.map.dispose(); moon.shadow.map = null; }
    renderer.shadowMap.type = q.shadow;
  }
  moon.castShadow = q.shadow !== null;
  torches.forEach((tc, i) => { tc.light.visible = q.torches === 4 || i === 0 || i === 3; });
  scene.traverse(o => { if (o.material) o.material.needsUpdate = true; });
  QS.acc = 0; QS.n = 0; QS.wait = 2;
  resize();
  renderQualityPicker();
}
function setQualityMode(m) {
  QS.mode = m; try { localStorage.setItem('qd-quality', m); } catch (e) {}
  QS.tier = m === 'auto' ? 0 : +m;
  applyQuality();
}
// Mesure la fluidité réelle ; en auto, baisse d'un cran sous ~45 images/s
function watchQuality(raw) {
  if (QS.mode !== 'auto' || QS.tier >= 2 || document.hidden) return;
  if (QS.wait > 0) { QS.wait -= raw; return; }
  if (raw > 1.5) return; // onglet en pause, chargement…
  QS.acc += raw; QS.n++;
  if (QS.acc >= 1.5) {
    if (QS.acc / QS.n > 1 / 45) { QS.tier++; applyQuality(); }
    else { QS.acc = 0; QS.n = 0; }
  }
}
function renderQualityPicker() {
  const box = $('#qualSeg'); if (!box) return;
  const opts = [['auto', tr('qAuto')], ['0', tr('qHigh')], ['1', tr('qMed')], ['2', tr('qLow')]];
  box.innerHTML = opts.map(([k, l]) => `<button class="btn" data-q="${k}" aria-pressed="${QS.mode === k}">${l}</button>`).join('');
  const note = $('#qualNote');
  if (note) note.textContent = QS.mode === 'auto' ? tr('qNow', { q: tr('qNames')[QS.tier] }) : '';
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-q]');
  if (b) { SFX.wood(); setQualityMode(b.dataset.q); }
});

const clock = new THREE.Clock();
let pendingMove = null;
function frame() {
  const raw = clock.getDelta(), dt = Math.min(raw, 0.05), t = clock.elapsedTime;
  watchQuality(raw);
  if (pendingMove) { const e = pendingMove; pendingMove = null; updateGhost(e); }
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i]; tw.t += dt;
    const k = Math.min(1, tw.t / tw.dur); tw.update(k);
    if (k >= 1) { tweens.splice(i, 1); tw.done && tw.done(); }
  }
  animatePawns(t, dt); updateTags(t); updateEmotes(dt); updateFx(dt);
  candleFlames.forEach(c => { c.m.scale.y = 1 + Math.sin(t * 11 + c.ph) * 0.2 + (Math.random() - 0.5) * 0.15; });
  torches.forEach((tc, i) => {
    const f = Math.sin(t * 13 + tc.ph) * 0.12 + Math.sin(t * 7.7 + tc.ph * 2) * 0.1 + (Math.random() - 0.5) * 0.12;
    tc.light.intensity = 1.25 + f * 1.6;
    tc.flame.scale.set(1 - f * 0.3, 1 + f * 1.2, 1 - f * 0.3);
    tc.core.scale.y = 1 + f;
  });
  for (let i = 0; i < EMB; i++) {
    embPos[i * 3 + 1] += embSpd[i] * dt;
    embPos[i * 3] += Math.sin(t + i) * dt * 0.1;
    if (embPos[i * 3 + 1] > 4.5) embPos[i * 3 + 1] = -0.8;
  }
  embGeo.attributes.position.needsUpdate = true;
  updateWalls(dt);
  updateGlows(t, dt);
  if (!started) { // menu : la caméra tourne lentement autour du plateau
    const a = t * 0.12, dir = CAM_DIR.clone().applyAxisAngle(YAX, a);
    camBase.copy(TARGET).addScaledVector(dir, 22); camera.position.copy(camBase); camera.lookAt(TARGET);
    pawns.forEach(p => { p.root.rotation.y = a; });
  }
  if (shake > 0) {
    shake = Math.max(0, shake - dt * 1.1);
    const s = shake * shake * 1.6;
    camera.position.set(camBase.x + (Math.random() - 0.5) * s, camBase.y + (Math.random() - 0.5) * s, camBase.z + (Math.random() - 0.5) * s);
  } else camera.position.copy(camBase);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* =========================================================
   RELAIS FIREBASE : remplace la connexion directe PeerJS quand c'est possible.
   Les messages passent par la base (dossier rooms/CODE), donc ça marche entre
   n'importe quels réseaux (4G, Wi-Fi, pays différents). Même interface que PeerJS.
   ========================================================= */
const SV = { '.sv': 'timestamp' };
// Tolérances larges : sur téléphone, l'hôte passe souvent sur WhatsApp pour envoyer le code
const FB_JOIN_MS = 10 * 60 * 1000; // une partie reste rejoignable 10 min sans signe de vie
const FB_GONE_MS = 90 * 1000;      // en cours de partie, absent 90 s = parti
async function fbReq(path, method, body) {
  const r = await fetch(DB.url + path + '.json', { method: method || 'GET', cache: 'no-store', body: body === undefined ? undefined : JSON.stringify(body) });
  if (r.status === 401 || r.status === 403) { const e = new Error('denied'); e.denied = true; throw e; }
  if (!r.ok) throw new Error('http ' + r.status);
  return r.json();
}
// État d'une partie : 'live' (hôte présent sur la base), 'none', 'denied' (règles sans « rooms »), 'err'
async function fbHostStatus(code) {
  if (!DB.url) return 'denied';
  try {
    const me = await fbReq(`/rooms/${code}/probe`, 'PUT', { t: SV });
    const h = await fbReq(`/rooms/${code}/host`);
    return h && typeof h.t === 'number' && me.t - h.t < FB_JOIN_MS ? 'live' : 'none';
  } catch (e) { return e.denied ? 'denied' : 'err'; }
}
class Emitter {

  on(e, f) { (this.h[e] = this.h[e] || []).push(f); }
  emit(e, a) { (this.h[e] || []).slice().forEach(f => { try { f(a); } catch (err) { console.error(err); } }); }
}

  send(m) { if (this.open && !this.closed) this.peer._send(this.remote, m); }
  close() { this._end(true); }
  _end(local) {
    if (this.closed) return;
    this.closed = true; this.open = false;
    this.peer._dropConn(this, local);
    this.emit('close');
  }
}

    this.conns = {}; this.seen = new Set(); this.timers = []; this.streams = []; this.queue = Promise.resolve(); this.out = {}; this.done = {};
    this.destroyed = false; this.now = 0;
    setTimeout(() => this._init(), 0);
  }
  async _init() {
    try {
      if (this.role === 'host') {
        await fbReq(this.base, 'DELETE');
        this.now = (await fbReq(this.base + '/host', 'PUT', { t: SV })).t;
        this._listen(this.base + '/up');
        this.timers.push(setInterval(() => this._hostBeat(), 5000));
      }
      if (!this.destroyed) this.emit('open', this.id);
    } catch (e) { this.emit('error', { type: e.denied ? 'fb-denied' : 'network' }); }
  }
  async _hostBeat() {
    if (this.destroyed) return;
    try {
      this.now = (await fbReq(this.base + '/host', 'PUT', { t: SV })).t;
      const hb = (await fbReq(this.base + '/hb')) || {};
      for (const [id, c] of Object.entries(this.conns)) {
        const b = hb[id];
        if (!b || this.now - b.t > FB_GONE_MS) c._end(false); // invité parti sans prévenir
      }
    } catch (e) {}
  }
  connect() {

    this._join(c);
    return c;
  }
  async _join(c) {

      const me = await fbReq(`${this.base}/hb/${this.id}`, 'PUT', { t: SV });
      const h = await fbReq(this.base + '/host');
      if (!h || me.t - h.t > FB_JOIN_MS) { this.emit('error', { type: 'peer-unavailable' }); return; }
      this._listen(`${this.base}/down/${this.id}`);
      this._post(this.base + '/up', { f: this.id, k: 'c' });
        // si la demande se perd, on la renvoie jusqu'à la réponse de l'hôte
        { let n = 0; const rt = setInterval(() => { if (this.destroyed || (this.conns.host && this.conns.host.open) || ++n > 6) { clearInterval(rt); return; } this._post(this.base + '/up', { f: this.id, k: 'c' }); }, 2500); this.timers.push(rt); }
      this.timers.push(setInterval(async () => {
        if (this.destroyed) return;
        try {
          const t = (await fbReq(`${this.base}/hb/${this.id}`, 'PUT', { t: SV })).t;
          const hh = await fbReq(this.base + '/host');
          if (c.open && (!hh || t - hh.t > FB_GONE_MS)) c._end(false); // l'hôte a disparu
        } catch (e) {}
      }, 5000));
    } catch (e) { this.emit('error', { type: 'network' }); }
  }
  // Envois dans l'ordre (la base range les messages par ordre d'arrivée)
  // Au retour sur l'onglet : signe de vie immédiat
  wake() {
    if (this.destroyed) return;
    if (this.role === 'host') this._hostBeat();
    else fbReq(`${this.base}/hb/${this.id}`, 'PUT', { t: SV }).catch(() => {});
  }
  // Envoi groupé : une file par destination (les joueurs reçoivent en parallèle) ;
  // les messages qui s'accumulent pendant une requête partent ensemble dans la suivante.
  _post(path, body) {
    const q = this.out[path] || (this.out[path] = { list: [], busy: false });
    q.list.push(body);
    if (!q.busy) this.queue = this._flush(path);
    return this.queue;
  }
  async _flush(path) {
    const q = this.out[path]; if (!q || q.busy) return; q.busy = true;
    try {
      while (q.list.length) {
        const batch = q.list.splice(0, 80);
        const body = batch.length === 1 ? batch[0] : { k: 'n', f: batch[0].f, l: batch };
        try { await fbReq(path, 'POST', body); } catch (e) { try { await fbReq(path, 'POST', body); } catch (e2) {} }
      }
    } finally { q.busy = false; }
  }
  // Ménage : on efface de la base les messages déjà lus (sinon la salle grossit et tout ralentit)
  _clean() {
    for (const [path, keys] of Object.entries(this.done)) {
      if (!keys.length) continue;
      const patch = {}; keys.splice(0, 200).forEach(k => { patch[k] = null; });
      fbReq(path, 'PATCH', patch).catch(() => {});
    }
  }
  _send(to, m) {
    const d = JSON.stringify(m);
    if (this.role === 'host') this._post(`${this.base}/down/${to}`, { k: 'm', d });
    else this._post(this.base + '/up', { f: this.id, k: 'm', d });
  }
  _dropConn(c, local) {
    if (this.conns[c.remote] === c) delete this.conns[c.remote];
    if (!local || this.destroyed) return;
    if (this.role === 'host') this._post(`${this.base}/down/${c.remote}`, { k: 'b' });
    else this._post(this.base + '/up', { f: this.id, k: 'b' });
  }
  _listen(path) {
    let opened = false, lastKey = '';
    const done = this.done[path] = []; if (!this._cleanT) { this._cleanT = setInterval(() => this._clean(), 4000); this.timers.push(this._cleanT); }
    const handle = (key, m) => { if (key > lastKey) lastKey = key; if (m && !this.seen.has(key)) done.push(key); this._msg(key, m); };
    const onEvt = ev => {
      opened = true;
      let p; try { p = JSON.parse(ev.data); } catch (e) { return; }
      if (!p) return;
      if (p.path === '/') { if (p.data && typeof p.data === 'object') Object.keys(p.data).sort().forEach(k => handle(k, p.data[k])); }
      else { const k = p.path.slice(1); if (!k.includes('/') && p.data) handle(k, p.data); }
    };
    // Flux temps réel ; si le navigateur le refuse, on interroge la base toutes les secondes
    const poll = () => {
      const tick = async () => {
        if (this.destroyed) return;
        try {
          const q = lastKey ? `?orderBy="$key"&startAt="${lastKey}"` : '';
          const r = await fetch(DB.url + path + '.json' + q, { cache: 'no-store' });
          const data = r.ok ? await r.json() : null;
          if (data && typeof data === 'object') Object.keys(data).sort().forEach(k => handle(k, data[k]));
        } catch (e) {}
      };
      tick(); this.timers.push(setInterval(tick, 1000));
    };
    if (typeof EventSource === 'undefined') { poll(); return; }
    const es = new EventSource(DB.url + path + '.json');
    this.streams.push(es);
    es.addEventListener('put', onEvt);
    es.addEventListener('patch', onEvt);
    es.onerror = () => { if (!opened || es.readyState === 2) { es.close(); poll(); } }; // flux coupé pour de bon : on passe en relecture
  }
  _msg(key, m) {
    if (this.seen.has(key) || !m || typeof m !== 'object') return;
    this.seen.add(key);
    if (m.k === 'n' && Array.isArray(m.l)) { m.l.forEach(x => { if (x && typeof x === 'object') this._one(Object.assign({ f: m.f }, x)); }); return; }
    this._one(m);
  }
  _one(m) {
    let d; if (typeof m.d === 'string') { try { d = JSON.parse(m.d); } catch (e) { return; } }
    if (this.role === 'host') {
      const f = String(m.f || '');
      if (!/^g[a-z0-9]{1,12}$/.test(f)) return;
      if (m.k === 'c') {
        if (this.conns[f]) { if (this.conns[f].open) this._post(`${this.base}/down/${f}`, { k: 'o' }); return; } // demande répétée : on redit « ok »
        const c = new FbConn(this, f); c.open = true; this.conns[f] = c;
        this.emit('connection', c);
        this._post(`${this.base}/down/${f}`, { k: 'o' });
        setTimeout(() => c.emit('open'), 0);
      } else if (m.k === 'm' && this.conns[f]) this.conns[f].emit('data', d);
      else if (m.k === 'b' && this.conns[f]) this.conns[f]._end(false);
    } else {
      const c = this.conns.host; if (!c) return;
      if (m.k === 'o' && !c.open) { c.open = true; c.emit('open'); }
      else if (m.k === 'm' && c.open) c.emit('data', d);
      else if (m.k === 'b') c._end(false);
    }
  }
  reconnect() {}
  destroy() {
    if (this.destroyed) return;
    Object.values(this.conns).forEach(c => c.close());
    this.destroyed = true;
    this.timers.forEach(clearInterval); this.streams.forEach(s => s.close());
    const base = this.base, id = this.id, role = this.role;
    this.queue.then(() => role === 'host' ? fbReq(base, 'DELETE') : fbReq(`${base}/hb/${id}`, 'DELETE')).catch(() => {});
  }
}

function hostLobbyUpdate() {

// L'hôte lance : chacun choisit son personnage (premier arrivé, premier servi), puis la partie démarre
let HP = null; // { n, picks: { siège: perso }, deadline }
function hostStart(n) {
  const humans = net.roster;
  if (humans.length < 2 || humans.length > n || (n === 2 && humans.length !== 2)) return;
  humans.forEach((r, i) => { r.seat = i; });
  HP = { n, picks: {}, deadline: Date.now() + PICK_MS };
  clearTimeout(HP.t); HP.t = setTimeout(() => { if (HP) hostLaunch(); }, PICK_MS + 200);
  hostPickSync();
}
function hostPickSync() {
  const taken = {}; Object.keys(HP.picks).forEach(s => { taken[HP.picks[s]] = (net.roster[s] || {}).name || '?'; });
  for (const r of net.roster) if (r.conn) try { r.conn.send({ t: 'pick', taken, mine: HP.picks[r.seat], left: HP.deadline - Date.now(), all: Object.keys(HP.picks).length >= net.roster.length }); } catch (e) {}
  showPick({ title: tr('pickTitle'), taken, mine: HP.picks[0], waiting: true, deadline: HP.deadline, onPick: ch => hostPickTry(0, ch) });
  if (Object.keys(HP.picks).length >= net.roster.length) setTimeout(() => { if (HP) hostLaunch(); }, 700);
}
function hostPickTry(seat, ch) {
  if (!HP || ![0, 1, 2, 3].includes(ch) || HP.picks[seat] !== undefined) return;
  if (Object.values(HP.picks).includes(ch)) return; // déjà pris
  HP.picks[seat] = ch; hostPickSync();
}
function hostLaunch() {
  if (!HP) return;
  const n = HP.n, pref = []; Object.keys(HP.picks).forEach(s => { pref[s] = HP.picks[s]; });
  clearTimeout(HP.t); HP = null; hidePick();
  const humans = net.roster;
  if (humans.length < 2) return;
  net.gameNo++;
  const nm = [], bt = [];
  const lk = computeLooks(pref);
  for (let s = 0; s < n; s++) { const r = humans.find(h => h.seat === s); nm[s] = r ? r.name : CHAR[lk[s]].bot; bt[s] = !r; }
  for (const r of humans) if (r.conn) try { r.conn.send({ t: 'start', n, looks: lk, names: nm, bots: bt, seat: r.seat, sess: net.sess, game: net.gameNo, list: matches.slice(-500), db: DB.url }); } catch (e) {}
  beginGame(n, nm, bt, 0, lk);
}
function hostLost(entry) {
  const i = net.roster.indexOf(entry);
  if (i < 0 || net.mode !== 'host') return;
  net.roster.splice(i, 1);
  if (entry.name) { const m = { t: 'chat', sys: 'left', name: entry.name }; chatAdd(m); broadcast(m); }
  if (!started) { if (HP) { clearTimeout(HP.t); HP = null; hidePick(); broadcast({ t: 'pickcancel' }); } hostLobbyUpdate(); return; }
  if (S.n === 2 || net.roster.length < 2) { backToMenu(tr('leftGame', { name: entry.name })); SFX.buzz(); return; }
  bots[entry.seat] = true;
  broadcast({ t: 'bot', s: entry.seat, name: entry.name });
  toast(tr('replaced', { name: entry.name, bot: LK(entry.seat).bot }));
  ui(); maybeAI();
}
function hostData(entry, msg) {
  if (!msg || typeof msg !== 'object') return;
  if (msg.t === 'hello') {
    if (started || net.roster.length >= 4) { try { entry.conn.send({ t: 'full', why: started ? 'started' : 'full' }); } catch (e) {} setTimeout(() => entry.conn.close(), 300); return; }
    entry.name = String(msg.name || 'Ami').slice(0, 14);
    entry.ch = [0, 1, 2, 3].includes(msg.ch) ? msg.ch : undefined;
    net.roster.push(entry);
    mergeMatches(msg.list); adoptDb(msg.db);
    SFX.wood(); hostLobbyUpdate();
    try { entry.conn.send({ t: 'chatlog', list: CH.log.slice(-30).map(chatStrip) }); } catch (e) {}
    const jm = { t: 'chat', sys: 'join', name: entry.name }; chatAdd(jm); broadcast(jm, entry.conn);
  } else if (msg.t === 'pickc') {
    if (HP) hostPickTry(entry.seat, msg.ch | 0);
  } else if (msg.t === 'act') {
    if (!S || entry.seat !== msg.s) return;
    inbox.push({ s: msg.s, k: msg.k, x: msg.x, z: msg.z, o: msg.o, _from: entry.conn });
    pumpInbox();
  } else if (msg.t === 'hist') mergeMatches(msg.list);
  else if (msg.t === 'chat' && net.roster.includes(entry)) {
    const now = Date.now(); entry.ct = (entry.ct || []).filter(x => now - x < 4000);
    if (entry.ct.length >= 6) return; // anti-spam
    entry.ct.push(now);
    const text = String(msg.text || '').trim().slice(0, 160); if (!text) return;
    const m = { t: 'chat', name: entry.name, s: started ? entry.seat : net.roster.indexOf(entry), text };
    chatAdd(m); broadcast(m, entry.conn);
  }
}
$('#bHost').addEventListener('click', () => {
  unlockAudio(); SFX.wood(); saveName(); lobbyErr('');

  let useFb = !!DB.url;
  if (!useFb && peerMissing()) return;
  lobbyLock(true); closeNet();
  const tryOpen = attempt => {
    const code = genCode();
    const peer = useFb ? new FbPeer(code, 'host') : new Peer(PREFIX + code);
    net.peer = peer; net.code = code; net.mode = 'host'; net.sess = Date.now().toString(36);
    net.roster = [{ name: myName(), conn: null, seat: 0 }];
    peer.on('open', () => {
      if (window.Party) Party.announce('qd', code);
      $('#codeShow').textContent = code;
      $('#lobbyForm').hidden = true; $('#lobbyWait').hidden = false;
      hostLobbyUpdate(); chatLayout();
    });
    peer.on('error', err => {
      if (err && err.type === 'fb-denied' && useFb) { try { peer.destroy(); } catch (e) {} useFb = false; if (peerMissing()) { lobbyLock(false); return; } tryOpen(attempt); return; }
      if (err && err.type === 'unavailable-id' && attempt < 4) { try { peer.destroy(); } catch (e) {} tryOpen(attempt + 1); return; }
      if (err && err.type === 'peer-unavailable') return;
      if (net.roster.length > 1) return;
      backToMenu(tr('createFail', { err: err && err.type || tr('netErr') }));
    });
    peer.on('connection', conn => {
      const entry = { conn, name: '', seat: -1 };
      conn.on('data', msg => hostData(entry, msg));
      conn.on('close', () => hostLost(entry));
      conn.on('error', () => hostLost(entry));
    });
    peer.on('disconnected', () => { try { if (!peer.destroyed) peer.reconnect(); } catch (e) {} });
  };
  tryOpen(0);
});

// --- Invité ---
function guestData(msg) {
  if (!msg || typeof msg !== 'object') return;
  switch (msg.t) {
    case 'lobby':
      $('#lobbyForm').hidden = true; $('#lobbyWait').hidden = false; lobbyErr(''); chatLayout();
      renderRoster(Array.isArray(msg.names) ? msg.names.slice(0, 4).map(n => String(n).slice(0, 14)) : [], false);
      break;
    case 'pick': {
      const taken = {}; if (msg.taken && typeof msg.taken === 'object') Object.keys(msg.taken).forEach(k => { if (['0', '1', '2', '3'].includes(k)) taken[k] = String(msg.taken[k]).slice(0, 14); });
      const mine = [0, 1, 2, 3].includes(msg.mine) ? msg.mine : undefined;
      showPick({ title: tr('pickTitle'), taken, mine, waiting: true, deadline: Date.now() + Math.max(0, msg.left | 0), onPick: ch => { if (net.conn) net.conn.send({ t: 'pickc', ch }); } });
      break;
    }
    case 'pickcancel': hidePick(); break;
    case 'start': {
      hidePick();
      const n = msg.n === 4 ? 4 : 2;
      const nm = (msg.names || []).map(x => String(x).slice(0, 14));
      const bt = (msg.bots || []).map(Boolean);
      net.sess = String(msg.sess || '').slice(0, 12); net.gameNo = msg.game | 0;
      mergeMatches(msg.list); adoptDb(msg.db);
      beginGame(n, nm, bt, msg.seat | 0, Array.isArray(msg.looks) ? msg.looks.map(v => v | 0) : null);
      break;
    }
    case 'act':
      inbox.push({ s: msg.s, k: msg.k, x: msg.x, z: msg.z, o: msg.o });
      pumpInbox();
      break;
    case 'bot':
      if (S && msg.s >= 0 && msg.s < S.n) { bots[msg.s] = true; toast(tr('replaced', { name: msg.name, bot: LK(msg.s).bot })); ui(); }
      break;
    case 'hist': mergeMatches(msg.list); break;
    case 'chat': chatAdd(msg); break;
    case 'chatlog': if (Array.isArray(msg.list)) { CH.log = msg.list.slice(-30).map(chatClean).filter(Boolean); renderChat(); } break;
    case 'full': backToMenu(msg.why === 'started' ? tr('started') : tr('full')); break;
  }
}

/* =========================================================
   CLASSEMENT : historique local, fusionné avec les autres joueurs à chaque partie en ligne
   ========================================================= */
const LB_KEY = 'qd-matches-v1';
const MAXM = 5000;
// Pseudos par défaut (FR/EN/CS) : refusés comme pseudo et exclus du classement
const DEF_NAMES = ['crâneur', 'craneur', 'skully', 'lebkoun'];
const isDefaultName = n => DEF_NAMES.includes(String(n || '').trim().toLowerCase());
let matches = [];
try { const a = JSON.parse(localStorage.getItem(LB_KEY) || '[]'); if (Array.isArray(a)) matches = a.filter(validMatch); } catch (e) {}
function validMatch(m) {
  return m && typeof m.id === 'string' && Array.isArray(m.p) && !m.p.some((n, i) => !(m.b && m.b[i]) && isDefaultName(n)) && m.p.length >= 2 && m.p.length <= 10 && 
    Number.isInteger(m.w) && m.w >= 0 && m.w < m.p.length && typeof m.t === 'number';
}
function saveMatches() { try { localStorage.setItem(LB_KEY, JSON.stringify(matches.slice(-MAXM))); } catch (e) {} }
function mergeMatches(list) {
  if (!Array.isArray(list)) return;
  const ids = new Set(matches.map(m => m.id)); let added = 0;
  for (const m of list.slice(-MAXM)) {
    if (!validMatch(m) || ids.has(m.id)) continue;
    const b = Array.isArray(m.b) ? m.p.map((_, i) => !!m.b[i]) : m.p.map((_, i) => !!m.ai && i === 1);
    const g = ['diff', 'uc', 'cn', 'dr', 'bj'].includes(m.g) ? m.g : 'quoridor', wa = Array.isArray(m.wa) ? m.wa.filter(i => Number.isInteger(i) && i >= 0 && i < m.p.length) : null;
    matches.push(Object.assign({ id: m.id.slice(0, 48), t: m.t, p: m.p.map(x => String(x).slice(0, 14)), w: m.w, b, g }, wa && wa.length > 1 ? { wa } : {}));
    ids.add(m.id); added++;
  }
  if (added) { matches.sort((a, b) => a.t - b.t); matches = matches.slice(-MAXM); saveMatches(); }
  renderLb();
  if (added && typeof renderDb === 'function' && DB.url && !DB.editing) renderDb();
}
let matchId = '';
function recordMatch(winner) {
  if (!matchId) return;
  const m = { id: matchId, t: Date.now(), p: names.slice(0, S.n), w: winner, b: bots.slice(0, S.n) };
  mergeMatches([m]);
  dbPush([m]);
}

/* =========================================================
   CLASSEMENT EN LIGNE (Firebase Realtime Database, API REST)
   Toutes les parties de tous les appareils vont au même endroit.
   L'adresse se colle une fois ; elle est transmise automatiquement
   aux joueurs qui rejoignent une partie.
   ========================================================= */
const BAKED_DB = 'https://quoridor-7b9d9-default-rtdb.europe-west1.firebasedatabase.app'; // base commune à tous ceux qui ont ce fichier
const DB = { url: '', ok: false, err: '', busy: false, lastT: 0, full: false, count: 0, editing: false };
function normDb(u) {
  u = String(u || '').trim().replace(/\/+$/, '');
  return /^https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)*\.(firebasedatabase\.app|firebaseio\.com)$/i.test(u) ? u : '';
}
try { DB.url = normDb(BAKED_DB) || normDb(localStorage.getItem('qd-db')); } catch (e) { DB.url = normDb(BAKED_DB); }
const dbKeyOk = id => /^[A-Za-z0-9_-]{1,48}$/.test(id);
const dbRecord = m => Object.assign({ t: m.t, p: m.p, w: m.w, b: m.b || m.p.map(() => false), g: m.g || 'quoridor' }, m.wa ? { wa: m.wa } : {});
function setDb(u, announce) {
  DB.url = u; DB.ok = false; DB.err = ''; DB.lastT = 0; DB.full = false; DB.editing = false;
  try { localStorage.setItem('qd-db', u); } catch (e) {}
  renderDb(); renderLb();

      ? { x: Math.random() * W, y: -20 - Math.random() * H * 0.5, vx: (Math.random() - .5) * 60, vy: 60 + Math.random() * 90 }
      : { x: side ? W + 10 : -10, y: H * 0.75, vx: (side ? -1 : 1) * (240 + Math.random() * 380), vy: -(520 + Math.random() * 420) };
    Object.assign(p, { r: Math.random() * 6.28, vr: (Math.random() - .5) * 14, w: 7 + Math.random() * 7, h: 4 + Math.random() * 5, c: CF_COLORS[k % CF_COLORS.length], t: 0, sway: Math.random() * 6.28 });

    p.x += (p.vx + Math.sin(p.t * 4 + p.sway) * 40) * dt; p.y += p.vy * dt; p.r += p.vr * dt;
    g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.scale(1, Math.cos(p.t * 8 + p.sway));
    g.fillStyle = p.c; g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); g.restore();
  }
  CF.raf = CF.parts.length ? requestAnimationFrame(cfStep) : 0;
}
function stopConfetti() {
  CF.parts = []; if (CF.raf) cancelAnimationFrame(CF.raf); CF.raf = 0;
  const c = $('#confetti'); c.getContext('2d').clearRect(0, 0, c.width, c.height);
}

// Classe « overlay » quand un écran (accueil ou fin) recouvre la partie
const syncOverlay = () => document.documentElement.classList.toggle('overlay', !$('#startScreen').hidden || !$('#endScreen').hidden);
new MutationObserver(syncOverlay).observe($('#startScreen'), { attributes: true, attributeFilter: ['hidden'] });
new MutationObserver(syncOverlay).observe($('#endScreen'), { attributes: true, attributeFilter: ['hidden'] });
syncOverlay();

/* --- Changement de langue --- */
function renderLangPickers() {
  document.querySelectorAll('.langseg').forEach(box => {
    box.innerHTML = LANGS.map(([k, l]) => `<button class="btn" data-lang="${k}" aria-pressed="${k === lang}">${l}</button>`).join('');
  });
}
function setLang(l) {
  if (!I18N[l]) return;
  lang = l; try { localStorage.setItem('qd-lang', l); } catch (e) {}
  applyStaticI18n(); renderLangPickers(); renderThemePickers(); renderQualityPicker();
  renderLb(); renderDb(); muteIcon(); renderChat(); renderMusicPicker(); if (PK) showPick(PK);
  if (window.__gc) window.__gc.refresh();
  if (TUT.on) showCoach();
  if (!started) names[0] = tr('you');
  if (S) ui();
  if (lastRoster && !$('#lobbyWait').hidden) renderRoster(lastRoster.list, lastRoster.isHost);
}
document.addEventListener('click', e => { const b = e.target.closest('[data-lang]'); if (b) { SFX.wood(); setLang(b.dataset.lang); } });

applyStaticI18n();
renderLangPickers();
renderMusicPicker();
// ---------- Choix des personnages juste avant la partie (jamais deux fois le même) ----------
// PK : { title, taken: {perso: nom}, mine: perso|undefined, onPick(perso), deadline }
let PK = null, pkTimer = 0;
const PICK_MS = 20000;
function showPick(st) {
  PK = st; $('#cPick').hidden = false;
  $('#cpTitle').textContent = st.title;
  const taken = st.taken || {};
  $('#cpRow').innerHTML = CHAR.map((c, i) => {
    const who = taken[i], mine = st.mine === i, isTaken = who !== undefined && !mine;
    return `<button data-pick="${i}" class="${isTaken ? 'taken' : ''}" aria-pressed="${mine}" ${isTaken ? 'disabled' : ''}><div class="avatar ${c.cls}"><svg><use href="${c.icon}"/></svg></div>${esc(tr('chars')[i])}<small>${mine ? tr('pickYou') : isTaken ? esc(who) : ''}</small></button>`;
  }).join('');
  $('#cpWait').textContent = st.mine !== undefined && st.waiting ? tr('pickWait') : '';
  $('#cpBar').parentNode.hidden = !st.deadline;
}
function hidePick() { PK = null; clearInterval(pkTimer); $('#cPick').hidden = true; }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-pick]'); if (!b || !PK || b.disabled) return;
  const ch = +b.dataset.pick; SFX.wood();
  try { localStorage.setItem('qd-char', ch); } catch (err) {}
  PK.onPick(ch);
});
(function pkLoop() { if (PK && PK.deadline) { const left = Math.max(0, PK.deadline - Date.now()); $('#cpBar').style.transform = `scaleX(${left / PICK_MS})`; } requestAnimationFrame(pkLoop); })();
// Sur cet appareil : chaque humain choisit à son tour (solo : un seul choix)
function localPick(n, humans, done) {
  const picks = {}; let k = 0;
  const step = () => {
    if (k >= humans) { hidePick(); const pref = []; Object.keys(picks).forEach(s => { pref[s] = picks[s]; }); done(computeLooks(pref)); return; }
    const taken = {}; Object.keys(picks).forEach(s => { taken[picks[s]] = humans > 1 ? tr('chars')[picks[s]] : ''; });
    showPick({ title: humans > 1 ? tr('pickPlayer', { name: tr('pickN', { n: k + 1 }) }) : tr('pickTitle'), taken, onPick: ch => { if (Object.values(picks).includes(ch)) return; picks[k++] = ch; step(); } });
  };
  step();
}
// Bouton volume (commun à tous les jeux) : musique du donjon + bruitages
if (window.BGDock) BGDock.mount({
  unlock: () => audioInit(),
  music: { on: () => A.musicOn, set: v => setMusic(v), vol: () => { if (A.ctx) A.music.gain.setTargetAtTime(A.musicOn ? A.duck * MV() : 0, A.ctx.currentTime, 0.1); } },
  sfx: {
    get: () => (A.on ? volGet('bg-vol-sfx', 0.8) : 0),
    set: v => {
      try { localStorage.setItem('bg-vol-sfx', v.toFixed(2)); } catch (e) {}
      if (v > 0.01 && !A.on) { A.on = true; try { localStorage.setItem('qd-sound', '1'); } catch (e) {} if (A.ctx) A.master.gain.setTargetAtTime(0.9, A.ctx.currentTime, 0.05); }
      if (A.ctx) A.sfx.gain.setTargetAtTime(0.85 * SFXV(), A.ctx.currentTime, 0.05);
    }
  },
  ping: () => SFX.wood()
});
// Groupe d'amis : rejoindre la partie lancée par un ami sans taper de code
function joinFromParty(c) {
  if (started || net.mode) backToMenu('');
  $('#inCode').value = c;
  if (!needName()) return; // le code reste rempli : il suffira de choisir un pseudo puis « Rejoindre »
  showView('online'); $('#bJoin').click();
}
if (window.Party) { Party.busy = () => started && !!S && !S.over; Party.onJoinHere = (g, c) => { joinFromParty(c); return true; }; const jc = Party.takeJoin(); if (jc) setTimeout(() => joinFromParty(jc), 300); }
// Chat général de Brutal's Games (même chat que sur l'accueil)
window.__gc = window.GChat ? GChat.mount($('#gchat'), { db: DB.url || BAKED_DB, lang: () => lang, name: () => { const v = $('#inName').value.trim(); return v && !isDefaultName(v) ? v : ''; }, needName: () => { needName(); } }) : null;
setView(0);
applyTheme(themeKey);
applyQuality();
renderLb();
renderDb();
dbSync();
reset(2);
resize();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
requestAnimationFrame(frame);
})();
</script>

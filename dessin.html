<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,interactive-widget=resizes-content">
<meta name="theme-color" content="#1a1322">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brutal's Games">
<title>Dessine &amp; Devine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Dessine & Devine — « L'atelier de nuit » : un atelier d'artiste sombre et chaleureux,
   éclairé par une lampe, avec taches de peinture. Écrans : accueil, salon, partie, podium. */
:root{
  --bg1:#1a1322;--bg2:#2a1c30;--ink:#120c18;--panel:#30243c;--panel2:#241b2e;--line:#4a3a58;--text:#f6ecdf;--muted:#b9a8c4;
  --coral:#ff6b5a;--coral2:#d9483a;--sun:#ffc93c;--sun2:#f0a020;--teal:#3ad0b0;--teal2:#1f9c84;--violet:#9b7bff;--paper:#efe6d2;--ok:#5cd65c;
  --f-title:"Lilita One","Arial Black",system-ui,sans-serif;--f-ui:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;color:var(--text);font-family:var(--f-ui);font-weight:700;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(ellipse at 85% -5%,rgba(255,190,90,.22),transparent 50%),radial-gradient(ellipse at 0% 105%,rgba(155,123,255,.18),transparent 55%),
    repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 2px,transparent 2px 46px),linear-gradient(180deg,var(--bg1),var(--bg2)) fixed;background-color:var(--bg1)}
[hidden]{display:none!important}
#deco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#deco svg{position:absolute}
.frame{position:relative;background:linear-gradient(180deg,var(--panel),var(--panel2));border:4px solid var(--ink);border-radius:22px;box-shadow:0 7px 0 var(--ink)}
.btn{position:relative;font-family:var(--f-ui);font-weight:900;font-size:17px;color:var(--ink);cursor:pointer;line-height:1.1;text-decoration:none;
  background:linear-gradient(180deg,#e8dcff 0,#b9a4f0 55%,#9583d6 100%);border:4px solid var(--ink);border-radius:15px;padding:9px 14px 8px;
  box-shadow:0 5px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.4);transition:transform .07s,box-shadow .07s,filter .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.4)}
@media (hover:hover){.btn:hover{filter:brightness(1.07)}}
.btn:disabled{opacity:.45;cursor:default}
.btn.gold{background:linear-gradient(180deg,#fff0b8 0,var(--sun) 55%,var(--sun2) 100%)}
.btn.coral{background:linear-gradient(180deg,#ffc0b8 0,var(--coral) 55%,var(--coral2) 100%);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn.teal{background:linear-gradient(180deg,#b8f5e6 0,var(--teal) 55%,var(--teal2) 100%)}
.btn.icon{padding:7px;border-radius:13px;flex:none}
.btn.icon svg{width:24px;height:24px}
.btn.wide{width:100%;padding:13px 14px 11px}
.btn.sm{font-size:14px;padding:7px 10px 6px}
.field{font-family:var(--f-ui);font-weight:800;font-size:18px;color:var(--text);background:var(--panel2);border:4px solid var(--ink);border-radius:14px;padding:9px 12px 8px;width:100%;min-width:0;outline:none;-webkit-user-select:text;user-select:text;box-shadow:inset 0 3px 0 rgba(0,0,0,.25)}
.field::placeholder{color:var(--muted)}
.field:focus{border-color:var(--sun)}
.field.code{text-transform:uppercase;letter-spacing:.3em;text-align:center}
label,.lbl{font-size:12.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:900}
.sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.sep::before,.sep::after{content:"";flex:1;height:3px;border-radius:2px;background:var(--line)}
.err{margin:0;color:#ff9a9a;font-size:14px;min-height:1em}
.nseg{display:flex;gap:6px;flex-wrap:wrap}
.nseg .btn{flex:1;padding:8px 4px 7px;font-size:14px;background:var(--panel2);color:var(--text);box-shadow:0 3px 0 var(--ink);min-width:0}
.nseg .btn[aria-pressed="true"]{background:linear-gradient(180deg,#fff0b8,var(--sun) 60%,var(--sun2));color:var(--ink)}
.nseg .btn:disabled{opacity:1;cursor:default}
.screen{position:fixed;inset:0;z-index:1;overflow-y:auto;display:flex;padding:16px;padding-block:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 70px);animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}}
.col{width:100%;max-width:470px;margin:auto;display:flex;flex-direction:column;gap:14px;align-items:stretch}
.topnav{display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel{padding:16px;display:flex;flex-direction:column;gap:11px}
.row{display:flex;gap:8px;align-items:center}
.logo{display:flex;flex-direction:column;align-items:center;animation:drop .7s cubic-bezier(.2,1.5,.4,1) both}
@keyframes drop{from{opacity:0;transform:translateY(-40px) scale(.85)}}
.logo svg{width:170px;height:112px;filter:drop-shadow(0 6px 0 var(--ink));animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotate(-3deg)}}
.logo-t{font-family:var(--f-title);font-size:clamp(40px,11.5vw,62px);line-height:.95;margin-top:-4px;letter-spacing:.01em;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);text-align:center}
.logo-t .a{color:var(--coral)}.logo-t .b{color:var(--sun)}.logo-t .c{color:var(--teal)}
.tagline{font-size:15px;margin-top:8px;background:var(--panel);border:3px solid var(--ink);border-radius:999px;padding:3px 14px 2px;box-shadow:0 3px 0 var(--ink);transform:rotate(-1.5deg)}
.mode{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px 10px;border-radius:20px;text-align:left;justify-content:flex-start}
.mode svg{width:42px;height:42px;flex:none}
.mode span{display:flex;flex-direction:column;gap:2px;min-width:0}
.mode b{font-weight:900;font-size:20px}
.mode small{font-size:12.5px;font-weight:700;opacity:.8}
.bigcode{font-family:var(--f-title);font-size:54px;letter-spacing:.18em;color:var(--sun);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);text-align:center;padding-left:.18em;line-height:1}
.wait-txt{margin:0;font-size:14px;color:var(--muted);text-align:center;line-height:1.45}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.plist{display:flex;flex-wrap:wrap;gap:6px}
.pl{display:flex;align-items:center;gap:6px;font-size:14.5px;background:rgba(0,0,0,.25);border-radius:12px;padding:3px 9px 3px 3px;min-width:0}
.pl svg{width:30px;height:30px;flex:none}
.pl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setrow{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center}

/* ---------- Partie ---------- */
#game{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;gap:7px;padding:8px 10px;padding-block:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-bottom,0px) + 8px);max-width:640px;margin:0 auto;height:100dvh}
.hud{display:flex;align-items:center;gap:7px;padding:6px 8px;flex:none}
.hud .mid{flex:1;min-width:0;text-align:center;line-height:1.1}
.hud .mid small{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.hud .mid b{display:block;font-family:var(--f-title);font-size:17px;font-weight:400;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{position:relative;width:44px;height:44px;flex:none}
.timer svg{width:44px;height:44px;transform:rotate(-90deg)}
.timer span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-title);font-size:17px}
.timer.low span{color:var(--coral);animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.15)}}
.wordbar{flex:none;min-height:46px;padding:6px 10px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;text-align:center;font-size:15px}
.wordbar .w{font-family:var(--f-title);font-size:24px;letter-spacing:.06em;color:var(--sun);text-transform:uppercase}
.slots{display:flex;column-gap:0;row-gap:6px;flex-wrap:wrap;justify-content:center;align-items:flex-end;max-width:100%;
  --cw:min(17px,calc((100vw - 60px) / var(--nl) - 3px))}
.slots .wd{display:inline-flex;gap:3px;white-space:nowrap;flex:none}
.slots .sp{display:inline-block;width:clamp(16px,6vw,28px);flex:none}
.slots i{font-style:normal;font-family:var(--f-title);font-size:calc(var(--cw) * 1.25);width:var(--cw);text-align:center;border-bottom:3px solid var(--text);line-height:1.05;text-transform:uppercase;color:var(--sun)}
.slots i.pn{border:0;width:auto}
.slots small{font-size:12px;color:var(--muted);margin-left:4px;align-self:center}
.stage{position:relative;flex:none;width:100%;aspect-ratio:4/3;max-height:46dvh;margin:0 auto;border:4px solid var(--ink);border-radius:16px;overflow:hidden;box-shadow:0 6px 0 var(--ink);background:var(--paper)}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.stage.nodraw #cv{cursor:default}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;text-align:center;background:rgba(26,19,34,.86);color:var(--text);animation:fadeIn .25s}
.ov h3{margin:0;font-family:var(--f-title);font-weight:400;font-size:24px;letter-spacing:.02em}
.ov .big{font-family:var(--f-title);font-size:clamp(28px,8vw,44px);color:var(--sun);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);text-transform:uppercase;line-height:1}
.ov .choices{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.ov .choices .btn{font-size:18px;padding:11px 16px 10px;max-width:100%;white-space:normal}
.ov .gains{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:100%}
.ov .gains .pl{font-size:13px}
.ov .gains b{color:var(--ok)}
.ov svg.av{width:56px;height:56px}
.tools{flex:none;display:flex;flex-direction:column;gap:6px;padding:7px 8px}
.pal{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.pal button{aspect-ratio:1;border:3px solid var(--ink);border-radius:50%;cursor:pointer;padding:0;min-width:0}
.pal button.on{outline:3px solid var(--sun);outline-offset:1px;transform:scale(1.1)}
.tl{display:flex;gap:6px;align-items:center;justify-content:space-between}
.tl .grp{display:flex;gap:5px;align-items:center}
.tl .btn{padding:5px 8px;border-radius:12px;font-size:14px;box-shadow:0 3px 0 var(--ink)}
.tl .btn svg{width:22px;height:22px}
.tl .btn[aria-pressed="true"]{background:linear-gradient(180deg,#fff0b8,var(--sun) 60%,var(--sun2))}
.tl .sz{width:36px;height:36px;padding:0}
.tl .sz i{display:block;border-radius:50%;background:var(--ink)}
.side{display:flex;flex-direction:column;gap:7px;flex:1;min-height:0}
.scores{flex:none;display:flex;gap:5px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.scores::-webkit-scrollbar{display:none}
.scores .pl{flex:none;font-size:13px;padding:2px 8px 2px 2px;border:2.5px solid var(--ink)}
.scores .pl svg{width:24px;height:24px}
.scores .pl b{color:var(--sun);font-family:var(--f-title);font-weight:400;font-size:15px}
.scores .pl.found{background:rgba(92,214,92,.28)}
.scores .pl.drawing{background:rgba(255,201,60,.28)}
.scores .pl.me{box-shadow:0 0 0 2px var(--sun)}
.scores .pl.gone{opacity:.4}
.scores .pl .rk{font-size:11px;color:var(--muted)}
.chatbox{flex:1;min-height:110px;display:flex;flex-direction:column;gap:6px;padding:7px}
.rc-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:3px;padding:6px;border-radius:12px;background:rgba(0,0,0,.25);font-size:14.5px;line-height:1.3;-webkit-user-select:text;user-select:text}
.rc-msg{overflow-wrap:anywhere}
.rc-msg b{margin-right:5px}
.rc-msg.sys{color:var(--muted);font-size:13px;font-style:italic}
.rc-msg.ok{color:var(--ok);font-weight:900;font-style:normal}
.rc-msg.close{color:var(--sun);font-style:normal}
.rc-msg.priv{background:rgba(92,214,92,.13);border-radius:8px;padding:1px 6px}
.rc-msg.priv::before{content:"🔒 ";font-size:11px}
.rc-msg.gs{opacity:.75}.rc-msg.gs::before{content:"✗ ";color:var(--coral);font-weight:900}
.rc-empty{margin:auto;color:var(--muted);font-size:13px;text-align:center}
.rc-form{display:flex;gap:6px}
.rc-form .field{font-size:16px;padding:8px 10px}
.rc-form .btn{padding:7px 12px}
.tr{cursor:help}.tr::after{content:" 🌐";font-size:10px;opacity:.65}
#lobbyChat{height:230px;display:flex}
#lobbyChat .chatbox{padding:0;background:none;border:0;box-shadow:none}
@media (min-width:980px){
  #game{max-width:1280px;display:grid;grid-template-columns:230px minmax(0,1fr) 330px;grid-template-rows:auto auto 1fr;gap:10px;padding:14px}
  #game .hud{grid-column:1/-1}
  #game .center{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;gap:8px;min-height:0}
  #game .side{display:contents}
  #game .scores{grid-column:1;grid-row:2/4;flex-direction:column;overflow-y:auto;overflow-x:hidden}
  #game .scores .pl{font-size:15px;padding:5px 10px 5px 4px}
  #game .scores .pl svg{width:32px;height:32px}
  #game .scores .pl span{flex:1}
  #game .chatbox{grid-column:3;grid-row:2/4}
  .stage{max-height:calc(100dvh - 250px);width:auto}
}
@media (min-width:980px){ #game .center .stage{max-width:100%} }
.center{display:contents}
@media (max-width:979px){ .center{display:flex;flex-direction:column;gap:7px;flex:none} }

/* ---------- Podium ---------- */
.banner{font-family:var(--f-title);font-size:clamp(30px,9vw,48px);text-align:center;line-height:1.05;color:var(--sun);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);transform:rotate(-2deg);animation:drop .6s cubic-bezier(.2,1.5,.4,1) both}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin-top:6px}
.podium .st{display:flex;flex-direction:column;align-items:center;gap:4px;width:30%}
.podium .st svg{width:52px;height:52px}
.podium .st .nm{font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podium .st .blk{width:100%;border:4px solid var(--ink);border-radius:12px 12px 4px 4px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;font-family:var(--f-title);font-size:26px;color:var(--ink);box-shadow:0 5px 0 var(--ink)}
.podium .p1 .blk{height:110px;background:linear-gradient(180deg,#fff0b8,var(--sun))}
.podium .p2 .blk{height:80px;background:linear-gradient(180deg,#eae6f5,#b8b2cc)}
.podium .p3 .blk{height:60px;background:linear-gradient(180deg,#ffd0a8,#d98a50)}
.podium .blk small{font-family:var(--f-ui);font-size:13px;font-weight:900}
.ranks{display:flex;flex-direction:column;gap:4px}
.ranks .pl{justify-content:flex-start}
.ranks .pl b{margin-left:auto;color:var(--sun);font-family:var(--f-title);font-weight:400}

.sheet{position:fixed;z-index:25;left:50%;top:50%;transform:translate(-50%,-50%);width:min(390px,calc(100% - 28px));max-height:calc(100% - 40px);overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;animation:fadeIn .2s}
.sheet-head{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-title);font-size:28px}
.rules{font-size:14.5px;line-height:1.5}
.rules p{margin:0 0 8px}.rules b{color:var(--sun)}
#gchatHome{height:230px}
#toast{position:fixed;z-index:40;left:50%;top:34%;transform:translate(-50%,-50%) scale(.8);background:var(--panel);color:var(--text);border:4px solid var(--ink);border-radius:16px;padding:9px 16px 8px;font-size:16px;box-shadow:0 5px 0 var(--ink);opacity:0;pointer-events:none;transition:opacity .2s,transform .25s cubic-bezier(.2,1.6,.4,1);max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast.bad{background:var(--coral);color:#fff}
#toast.good{background:var(--ok);color:var(--ink)}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:35}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>
<div id="deco" aria-hidden="true">
  <svg style="right:-26px;top:7vh;width:150px;height:150px;transform:rotate(18deg)" viewBox="0 0 100 100"><path d="M50 8c26 0 44 16 44 36 0 14-12 18-22 16-8-2-12 6-8 12 5 8-2 20-16 20C24 92 6 72 6 50S24 8 50 8z" fill="#c89a6a" stroke="#120c18" stroke-width="4"/><circle cx="30" cy="34" r="7" fill="#ff6b5a" stroke="#120c18" stroke-width="3"/><circle cx="50" cy="24" r="7" fill="#ffc93c" stroke="#120c18" stroke-width="3"/><circle cx="70" cy="32" r="7" fill="#3ad0b0" stroke="#120c18" stroke-width="3"/><circle cx="26" cy="56" r="7" fill="#9b7bff" stroke="#120c18" stroke-width="3"/><circle cx="40" cy="74" r="8" fill="#1a1322" stroke="#120c18" stroke-width="3"/></svg>
  <svg style="left:-14px;bottom:12vh;width:110px;height:110px" viewBox="0 0 100 100"><path d="M50 10c8 10 22 6 26 18s-6 16 2 26-6 24-18 22-14 8-26 2-6-20-16-26 0-24 10-26 14-26 22-16z" fill="#ff6b5a" opacity=".55"/><circle cx="82" cy="20" r="6" fill="#ff6b5a" opacity=".55"/><circle cx="14" cy="80" r="4" fill="#ff6b5a" opacity=".55"/></svg>
  <svg style="right:8vw;bottom:-10px;width:90px;height:90px" viewBox="0 0 100 100"><path d="M40 20c10-6 30 0 34 14s-8 22-4 34-12 22-26 16-28-8-24-24 10-34 20-40z" fill="#3ad0b0" opacity=".4"/></svg>
</div>

<!-- ======== ACCUEIL ======== -->
<section class="screen" id="home">
  <div class="col">
    <div class="topnav">
      <a class="btn" href="index.html"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span data-i18n="games">Jeux</span></a>
      <button class="btn icon" id="bSet" data-i18n-aria="settings"><svg viewBox="0 0 24 24"><path d="M12 2.5l2 2.6 3.2-.6.8 3.1 3 1.4-1.1 3 1.1 3-3 1.4-.8 3.1-3.2-.6-2 2.6-2-2.6-3.2.6-.8-3.1-3-1.4 1.1-3-1.1-3 3-1.4.8-3.1 3.2.6z" fill="currentColor" stroke="#120c18" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="3.4" fill="#fff" stroke="#120c18" stroke-width="1.6"/></svg></button>
    </div>
    <div class="logo">
      <svg viewBox="0 0 170 112">
        <rect x="30" y="14" width="96" height="74" rx="6" fill="#efe6d2" stroke="#120c18" stroke-width="4.5" transform="rotate(-6 78 51)"/>
        <path d="M50 70c8-22 22-30 30-14s16 4 22-10" fill="none" stroke="#ff6b5a" stroke-width="6" stroke-linecap="round" transform="rotate(-6 78 51)"/>
        <circle cx="96" cy="34" r="9" fill="#ffc93c" stroke="#120c18" stroke-width="3.5" transform="rotate(-6 78 51)"/>
        <path d="M118 96l34-56 8 5-30 58z" fill="#9b7bff" stroke="#120c18" stroke-width="4" stroke-linejoin="round"/>
        <path d="M152 40l6-12 9 6-7 11z" fill="#e8d0a8" stroke="#120c18" stroke-width="4" stroke-linejoin="round"/>
        <path d="M118 96l-4 12 12-7z" fill="#3ad0b0" stroke="#120c18" stroke-width="3.5" stroke-linejoin="round"/>

    : `<div class="rc-msg${m.priv ? ' priv' : ''}${m.gs ? ' gs' : ''}"><b style="color:${COLORS[m.s % 10]}">${esc(m.n)}</b>${trHtml(m.txt, m.l, m.s === net.me)}</div>`).join('') : `<p class="rc-empty">${t('chatEmpty')}</p>`;
  L.scrollTop = L.scrollHeight;
}
$('#rcForm').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('#rcIn').value.replace(/\s+/g, ' ').trim().slice(0, 120); if (!v) return;
  $('#rcIn').value = '';
  if (net.role === 'host') chatIn(0, v, P.lang()); else if (net.conn && net.conn.open) net.conn.send({ t: 'chat', txt: v, l: P.lang() });
});
const gcHome = window.GChat ? GChat.mount($('#gchatHome'), { db: P.DB_URL, lang: P.lang, name: () => P.hasName() ? P.name() : '', needName: () => P.needName($('#inName')) }) : null;

/* ---------- Groupe d'amis ---------- */
function joinFromParty(c) { P.stopConfetti(); G = null; V = null; pendingJoin = c; if (!P.hasName()) { show('home'); nameOk(); return; } $('#mOnline').click(); }
if (window.Party) { Party.busy = () => !$('#game').hidden && !!V && V.phase !== 'end'; Party.onJoinHere = (g, c) => { joinFromParty(c); return true; }; }

/* ---------- Démarrage ---------- */
P.onLang(() => {
  if (net.role === 'guest' && net.conn && net.conn.open) net.conn.send({ t: 'lang', l: P.lang() });
  if (net.role === 'host' && net.roster[0]) { net.roster[0].lang = P.lang(); if (G) sync(); }
  renderSnd(); renderMus(); renderChat(); if (gcHome) gcHome.refresh();
  if (!$('#onWait').hidden) renderLobby(); if (V) render();
});
P.applyStatic(); renderSnd(); renderMus(); renderChat();
{ const jc = window.Party && Party.takeJoin(); if (jc) joinFromParty(jc); }
window.__dr = { get G() { return G; }, get V() { return V; }, net, CV, get word() { return myWord; }, get choices() { return myChoices; }, wordOf };
})();

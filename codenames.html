<!doctype html>
<html lang="fr" data-title="gn_cn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d1030">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brutal's Games">
<title>Codenames</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titan+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Codenames — « Mission galactique » : équipage Rouge contre équipage Bleu dans l'espace.
   Écrans : accueil, en ligne (salon + équipes), partie (plateau 5×5), fin. */
:root{
  --bg1:#0b0e2a;--bg2:#251a4e;--ink:#0a0718;--panel:#1f2352;--panel2:#171b42;--line:#3a3f78;--text:#efeaff;--muted:#a3a6d6;
  --red:#ff5a5f;--red2:#c93a40;--blue:#4aa3ff;--blue2:#2a74c8;--card:#cdbf9f;--card2:#b9aa88;--neutral:#8e8a7e;--gold:#ffcc4d;--black:#16121f;
  --f-title:"Titan One","Arial Black",system-ui,sans-serif;--f-ui:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;color:var(--text);font-family:var(--f-ui);font-weight:700;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(1.4px 1.4px at 12% 18%,#fff 50%,transparent 55%),radial-gradient(1.2px 1.2px at 32% 64%,#fff 50%,transparent 55%),radial-gradient(1.6px 1.6px at 72% 12%,#ffe9b0 50%,transparent 55%),
    radial-gradient(1.2px 1.2px at 86% 52%,#fff 50%,transparent 55%),radial-gradient(1.3px 1.3px at 54% 86%,#cfe0ff 50%,transparent 55%),radial-gradient(1.1px 1.1px at 6% 78%,#fff 50%,transparent 55%),
    radial-gradient(1.2px 1.2px at 44% 30%,#fff 50%,transparent 55%),radial-gradient(1.2px 1.2px at 92% 88%,#fff 50%,transparent 55%),
    radial-gradient(ellipse at 80% 0%,rgba(140,80,255,.25),transparent 55%),radial-gradient(ellipse at 0% 100%,rgba(60,160,255,.18),transparent 55%),
    linear-gradient(180deg,var(--bg1),var(--bg2)) fixed;background-color:var(--bg1)}
[hidden]{display:none!important}
#deco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#deco svg{position:absolute}
.frame{position:relative;background:linear-gradient(180deg,var(--panel),var(--panel2));border:4px solid var(--ink);border-radius:22px;box-shadow:0 7px 0 var(--ink)}
.btn{position:relative;font-family:var(--f-ui);font-weight:900;font-size:17px;color:var(--ink);cursor:pointer;line-height:1.1;text-decoration:none;
  background:linear-gradient(180deg,#cfd6ff 0,#94a0ee 55%,#7480d6 100%);border:4px solid var(--ink);border-radius:15px;padding:9px 14px 8px;
  box-shadow:0 5px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.4);transition:transform .07s,box-shadow .07s,filter .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.4)}
@media (hover:hover){.btn:hover{filter:brightness(1.07)}}
.btn:disabled{opacity:.45;cursor:default}
.btn.gold{background:linear-gradient(180deg,#fff0b0 0,var(--gold) 55%,#f0a92a 100%)}
.btn.red{background:linear-gradient(180deg,#ffb8ba 0,var(--red) 55%,var(--red2) 100%);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn.blue{background:linear-gradient(180deg,#bfe0ff 0,var(--blue) 55%,var(--blue2) 100%);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn.icon{padding:7px;border-radius:13px;flex:none}
.btn.icon svg{width:24px;height:24px}
.btn.wide{width:100%;padding:13px 14px 11px}
.btn.sm{font-size:14px;padding:7px 10px 6px}
.field{font-family:var(--f-ui);font-weight:800;font-size:18px;color:var(--text);background:var(--panel2);border:4px solid var(--ink);border-radius:14px;padding:9px 12px 8px;width:100%;min-width:0;outline:none;-webkit-user-select:text;user-select:text;box-shadow:inset 0 3px 0 rgba(0,0,0,.25)}
.field::placeholder{color:var(--muted)}
.field:focus{border-color:var(--gold)}
.field.code{text-transform:uppercase;letter-spacing:.3em;text-align:center}
label,.lbl{font-size:12.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:900}
.sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.sep::before,.sep::after{content:"";flex:1;height:3px;border-radius:2px;background:var(--line)}
.err{margin:0;color:#ff9a9a;font-size:14px;min-height:1em}
.nseg{display:flex;gap:6px;flex-wrap:wrap}
.nseg .btn{flex:1;padding:8px 4px 7px;font-size:14px;background:var(--panel2);color:var(--text);box-shadow:0 3px 0 var(--ink);min-width:0}
.nseg .btn[aria-pressed="true"]{background:linear-gradient(180deg,#fff0b0,var(--gold) 60%,#f0a92a);color:var(--ink)}
.screen{position:fixed;inset:0;z-index:1;overflow-y:auto;display:flex;padding:16px;padding-block:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 70px);animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}}
.col{width:100%;max-width:470px;margin:auto;display:flex;flex-direction:column;gap:14px;align-items:stretch}
.topnav{display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel{padding:16px;display:flex;flex-direction:column;gap:11px}
.row{display:flex;gap:8px;align-items:center}
.logo{display:flex;flex-direction:column;align-items:center;animation:drop .7s cubic-bezier(.2,1.5,.4,1) both}
@keyframes drop{from{opacity:0;transform:translateY(-40px) scale(.85)}}
.logo svg{width:150px;height:110px;filter:drop-shadow(0 6px 0 var(--ink));animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotate(-3deg)}}
.logo-t{font-family:var(--f-title);font-size:clamp(46px,13vw,70px);line-height:.95;margin-top:-6px;letter-spacing:.02em;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
.logo-t .r{color:var(--red)}.logo-t .b{color:var(--blue)}
.tagline{font-size:15px;margin-top:8px;background:var(--panel);border:3px solid var(--ink);border-radius:999px;padding:3px 14px 2px;box-shadow:0 3px 0 var(--ink);transform:rotate(-1.5deg)}
.mode{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px 10px;border-radius:20px;text-align:left;justify-content:flex-start}
.mode svg{width:42px;height:42px;flex:none}
.mode span{display:flex;flex-direction:column;gap:2px;min-width:0}
.mode b{font-weight:900;font-size:20px}
.mode small{font-size:12.5px;font-weight:700;opacity:.8}
.bigcode{font-family:var(--f-title);font-size:54px;letter-spacing:.18em;color:var(--gold);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);text-align:center;padding-left:.18em;line-height:1}
.wait-txt{margin:0;font-size:14px;color:var(--muted);text-align:center;line-height:1.45}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

/* ---------- Équipes (salon) ---------- */
.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.team{border:3px solid var(--ink);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:5px;min-height:110px}
.team.r{background:linear-gradient(180deg,rgba(255,90,95,.32),rgba(255,90,95,.12))}
.team.b{background:linear-gradient(180deg,rgba(74,163,255,.32),rgba(74,163,255,.12))}
.team h4{margin:0 0 2px;font-family:var(--f-title);font-size:20px;letter-spacing:.03em;font-weight:400}
.team.r h4{color:#ffb0b2}.team.b h4{color:#b0d8ff}
.pl{display:flex;align-items:center;gap:6px;font-size:14.5px;background:rgba(0,0,0,.25);border-radius:10px;padding:3px 7px 3px 3px;min-width:0}
.pl svg{width:28px;height:28px;flex:none}
.pl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .cap{margin-left:auto;font-size:15px}
.unassigned{display:flex;flex-wrap:wrap;gap:5px}
.teambtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ---------- Partie ---------- */
#game{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;gap:8px;padding:8px 10px;padding-block:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-bottom,0px) + 8px);max-width:760px;margin:0 auto}
.hud{display:flex;align-items:center;gap:7px;padding:6px 8px}
.score{display:flex;align-items:center;gap:5px;font-family:var(--f-title);font-size:22px;border:3px solid var(--ink);border-radius:12px;padding:1px 9px 0;box-shadow:0 3px 0 var(--ink)}
.score.r{background:var(--red);color:#fff}.score.b{background:var(--blue);color:#fff}
.score.on{outline:3px solid var(--gold);outline-offset:2px}
.hud .mid{flex:1;min-width:0;text-align:center;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;line-height:1.15}
.hud .mid b{display:block;font-family:var(--f-title);font-size:17px;letter-spacing:.03em;text-transform:none}
.hud .mid b.r{color:#ff9a9d}.hud .mid b.b{color:#9ccfff}
.clue{padding:8px 12px;text-align:center;font-size:16px;line-height:1.3;min-height:44px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.clue .w{font-family:var(--f-title);font-size:24px;letter-spacing:.04em;color:var(--gold)}
.clue .n{font-family:var(--f-title);font-size:22px;background:var(--gold);color:var(--ink);border:3px solid var(--ink);border-radius:10px;padding:0 9px}
.clue .lft{font-size:13px;color:var(--muted)}
.board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);gap:6px}
.card{position:relative;border:3px solid var(--ink);border-radius:12px;background:linear-gradient(180deg,var(--card),var(--card2));color:#2a2014;box-shadow:0 4px 0 var(--ink);
  display:flex;align-items:center;justify-content:center;text-align:center;padding:3px;font-weight:900;font-size:clamp(10px,2.7vw,17px);line-height:1.05;overflow:hidden;cursor:pointer;word-break:normal;overflow-wrap:anywhere;transition:transform .12s}
.card.l1 span{font-size:.86em}.card.l2 span{font-size:.74em}.card.l3 span{font-size:.62em;letter-spacing:0}
.card.rev.l1 span,.card.rev.l2 span,.card.rev.l3 span{opacity:.85}
.card:active{transform:translateY(2px)}
.card span{position:relative;z-index:1;text-transform:uppercase;letter-spacing:.02em}
.card.k-r{box-shadow:inset 0 0 0 4px var(--red),0 4px 0 var(--ink);background:linear-gradient(180deg,#f3d8cf,#e2b9ad)}
.card.k-b{box-shadow:inset 0 0 0 4px var(--blue),0 4px 0 var(--ink);background:linear-gradient(180deg,#d6e4f3,#b4c9e2)}
.card.k-n{box-shadow:inset 0 0 0 4px #7a7568,0 4px 0 var(--ink)}
.card.k-a{box-shadow:inset 0 0 0 4px #000,0 4px 0 var(--ink);background:linear-gradient(180deg,#8a8070,#6a6050);color:#fff}
.card.rev{cursor:default;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.card.rev.r{background:linear-gradient(180deg,#ff8a8d,var(--red) 60%,var(--red2))}
.card.rev.b{background:linear-gradient(180deg,#8cc6ff,var(--blue) 60%,var(--blue2))}
.card.rev.n{background:linear-gradient(180deg,#a8a498,var(--neutral));color:#2a2620;text-shadow:none}
.card.rev.a{background:radial-gradient(circle at 50% 45%,#7a3ab8 0,#2a1040 45%,var(--black) 70%);color:#e0c8ff}
.card.rev svg.ic{position:absolute;inset:auto 4px 3px auto;width:38%;height:38%;opacity:.35}
.card.rev span{opacity:.85;font-size:.85em}
.card.flip{animation:flip .5s ease-out}
@keyframes flip{0%{transform:rotateY(90deg) scale(.9)}100%{transform:none}}
.card .props{position:absolute;left:3px;top:3px;display:flex;gap:2px;z-index:2}
.card .props i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);display:block}
.card.mine{outline:4px solid var(--gold);outline-offset:-2px}
.card.pickable:hover{filter:brightness(1.06)}
.crew{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.crew .pl{background:rgba(0,0,0,.28);font-size:13px;padding:2px 7px 2px 2px}
.crew .pl svg{width:22px;height:22px}
.crew .pl.r{box-shadow:inset 0 0 0 2px var(--red)}.crew .pl.b{box-shadow:inset 0 0 0 2px var(--blue)}
.crew .pl.me{outline:2px solid var(--gold)}
.action{padding:10px;display:flex;flex-direction:column;gap:8px}
.action .hint{margin:0;font-size:13.5px;color:var(--muted);text-align:center}
.action #aClue{min-width:0;flex:1;font-size:17px;padding:10px 12px}
.action select{font-family:var(--f-title);font-size:20px;color:var(--ink);background:var(--gold);border:4px solid var(--ink);border-radius:14px;padding:6px 8px;flex:none}
.log{font-size:12.5px;color:var(--muted);text-align:center;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Fin ---------- */
.banner{font-family:var(--f-title);font-size:clamp(28px,8vw,46px);text-align:center;line-height:1.05;color:#fff;position:relative;z-index:2;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);transform:rotate(-2deg);animation:drop .6s cubic-bezier(.2,1.5,.4,1) both}
.banner.r{color:var(--red)}.banner.b{color:var(--blue)}
.endboard{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.endboard .card{font-size:clamp(9px,2.4vw,12px);overflow-wrap:normal;min-height:44px;cursor:default;box-shadow:0 2px 0 var(--ink);border-width:2px;border-radius:8px}

/* ---------- Chat ---------- */
.rchat{position:fixed;z-index:22;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);transform:translateX(-50%);width:min(460px,calc(100% - 20px));height:min(62vh,460px);display:flex;flex-direction:column;gap:8px;padding:10px;animation:fadeIn .2s}
.rc-head{display:flex;align-items:center;justify-content:space-between;font-family:var(--f-title);font-size:24px}
.rc-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding:6px;border-radius:12px;background:rgba(0,0,0,.25);font-size:14.5px;line-height:1.35}
.rc-msg{display:flex;gap:6px;align-items:flex-start;overflow-wrap:anywhere}
.rc-msg svg{width:26px;height:26px;flex:none}
.rc-msg b{margin-right:4px}
.rc-msg.me{flex-direction:row-reverse;text-align:right}
.rc-msg .bub{background:var(--panel2);border:2px solid var(--ink);border-radius:12px;padding:3px 9px;max-width:80%}
.rc-msg.me .bub{background:rgba(255,204,77,.2)}
.rc-msg.sys{justify-content:center;color:var(--muted);font-size:12.5px}
.rc-empty{margin:auto;color:var(--muted);font-size:13px;text-align:center}
.rc-form{display:flex;gap:6px}
.rc-form .field{font-size:16px;padding:8px 10px}
.tr{cursor:help}.tr::after{content:" 🌐";font-size:10px;opacity:.65}
.chatbar{position:relative;display:flex;align-items:center;gap:8px;width:100%;padding:7px 12px;font:inherit;font-size:14px;color:var(--text);cursor:pointer;text-align:left;box-shadow:0 4px 0 var(--ink);border-radius:16px}
.chatbar .cb-ico{font-size:19px;flex:none}
.chatbar .cb-txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatbar .cb-txt b{margin-right:4px}
.chatbar .cb-txt i{font-style:normal;color:var(--muted)}
.badge{min-width:22px;height:22px;border-radius:11px;background:var(--red);color:#fff;font-size:12px;display:grid;place-items:center;border:2.5px solid var(--ink);padding:0 5px;flex:none}
.badge:empty{display:none}
.chatbtn{position:relative}.chatbtn .badge{position:absolute;top:-8px;right:-8px}
@media (min-width:1150px){
  body.netlive #rc{display:flex!important;left:auto;right:18px;top:18px;bottom:18px;height:auto;width:330px;transform:none}
  body.netlive .chatbtn,body.netlive .chatbar,body.netlive #rcClose{display:none}
  body.netlive #game{margin-left:max(10px,calc(50% - 560px))}
}
#gchatHome{height:230px}
.sheet{position:fixed;z-index:25;left:50%;top:50%;transform:translate(-50%,-50%);width:min(390px,calc(100% - 28px));max-height:calc(100% - 40px);overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;animation:fadeIn .2s}
.sheet-head{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-title);font-size:28px}
.rules{font-size:14.5px;line-height:1.5}
.rules p{margin:0 0 8px}.rules b{color:var(--gold)}
#toast{position:fixed;z-index:40;left:50%;top:18%;transform:translate(-50%,-50%) scale(.8);background:var(--panel);color:var(--text);border:4px solid var(--ink);border-radius:16px;padding:9px 16px 8px;font-size:16px;box-shadow:0 5px 0 var(--ink);opacity:0;pointer-events:none;transition:opacity .2s,transform .25s cubic-bezier(.2,1.6,.4,1);max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast.bad{background:var(--red);color:#fff}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:35}
/* place pour le bouton du volume (toujours en bas à gauche) */
body.ingame .action{padding-left:58px}
</style>
</head>
<body>
<div id="deco" aria-hidden="true">
  <svg style="right:-40px;top:8vh;width:170px;height:170px" viewBox="0 0 100 100"><circle cx="50" cy="50" r="34" fill="#ff8a5a" stroke="#0a0718" stroke-width="4"/><path d="M22 40c18 6 38 6 56 0M20 58c20 6 40 6 60 0" stroke="#e8603a" stroke-width="5" fill="none"/><ellipse cx="50" cy="52" rx="48" ry="12" fill="none" stroke="#0a0718" stroke-width="8"/><ellipse cx="50" cy="52" rx="48" ry="12" fill="none" stroke="#ffd27a" stroke-width="4"/></svg>
  <svg style="left:-30px;bottom:14vh;width:120px;height:120px" viewBox="0 0 100 100"><circle cx="50" cy="50" r="36" fill="#5aa8ff" stroke="#0a0718" stroke-width="4"/><circle cx="38" cy="40" r="7" fill="#3a80d8"/><circle cx="60" cy="62" r="10" fill="#3a80d8"/><circle cx="64" cy="34" r="5" fill="#3a80d8"/></svg>
</div>

<!-- ======== ACCUEIL ======== -->
<section class="screen" id="home">
  <div class="col">
    <div class="topnav">
      <a class="btn" href="index.html"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span data-i18n="games">Jeux</span></a>
      <button class="btn icon" id="bSet" data-i18n-aria="settings"><svg viewBox="0 0 24 24"><path d="M12 2.5l2 2.6 3.2-.6.8 3.1 3 1.4-1.1 3 1.1 3-3 1.4-.8 3.1-3.2-.6-2 2.6-2-2.6-3.2.6-.8-3.1-3-1.4 1.1-3-1.1-3 3-1.4.8-3.1 3.2.6z" fill="currentColor" stroke="#0a0718" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="3.4" fill="#fff" stroke="#0a0718" stroke-width="1.6"/></svg></button>
    </div>
    <div class="logo">
      <svg viewBox="0 0 150 110">
        <path d="M75 8c14 10 20 28 18 48l10 14-14 4H61l-14-4 10-14c-2-20 4-38 18-48z" fill="#efeaff" stroke="#0a0718" stroke-width="4.5" stroke-linejoin="round"/>
        <circle cx="75" cy="42" r="11" fill="#5aa8ff" stroke="#0a0718" stroke-width="4"/><circle cx="71" cy="38" r="3" fill="#fff"/>
        <path d="M47 70l-10 14 16-4M103 70l10 14-16-4" fill="#ff5a5f" stroke="#0a0718" stroke-width="4" stroke-linejoin="round"/>
        <path d="M66 80l9 22 9-22z" fill="#ffcc4d" stroke="#0a0718" stroke-width="4" stroke-linejoin="round"/>
        <circle cx="22" cy="24" r="4" fill="#ffcc4d"/><circle cx="130" cy="18" r="3" fill="#fff"/><circle cx="134" cy="70" r="4" fill="#ff8a5a"/>
      </svg>
      <div class="logo-t" data-i18n-html="logoH"><span class="r">Code</span><span class="b">names</span></div>
      <div class="tagline" data-i18n="tagline">Mission galactique : trouve ton équipage !</div>
    </div>
    <div class="frame panel">
      <label for="inName" data-i18n="nick">Ton pseudo</label>

  if (V.last) lastKey = 'r' + V.last.i + V.log.length;
  // équipages
  $('#crew').innerHTML = V.players.map((p, i) => p.gone ? '' : `<div class="pl ${p.team}${i === net.me ? ' me' : ''}">${avatar(i, p.team)}<span>${esc(p.n)}</span>${p.cap ? '<span class="cap">👑</span>' : ''}</div>`).join('');
  $('#log').innerHTML = V.log.map(l => `<span style="color:${l.team === 'r' ? '#ff9a9d' : '#9ccfff'}">${trHtml(l.w, l.l, false)} ${l.n === 'inf' ? '∞' : l.n}</span>`).join(' · ');
  // actions
  const A = $('#action'); let h = '';
  if (!myTeam) h = `<p class="hint">${t('spectator')}</p>`;
  else if (V.phase === 'clue' && myTurn && isCap) {
    const opts = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', 'inf'].map(v => `<option value="${v}">${v === 'inf' ? '∞' : v}</option>`).join('');
    h = `<p class="hint">${t('yourClue')}</p><div class="row"><input class="field" id="aClue" maxlength="24" autocomplete="off" enterkeyhint="send" placeholder="${esc(t('cluePh'))}"><select id="aNum">${opts}</select><button class="btn gold" id="aSend">${t('send')}</button></div>`;
  } else if (V.phase === 'clue') h = `<p class="hint">${myTurn ? t('capThinking', { name: esc(capName) }) : t('otherTurn')}</p>`;
  else if (V.phase === 'guess' && myTurn && !isCap) h = `<p class="hint">${t('guessHint')}</p><button class="btn red sm" id="aPass" style="align-self:center">${t('pass')}</button>`;
  else if (V.phase === 'guess' && myTurn && isCap) h = `<p class="hint">${t('capWait')}</p>`;
  else h = `<p class="hint">${t('otherTurn')}</p>`;
  const key = V.phase + V.turn + V.log.length;
  if (document.activeElement && document.activeElement.id === 'aClue' && A.dataset.key === key) return;
  A.dataset.key = key; A.innerHTML = h;
  const ci = $('#aClue');
  if (ci) {
    const go = () => {
      const w = ci.value.trim(), n = $('#aNum').value;
      if (!w || /\s/.test(w) || V.words.some((wi, i) => !V.revealed[i] && WORDS[wi].some(x => norm(x) === norm(w)))) { toast(t('clueBad'), true); P.sfx('bad'); return; }
      P.sfx('click'); A.dataset.key = ''; send({ t: 'clue', w, n: n === 'inf' ? 'inf' : +n });
    };
    $('#aSend').onclick = go; ci.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  }
  const pb = $('#aPass'); if (pb) pb.onclick = () => { P.sfx('click'); send({ t: 'pass' }); };
}
let lastSfx = '';
document.getElementById('board').addEventListener('click', e => {
  const c = e.target.closest('.card'); if (!c || !V || V.phase !== 'guess') return;
  const me = V.players[net.me] || {}; if (me.cap || me.team !== V.turn) return;
  const i = +c.dataset.i; if (V.revealed[i]) return;
  P.sfx('click'); send({ t: 'prop', i });
});
// sons des révélations
const _render = render;
function sfxFor() {
  if (!V || !V.last) return; const k = 'l' + V.last.i + V.log.length + V.phase; if (k === lastSfx) return; lastSfx = k;
  const me = V.players[net.me] || {};
  if (V.last.k === 'a') P.sfx('bad'); else if (V.last.k === me.team) P.sfx('good'); else if (V.last.k === 'n') P.sfx('other'); else P.sfx('bad');
  try { navigator.vibrate && navigator.vibrate(V.last.k === me.team ? 15 : [30, 50, 30]); } catch (e) {}
}
setInterval(sfxFor, 150);
$('#bQuit').onclick = () => {
  P.sfx('click');
  P.quitMenu($('#bQuit'), () => {
  leaveNet(); S = null; V = null; myKey = null; show('home');
  });
};

/* ---------- Fin ---------- */
function renderEnd() {
  show('end');
  const me = V.players[net.me] || {}, won = me.team === V.winner;
  const tt = $('#endTitle'); tt.textContent = t(V.winner === 'r' ? 'winRed' : 'winBlue'); tt.className = 'banner ' + V.winner;
  $('#endBoard').innerHTML = V.words.map((wi, i) => `<div class="card rev ${V.rkey[i]} ${(w => w > 10 ? 'l3' : w > 8 ? 'l2' : w > 6 ? 'l1' : '')(Math.max(...String(wordOf(wi)).split(/\s+/).map(x => x.length)))}">${ICONS[V.rkey[i]]}<span>${esc(wordOf(wi))}</span></div>`).join('');
  $('#endCrew').innerHTML = V.players.map((p, i) => `<div class="pl ${p.team}${i === net.me ? ' me' : ''}">${avatar(i, p.team)}<span>${esc(p.n)}</span>${p.team === V.winner ? '<span class="cap">🏆</span>' : ''}</div>`).join('');
  const guest = net.role !== 'host';
  $('#bAgain').hidden = guest; $('#endWait').textContent = guest ? t('hostAgain') : ''; $('#bMenu').hidden = !net.relay;
  if (lastSfx !== 'end' + V.log.length) { lastSfx = 'end' + V.log.length; P.sfx(won ? 'win' : 'lose'); if (won) P.confetti($('#confetti')); }
  if (V.last && V.last.k === 'a') toast(t('assassinHit', { team: teamName(other(V.winner)) }), true);
}
$('#bAgain').onclick = () => { P.sfx('click'); P.stopConfetti(); if (net.role === 'host') $('#bStart').click(); };
$('#bHome').onclick = () => { P.sfx('click'); P.stopConfetti(); clearTimeout(window.__endT); leaveNet(); S = null; V = null; myKey = null; show('home'); };
$('#bMenu').onclick = () => {
  P.sfx('click'); P.stopConfetti();
  if (net.relay) { S = null; V = null; myKey = null; show('online'); $('#onForm').hidden = true; $('#onWait').hidden = false; if (net.role === 'host') { net.roster = net.roster.filter(r => !r.gone); broadcastLobby(); } else renderLobby(); return; }
  show('home');
};

/* ---------- Chat de la partie ---------- */
const CHAT = { list: [], unread: 0 };
const wideChat = () => matchMedia('(min-width:1150px)').matches && document.body.classList.contains('netlive');
const chatVisible = () => !$('#rc').hidden || wideChat();
function chatIn(s, txt, l) {
  txt = String(txt || '').replace(/\s+/g, ' ').trim().slice(0, 160); if (!txt) return;
  const r = net.roster[s] || {};
  const m = { s, n: r.name || '?', team: r.team || null, txt, l: ['fr', 'en', 'cs'].includes(l) ? l : 'fr' };
  net.roster.forEach(o => { if (o.conn && o.conn.open) o.conn.send({ t: 'chat', m }); });
  chatAdd(m);
}
function chatSys(txt) { const m = { sys: true, txt }; net.roster.forEach(o => { if (o.conn && o.conn.open) o.conn.send({ t: 'chat', m }); }); chatAdd(m); }
function chatAdd(m) {
  if (!m || typeof m.txt !== 'string') return;
  CHAT.list.push({ s: m.s | 0, n: String(m.n || '?').slice(0, 14), team: m.team, txt: m.txt.slice(0, 160), l: m.l, sys: !!m.sys });
  if (CHAT.list.length > 80) CHAT.list.shift();
  if (!m.sys && m.s !== net.me) { if (!chatVisible()) { CHAT.unread++; toast(`💬 <b>${esc(String(m.n || '?'))}</b> : ${esc(String(m.txt).slice(0, 60))}`); } P.sfx('chat'); }
  renderChat();
}
function renderChat() {
  const L = $('#rcList');
  L.innerHTML = CHAT.list.length ? CHAT.list.map(m => m.sys ? `<div class="rc-msg sys">${esc(m.txt)}</div>` : `<div class="rc-msg${m.s === net.me ? ' me' : ''}">${avatar(m.s, m.team)}<div class="bub"><b style="color:${m.team === 'r' ? '#ff9a9d' : m.team === 'b' ? '#9ccfff' : COLORS[m.s % 10]}">${esc(m.n)}</b>${trHtml(m.txt, m.l, m.s === net.me)}</div></div>`).join('') : `<p class="rc-empty">${t('chatEmpty')}</p>`;
  L.scrollTop = L.scrollHeight;
  if (chatVisible()) CHAT.unread = 0;
  document.querySelectorAll('.badge').forEach(b => { b.textContent = CHAT.unread ? CHAT.unread : ''; });
  const last = [...CHAT.list].reverse().find(m => !m.sys);
  const bar = last ? `<b style="color:${last.team === 'r' ? '#ff9a9d' : last.team === 'b' ? '#9ccfff' : '#fff'}">${esc(last.n)}</b>${trHtml(last.txt, last.l, last.s === net.me)}` : `<i>${t('chatInvite')}</i>`;
  document.querySelectorAll('.chatbar .cb-txt').forEach(el => { el.innerHTML = bar; });
}
function toggleChat(open) { $('#rc').hidden = !open; if (open) { CHAT.unread = 0; renderChat(); setTimeout(() => $('#rcIn').focus(), 50); } }
$('#bChat').onclick = () => { P.sfx('click'); toggleChat($('#rc').hidden); };
$('#chatBar').onclick = () => { P.sfx('click'); toggleChat(true); };
$('#bChatL').onclick = () => { P.sfx('click'); toggleChat(true); };
$('#rcClose').onclick = () => { P.sfx('click'); toggleChat(false); };
$('#rcForm').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('#rcIn').value.replace(/\s+/g, ' ').trim().slice(0, 160); if (!v) return;
  $('#rcIn').value = '';
  if (net.role === 'host') chatIn(0, v, P.lang()); else if (net.conn && net.conn.open) net.conn.send({ t: 'chat', txt: v, l: P.lang() });
});
window.addEventListener('resize', renderChat);
P.addStrings({ fr: { joinedSys: '{name} a rejoint la partie' }, en: { joinedSys: '{name} joined the game' }, cs: { joinedSys: '{name} se připojil ke hře' } });
const gcHome = window.GChat ? GChat.mount($('#gchatHome'), { db: P.DB_URL, lang: P.lang, name: () => P.hasName() ? P.name() : '', needName: () => P.needName($('#inName')) }) : null;

/* ---------- Groupe d'amis ---------- */
function joinFromParty(c) { P.stopConfetti(); S = null; V = null; pendingJoin = c; if (!P.hasName()) { show('home'); nameOk(); return; } $('#mOnline').click(); }
if (window.Party) { Party.busy = () => !$('#game').hidden && !!V && V.phase !== 'end'; Party.onJoinHere = (g, c) => { joinFromParty(c); return true; }; }

/* ---------- Démarrage ---------- */
P.onLang(() => {
  if (net.role === 'guest' && net.conn && net.conn.open) net.conn.send({ t: 'lang', l: P.lang() });
  if (net.role === 'host' && net.roster[0]) { net.roster[0].lang = P.lang(); if (S && S.players[0]) S.players[0].lang = P.lang(); }
  renderSnd(); renderMus(); renderChat(); if (gcHome) gcHome.refresh();
  if (!$('#onWait').hidden) renderLobby(); if (V) render();
});
P.applyStatic(); renderSnd(); renderMus(); renderChat();
{ const jc = window.Party && Party.takeJoin(); if (jc) joinFromParty(jc); }
window.__cn = { get S() { return S; }, get V() { return V; }, net, get key() { return myKey; } };
// Skins : chargés au démarrage, puis mis à jour en direct
P.skinLive(() => { try { if (V && !$('#game').hidden) render(); else if (!$('#onWait').hidden) renderLobby(); if (typeof renderChat === 'function') renderChat(); } catch (e) {} });
})();
</script>
